// ----- Screen 3: Predicted splits -----
// Build the rows actually displayed: per-50 (per-25 for the 50), or per-100
// checkpoints for distance events when that view is selected.
// Median within-lap first-25 share of a 100 SCM, from 1,201 clean races (World Cup 2025,
// Westmont+Toronto+Carmel pooled): p1 = 1st-25 share of the DIVE 50, p3 = 3rd-25 share of
// the PUSH 50. Lap shapes differ (dive front-loads), so each 50's 25s use its own share.
const scm100Per25 = {
  Free:   { M: { p1: 0.4741, p3: 0.5000, n: 243 }, F: { p1: 0.4764, p3: 0.5016, n: 137 } },
  Back:   { M: { p1: 0.4829, p3: 0.5009, n: 142 }, F: { p1: 0.4862, p3: 0.5002, n: 140 } },
  Breast: { M: { p1: 0.4558, p3: 0.4928, n: 151 }, F: { p1: 0.4595, p3: 0.4933, n: 138 } },
  Fly:    { M: { p1: 0.4578, p3: 0.4916, n: 137 }, F: { p1: 0.4580, p3: 0.4916, n: 113 } },
};
// Median within-lap shares for a 200 SCM, from 1,004 clean races (World Cup 2025, 3 stops):
// p1 = 1st-25 share of the DIVE 50 (opening); pLast = last-25 share of the FINAL 50 (closing).
const scm200Per25 = {
  Free:   { M: { p1: 0.4704, pLast: 0.4934, n: 194 }, F: { p1: 0.4739, pLast: 0.4921, n: 134 } },
  Back:   { M: { p1: 0.4790, pLast: 0.4938, n: 112 }, F: { p1: 0.4803, pLast: 0.4930, n: 119 } },
  Breast: { M: { p1: 0.4555, pLast: 0.5013, n: 136 }, F: { p1: 0.4570, pLast: 0.5012, n: 113 } },
  Fly:    { M: { p1: 0.4538, pLast: 0.5026, n: 119 }, F: { p1: 0.4567, pLast: 0.5017, n: 77 } },
};
function buildDisplaySegments(r) {
  const isIM = r.stroke === 'IM';
  const per100 = !isIM && r.distance >= 400 && state.splitView === '100' && r.splits.length % 2 === 0;
  if (per100) {
    const all = [];
    for (let k = 0; k * 2 < r.splits.length; k++) {
      const a = 2 * k, b = 2 * k + 1;
      all.push({ time: r.splits[a] + r.splits[b], lo: r.lo[a] + r.lo[b], hi: r.hi[a] + r.hi[b] });
    }
    const n = all.length;
    // The middle 100s are identical (flat-middle model) — collapse them into one row.
    if (n >= 3) {
      const mid = all[1];
      // Distance events are paced near-even — all rows neutral (faster/slower), no front/back-end.
      return [
        { ...all[0], label: 'First 100', count: 1, half: 'middle' },
        { time: mid.time, lo: mid.lo, hi: mid.hi, label: `Middle 100s · 2–${n - 1}`, count: n - 2, half: 'middle' },
        { ...all[n - 1], label: 'Last 100', count: 1, half: 'middle' },
      ];
    }
    return all.map((row, k) => ({ ...row, label: `${(k + 1) * 100} m`, count: 1, half: 'middle' }));
  }
  // Per-50 view for distance free: First 50, one combined Middle 50s row, Last 50.
  if (!isIM && r.distance >= 400 && state.splitView === '50' && r.splits.length >= 3) {
    const n = r.splits.length;
    let midSum = 0;
    for (let i = 1; i < n - 1; i++) midSum += r.splits[i];
    const midCount = n - 2;
    // Distance events are paced near-even — all rows neutral (faster/slower), no front/back-end.
    return [
      { time: r.splits[0], lo: r.lo[0], hi: r.hi[0], label: 'First 50', count: 1, half: 'middle' },
      { time: midSum / midCount, lo: r.lo[1], hi: r.hi[1], label: `Middle 50s · 2–${n - 1}`, count: midCount, half: 'middle' },
      { time: r.splits[n - 1], lo: r.lo[n - 1], hi: r.hi[n - 1], label: 'Last 50', count: 1, half: 'middle' },
    ];
  }
  // SCM 100: four 25 m lines. Each predicted 50 is split into its two 25s using the MEDIAN
  // within-lap shape from real 100 SCM races (scm100Per25): a dive shape for lap 1 (p1) and a
  // push shape for lap 2 (p3), so the 25/75 marks reflect the actual race, not the standalone
  // 50. The 50 and 100 rows stay exactly on the pacing table (shares sum to 1 within each 50).
  // Falls back to the dive-both-laps 50 shape only if a stroke/sex is missing from the table.
  if (!isIM && r.pool === 'SCM' && r.distance === 100 && r.splits.length === 2) {
    const sp = scm100Per25[r.stroke] && scm100Per25[r.stroke][r.sex];
    let shares = sp ? [sp.p1, sp.p3] : null;
    if (!shares) {
      const t50 = getRatios(r.stroke, r.sex, 'SCM', 50);
      if (t50 && t50.median && t50.median.length === 2) { const fa = t50.median[0] / (t50.median[0] + t50.median[1]); shares = [fa, fa]; }
    }
    if (shares) {
      const out = [];
      [0, 1].forEach(j => {
        const fa = shares[j], fb = 1 - fa;
        out.push({ time: r.splits[j] * fa, lo: r.lo[j] * fa, hi: r.hi[j] * fa, label: (j * 50 + 25) + ' m (est.)', srIdx: j, half: j === 0 ? 'front' : 'middle' });
        out.push({ time: r.splits[j] * fb, lo: r.lo[j] * fb, hi: r.hi[j] * fb, label: (j * 50 + 50) + ' m', srIdx: j, half: j === 1 ? 'back' : 'middle' });
      });
      return out;
    }
  }
  const imL = isIM ? imLabels[r.distance] : null;
  const nSeg = r.splits.length;
  return r.splits.map((t, i) => ({
    time: t, lo: r.lo[i], hi: r.hi[i],
    label: imL ? imL[i] : `${(i + 1) * r.segLen} m`,
    // Front/back-end only on the true opening & closing splits (a pacing choice); the rest neutral.
    // IM uses stroke-strength labels instead, so leave null.
    half: isIM ? null : (i === 0 ? 'front' : (i === nSeg - 1 ? 'back' : 'middle')),
  }));
}

// A centered range bar (q25 left, median tick centre, q75 right).
function rangeBar(lo, hi, mid) {
  const w = Math.min(100, ((hi - lo) / mid) * 100);
  const pad = (100 - w) / 2;
  return `<div class="range-track"><div class="range-fill" style="left: ${pad.toFixed(1)}%; right: ${pad.toFixed(1)}%;"></div><div class="range-tick" style="left: 50%;"></div></div>`;
}

// 400 IM: grouped by stroke — each stroke's 100 (headline, dedicated IQR) with its two 50s below.
function renderIM400Splits(r) {
  const strokes = ['Fly', 'Back', 'Breast', 'Free'];
  const per50im = srPer50.IM && srPer50.IM[400] && srPer50.IM[400][r.sex]; // per-50 SR for the 8 legs
  const cap = 'text-[9px] uppercase tracking-wide text-faint';
  let cumMed = 0, cumFast = 0, cumSlow = 0; // cumulative at each 100 mark
  return strokes.map((stk, j) => {
    const a = 2 * j, b = 2 * j + 1;
    const h = r.splits[a] + r.splits[b];                              // 100 median = sum of its 50s
    const hlo = r.hundoLo ? r.hundoLo[j] : (r.lo[a] + r.lo[b]);       // dedicated 100 IQR
    const hhi = r.hundoHi ? r.hundoHi[j] : (r.hi[a] + r.hi[b]);
    const lg = stk.toLowerCase();
    // Cumulative to this 100 mark (median bracketed + fast/slow range). Skip the first 100 (fly),
    // where cumulative just repeats the split; the last (free) lands on the target.
    cumMed += h; cumFast += hlo; cumSlow += hhi;
    const cumBlock = j > 0
      ? `<div class="text-center mt-1.5 leading-tight">
           <div class="text-[10px] text-faint mono">(${formatTime(cumMed)})</div>
           <div class="text-[11px] text-slate-600 mono font-semibold">${formatTime(cumFast)} – ${formatTime(cumSlow)}</div>
         </div>`
      : '';
    const sub = [a, b].map((idx, si) => `
      <div class="px-4 py-2.5 flex items-center gap-3">
        <div class="flex-shrink-0" style="width:46px;">
          <span class="label-cap text-faint">${si === 0 ? '1st 50' : '2nd 50'}</span>
          ${per50im && per50im[idx] ? `<div class="text-[9px] text-faint">SR ${Math.round(per50im[idx].avg)} (${Math.round(per50im[idx].lo)}–${Math.round(per50im[idx].hi)})</div>` : ''}
        </div>
        <div class="flex-1">
          ${rangeBar(r.lo[idx], r.hi[idx], r.splits[idx])}
          <div class="flex justify-between text-[10px] text-faint mt-1 mono"><span>${formatTime(r.lo[idx])}</span><span>${formatTime(r.hi[idx])}</span></div>
        </div>
        <span class="hero-time text-lg text-right flex-shrink-0" style="width:62px;">${formatTime(r.splits[idx])}</span>
      </div>`).join('');
    return `
      <div class="${j < 3 ? 'border-b border-slate-100' : ''}">
        <div class="px-4 pt-3.5 pb-2.5">
          <div class="text-center mb-1.5">
            <span class="label-cap text-cyan-700">${stk} · 100</span>
            <div class="hero-time text-2xl leading-tight">${formatTime(h)}</div>
          </div>
          ${rangeBar(hlo, hhi, h)}
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">
            <span><span class="mono">${formatTime(hlo)}</span> <span class="${cap}">faster</span></span>
            <span><span class="${cap}">slower</span> <span class="mono">${formatTime(hhi)}</span></span>
          </div>
          ${cumBlock}
        </div>
        <div class="bg-slate-50/70">${sub}</div>
      </div>`;
  }).join('');
}

// Elite stroke-rate card for the Predicted splits screen (mean + min–max of finalists).
// Whole-event average; no IM data. The 50 also shows the 1st/2nd-25 rates.
function srCardHtml(r) {
  // Suppressed when per-50 SR is available (that's shown on each split row instead).
  if (srPer50[r.stroke] && srPer50[r.stroke][r.distance] && srPer50[r.stroke][r.distance][r.sex]) return '';
  const rec = srRef[r.stroke] && srRef[r.stroke][r.distance] && srRef[r.stroke][r.distance][r.sex];
  if (!rec) return '';
  const fifty = (r.distance === 50 && fiftyRatios[r.stroke]) ? fiftyRatios[r.stroke][r.sex] : null;
  const fiftyLine = fifty
    ? `<div class="text-[11px] text-muted mt-2 text-center">1st 25 <span class="mono font-semibold text-slate-700">${Math.round(fifty.sr1)}</span> · 2nd 25 <span class="mono font-semibold text-slate-700">${Math.round(fifty.sr2)}</span> cyc/min</div>`
    : '';
  return `
    <div class="bg-white rounded-2xl border border-slate-200 px-4 py-4">
      <div class="label-cap mb-2 text-muted">Elite stroke rate</div>
      <div class="text-center">
        <div class="hero-time text-3xl leading-tight">${Math.round(rec.avg)}<span class="text-sm text-muted font-normal"> cyc/min</span></div>
        <div class="text-[11px] text-muted mt-1">range <span class="mono">${Math.round(rec.min)}–${Math.round(rec.max)}</span></div>
      </div>
      ${fiftyLine}
    </div>`;
}

function renderPredictedSplits() {
  const r = state.result;
  if (!r || !r.splits || !r.splits.length) {
    const avail = availableEventsFor(state.form.stroke);
    return `
      <div class="statusbar"></div>
      ${screenHeader({ title: `Set target time`, cls: 'bg-white' })}
      <div class="p-8 text-center">
        <div class="text-slate-700 font-semibold text-sm mb-1">No data for this combination</div>
        <div class="text-slate-500 text-sm leading-relaxed">There's no ${state.form.distance} ${state.form.stroke} ${state.form.pool} in the dataset.</div>
        ${avail ? `<div class="text-xs text-muted mt-3 leading-relaxed">Available for <span class="font-semibold">${state.form.stroke}</span>: ${avail}</div>` : ''}
        <button class="mt-5 px-4 py-3 bg-cyan-600 text-white rounded-xl text-sm font-bold hover:bg-cyan-700 transition" data-action="back">Adjust event</button>
      </div>`;
  }

  const isIM = r.stroke === 'IM';
  const rows = buildDisplaySegments(r);
  // ----- Season target: the star, and where the gap to it actually lives -----
  const tgtName = ((state.swimmer && state.swimmer.name) || state.form.name || '').trim();
  const tgtOn = state.form.isTarget !== false;
  let tgtCard = '';
  if (tgtName) {
    const first = tgtName.split(' ')[0];
    const gp = targetGap(resolveSid(state.form), r.stroke, r.sex, r.pool, r.distance, r.targetSeconds);
    const sgn = (v) => (v > 0 ? '+' : '−') + Math.abs(v).toFixed(2);
    const worst = gp && gp.rows.length ? gp.rows.reduce((m, x) => (x.gap < m.gap ? x : m), gp.rows[0]) : null;
    const gapHtml = !gp ? `<div class="text-[11px] text-muted mt-3 pt-3 border-t border-slate-100">No recorded ${r.distance} ${r.stroke} ${r.pool} for ${first} yet — record one and this shows where the gap sits.</div>`
      : `<div class="mt-3 pt-3 border-t border-slate-100">
          <div class="text-[11px] text-muted mb-1.5">Best <span class="mono font-semibold text-slate-700">${formatTime(gp.bestTotal)}</span>${gp.date ? ' · ' + gp.date : ''} · <span class="font-semibold ${Math.abs(gp.gap) < 0.005 ? 'text-slate-600' : (gp.gap < 0 ? 'text-cyan-700' : 'text-rose-600')}">${Math.abs(gp.gap) < 0.005 ? 'the same as their best' : (gp.gap < 0 ? Math.abs(gp.gap).toFixed(2) + 's to find' : sgn(gp.gap) + 's slower than their best')}</span></div>
          ${gp.rows.length ? `<table class="w-full text-[12px]">
            <tr class="text-[9px] uppercase tracking-wide text-faint"><th class="text-left font-semibold pb-0.5"></th><th class="text-right font-semibold">Best</th><th class="text-right font-semibold">Target</th><th class="text-right font-semibold">Gap</th></tr>
            ${gp.rows.map((x) => `<tr>
              <td class="text-slate-600 py-0.5">${x.label}${worst && x === worst && x.gap < 0 ? ' <span class="text-[9px] text-amber-600 font-semibold">most</span>' : ''}</td>
              <td class="text-right mono text-slate-600">${formatTime(x.best)}</td>
              <td class="text-right mono text-slate-800 font-semibold">${formatTime(x.target)}</td>
              <td class="text-right mono font-semibold ${x.gap < 0 ? 'text-cyan-700' : 'text-rose-600'}">${sgn(x.gap)}</td>
            </tr>`).join('')}
          </table>` : `<div class="text-[11px] text-muted">This event records a total rather than matching splits, so only the overall gap is shown.</div>`}
        </div>`;
    tgtCard = `
      <div class="bg-white rounded-2xl border ${tgtOn ? 'border-amber-200' : 'border-slate-200'} p-4">
        <button class="w-full flex items-center gap-3 text-left" data-action="toggle-target">
          <span class="text-2xl leading-none ${tgtOn ? 'text-amber-500' : 'text-slate-300'}">${tgtOn ? '★' : '☆'}</span>
          <span class="flex-1 min-w-0">
            <span class="block font-bold text-[14px] text-slate-800">${tgtOn ? `${first}’s season target` : 'Saved plan only'}</span>
            <span class="block text-[11px] text-muted leading-snug">${tgtOn
              ? `Saving makes this ${first}’s target for the ${r.distance} ${r.stroke} ${r.pool}`
              : 'Tap the star to make this their season target'}</span>
          </span>
        </button>
        ${tgtOn ? gapHtml : ''}
      </div>`;
  }
  const per50 = srPer50[r.stroke] && srPer50[r.stroke][r.distance] && srPer50[r.stroke][r.distance][r.sex]; // per-50 SR (100/200/IM)
  const isDistanceCollapsed = r.distance >= 400 && !isIM; // shown as First / Middle / Last
  let cumRun = 0, fastCum = 0, slowCum = 0;
  const splitRows = rows.map((row, i) => {
    const rangeWidth = Math.min(100, ((row.hi - row.lo) / row.time) * 100);
    const padding = (100 - rangeWidth) / 2;
    // Running cumulatives (× count makes the collapsed distance middle contribute correctly, so
    // the Last row lands on the full event time). Median → cumRun; fast/slow envelope = the sum
    // of each split's q25 (quick end) and q75 (slow end) so far.
    cumRun  += row.time * (row.count || 1);
    fastCum += row.lo   * (row.count || 1);
    slowCum += row.hi   * (row.count || 1);
    const isFirstRow = i === 0, isLastRow = i === rows.length - 1;
    // Distance: cumulative on First + Last only (middle is collapsed). Others: every row but the
    // first (where cumulative would just repeat the split).
    const showCum = isDistanceCollapsed ? (isFirstRow || isLastRow) : !isFirstRow;
    // Cumulative median rides beside the split time; the fast/slow cumulative sit under
    // the 'faster' / 'slower' labels so each end lines up with the split it belongs to.
    const cumInline = showCum ? ` <span class="mono text-[15px] text-slate-500 font-semibold">(${formatTime(cumRun)})</span>` : '';
    const cumEnds = (showCum && !isLastRow)
      ? `<div class="flex justify-between text-[10px] text-faint mono mt-0.5"><span>(${formatTime(fastCum)})</span><span>(${formatTime(slowCum)})</span></div>`
      : '';
    // The faster time (q25) always sits on the left, slower (q75) on the right.
    // Only the *labels* change, and front/back-end is reserved for true opening/closing splits:
    //  • Opening split → faster = front-end (a front-loaded swimmer goes out fast).
    //  • Closing split → faster = back-end  (a back-loaded swimmer comes home fast) — reversed.
    //  • Everything else (200 middle 50s, all of distance) → neutral faster / slower.
    //  • IM legs       → "faster" / "slower".
    let leftCap = 'front-end', rightCap = 'back-end';
    if (isIM) {
      leftCap = 'faster'; rightCap = 'slower';
    } else if (row.half === 'middle') {
      leftCap = 'faster'; rightCap = 'slower';
    } else if (row.half === 'back') {
      leftCap = 'back-end'; rightCap = 'front-end';
    }
    const cap = 'text-[9px] uppercase tracking-wide text-faint';
    const ends = `<span><span class="mono">${formatTime(row.lo)}</span> <span class="${cap}">${leftCap}</span></span>
         <span><span class="${cap}">${rightCap}</span> <span class="mono">${formatTime(row.hi)}</span></span>`;
    return `
      <div class="px-4 pt-2.5 pb-3 ${i < rows.length - 1 ? 'border-b border-slate-100' : ''}">
        <div class="border-b border-slate-200 pb-1 mb-2">
          <span class="text-[13px] font-bold text-slate-700 tracking-wide">${row.label}</span>
        </div>
        <div class="text-center mb-1.5">
          <div class="leading-tight"><span class="hero-time text-2xl">${formatTime(row.time)}</span>${cumInline}</div>
          ${(() => { const sp = per50 && (row.srIdx != null ? per50[row.srIdx] : per50[i]); return sp ? `<div class="text-[10px] text-faint">SR ~${Math.round(sp.avg)} (${Math.round(sp.lo)}–${Math.round(sp.hi)}) cyc/min</div>` : ''; })()}
        </div>
        ${`<div class="relative">
          <div class="range-track">
            <div class="range-fill" style="left: ${padding.toFixed(1)}%; right: ${padding.toFixed(1)}%;"></div>
            <div class="range-tick" style="left: 50%;"></div>
          </div>
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">${ends}</div>
          ${cumEnds}
        </div>`}
      </div>
    `;
  }).join('');

  // 50 / 100 checkpoint toggle (distance events only)
  const viewToggle = (r.distance >= 400 && !isIM) ? `
    <div class="seg-group" style="max-width: 180px;">
      <div class="seg ${state.splitView === '50' ? 'active' : ''}" data-action="splitview" data-mode="50">Per 50</div>
      <div class="seg ${state.splitView === '100' ? 'active' : ''}" data-action="splitview" data-mode="100">Per 100</div>
    </div>` : '';

  // Top-end speed limiter check
  let limiterCallout = '';
  if (r.pb50 && state.swimmer && state.swimmer.pb50 && state.swimmer.pb50[r.stroke]) {
    const knownPB = state.swimmer.pb50[r.stroke];
    if (knownPB > r.pb50 + 0.3) {
      limiterCallout = `
        <div class="bg-amber-50 border border-amber-100 rounded-xl px-4 py-3.5 flex gap-3">
          <span class="text-amber-600 text-lg leading-none mt-0.5">⚠</span>
          <div class="flex-1">
            <div class="font-semibold text-amber-900 text-sm">Top-end speed is the limiter</div>
            <div class="text-xs text-amber-800 mt-1 leading-relaxed">For ${formatTime(r.targetSeconds)} you'd need a ${r.pb50.toFixed(1)}s 50. Your 50 PB is ${knownPB.toFixed(2)}s — work on top-end speed before this target is realistic.</div>
          </div>
        </div>
      `;
    }
  }

  let pb50Card = '';
  if (r.pb50) {
    const knownPB = state.swimmer?.pb50?.[r.stroke];
    const gap = knownPB ? knownPB - r.pb50 : null;
    const ok = knownPB && gap <= 0.3;
    const tone = !knownPB ? 'slate' : (ok ? 'emerald' : 'amber');
    const toneClasses = {
      amber:   { wrap: 'bg-amber-50 border-amber-200',   label: 'text-amber-700',   num: 'text-amber-900' },
      emerald: { wrap: 'bg-emerald-50 border-emerald-200', label: 'text-emerald-700', num: 'text-emerald-900' },
      slate:   { wrap: 'bg-slate-50 border-slate-200',   label: 'text-muted',       num: 'text-slate-900' },
    };
    const t = toneClasses[tone];
    const band = (r.pb50Lo != null && r.pb50Hi != null);
    const pbW = band ? Math.min(100, ((r.pb50Hi - r.pb50Lo) / r.pb50) * 100) : 0;
    const pbPad = (100 - pbW) / 2;
    pb50Card = `
      <div class="bg-white rounded-2xl border border-slate-200 px-4 py-4">
        <div class="label-cap mb-2 text-muted">50 m best time needed</div>
        <div class="text-center mb-1.5">
          <div class="hero-time text-3xl leading-tight">${r.pb50.toFixed(2)}</div>
        </div>
        ${band ? `
        <div class="relative">
          <div class="range-track">
            <div class="range-fill" style="left: ${pbPad.toFixed(1)}%; right: ${pbPad.toFixed(1)}%;"></div>
            <div class="range-tick" style="left: 50%;"></div>
          </div>
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">
            <span><span class="mono">${r.pb50Lo.toFixed(2)}</span> <span class="text-[9px] uppercase tracking-wide text-faint">front-end</span></span>
            <span><span class="text-[9px] uppercase tracking-wide text-faint">back-end</span> <span class="mono">${r.pb50Hi.toFixed(2)}</span></span>
          </div>
        </div>` : ''}
        ${knownPB ? `
          <div class="${t.wrap} border rounded-xl px-3.5 py-2.5 mt-3 flex items-center justify-between">
            <div class="text-[10px] font-bold uppercase tracking-wide ${t.label}">${state.swimmer.name.split(' ')[0]}'s 50 PB</div>
            <div class="flex items-baseline gap-2">
              <div class="hero-time text-lg ${t.num}">${knownPB.toFixed(2)}</div>
              <div class="text-[10px] ${t.label}">${gap > 0 ? `+${gap.toFixed(2)} off` : 'on pace'}</div>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }

  return `
    <div class="statusbar"></div>
    ${screenHeader({
      title: `${state.swimmer ? state.swimmer.name : (state.form.name || 'Set target time')}`,
      sub: `${r.distance} ${r.stroke} · ${r.pool} · ${r.sex === 'M' ? 'Men' : 'Women'}`,
      primary: `${state.planSaved
        ? '<button class="px-4 py-2.5 rounded-full bg-emerald-50 text-emerald-700 text-sm font-semibold flex-shrink-0" data-action="save">Saved ✓</button>'
        : `<button class="px-4 py-2.5 rounded-full bg-cyan-600 text-white text-sm font-semibold shadow-sm shadow-cyan-600/20 hover:bg-cyan-700 active:scale-[0.98] transition flex-shrink-0" data-action="save">${state.reviewId ? 'Update' : 'Save'}</button>`}`,
      secondary: hdrEditBtn('edit-plan'),
      exports: [['csv-page', 'Download CSV'], ['print-page', 'Download PDF']],
      cls: 'bg-white',
    })}

    <!-- Target time hero, with quick nudge controls -->
    <div class="px-5 py-3 bg-white border-b border-slate-100">
      <div class="bg-gradient-to-br from-cyan-50 to-white border border-cyan-100 rounded-2xl p-4">
        <div class="label-cap text-cyan-800 mb-1">Target · tap to edit</div>
        <div class="flex items-center justify-between gap-2">
          <input type="text" inputmode="decimal" data-target-edit value="${formatTime(r.targetSeconds)}"
                 class="hero-time text-4xl text-cyan-900 bg-transparent outline-none w-[150px]" aria-label="Target time" />
          <div class="flex items-center gap-2">
            <div class="flex">
              <button class="w-10 h-11 rounded-l-xl bg-white border border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="-1" title="Faster by 1.0s" aria-label="Faster by 1 second">−1</button>
              <button class="w-10 h-11 rounded-r-xl bg-white border border-l-0 border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="1" title="Slower by 1.0s" aria-label="Slower by 1 second">+1</button>
            </div>
            <div class="flex">
              <button class="w-10 h-11 rounded-l-xl bg-white border border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="-0.1" title="Faster by 0.1s" aria-label="Faster by 0.1 seconds">−.1</button>
              <button class="w-10 h-11 rounded-r-xl bg-white border border-l-0 border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="0.1" title="Slower by 0.1s" aria-label="Slower by 0.1 seconds">+.1</button>
            </div>
          </div>
        </div>
        ${state.swimmer && state.swimmer.bestEvent.stroke === r.stroke && state.swimmer.bestEvent.distance === r.distance ? `
        <div class="flex gap-1.5 mt-3 text-xs flex-wrap">
          <button class="px-2.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50 transition" data-action="target-preset" data-mode="pb">PB</button>
        </div>` : ''}
      </div>
    </div>

    <div class="scrollable px-5 py-3 space-y-4 bg-slate-50">
      ${limiterCallout}
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
          <div class="label-cap text-muted">Splits</div>
          <div class="flex items-center gap-2">${viewToggle}</div>
        </div>
        ${(isIM && r.distance === 400) ? renderIM400Splits(r) : splitRows}
      </div>
      ${srCardHtml(r)}
      ${pb50Card}
      ${tgtCard}
    </div>
  `;
}

// What events the dataset covers for a given stroke (for the no-data screen).
function availableEventsFor(stroke) {
  const out = [];
  const byStroke = ratios[stroke];
  if (!byStroke) return '';
  const combos = new Set();
  for (const sex of Object.keys(byStroke))
    for (const pool of Object.keys(byStroke[sex]))
      for (const d of Object.keys(byStroke[sex][pool])) combos.add(`${d}m ${pool}`);
  return Array.from(combos).sort((a, b) => parseInt(a) - parseInt(b)).join(', ');
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// ----- (legacy mock race analysis — unused in v2, superseded below) -----

// ============================================================
// RACE ANALYSIS
// ============================================================
// Row structure for an event's comparison (predicted vs actual).
// "Competition (Round)" — e.g. USport (Final). Either part may be missing.
function meetLabel(s) {
  const c = (s.competition || '').trim(), r = (s.round || '').trim();
  return c && r ? `${c} (${r})` : (c || (r ? `(${r})` : ''));
}

function raceRowDefs(stroke, distance, pool) {
  if (stroke === 'IM') {
    const labels = distance === 400 ? ['Fly 100', 'Back 100', 'Breast 100', 'Free 100']
                 : distance === 100 ? ['Fly 25', 'Back 25', 'Breast 25', 'Free 25']
                 : ['Fly', 'Back', 'Breast', 'Free'];
    return labels.map((l, i) => ({ key: 'r' + i, label: l, kind: distance === 400 ? 'hundo' : 'seg', idx: i }));
  }
  if (distance >= 400) {
    return [
      { key: 'first', label: 'First 50', kind: 'seg', idx: 0 },
      { key: 'mid', label: 'Middle 50 (avg)', kind: 'mid' },
      { key: 'last', label: 'Last 50', kind: 'seg', idxFromEnd: 0 },
    ];
  }
  if (distance === 50) {
    // SCM 50: two 25 m splits (25 m wall) — avoids entering the 50 time twice and yields
    // useful 25 splits. LCM 50 has no 25 wall, so it stays a single total box.
    if (pool === 'SCM') return [
      { key: 'r0', label: '25 m', kind: 'seg', idx: 0 },
      { key: 'r1', label: '50 m', kind: 'seg', idx: 1 },
    ];
    return [{ key: 'total', label: 'Time', kind: 'total' }];
  }
  const n = distance / 50;
  return Array.from({ length: n }, (_, i) => ({ key: 'r' + i, label: `${(i + 1) * 50} m`, kind: 'seg', idx: i }));
}

// Fields the coach actually types (400+ free: first/last/total; middle is derived).
function raceEntryFields(stroke, distance, pool) {
  if (stroke !== 'IM' && distance >= 400) {
    return [{ key: 'first', label: 'First 50' }, { key: 'last', label: 'Last 50' }, { key: 'total', label: 'Total time' }];
  }
  return raceRowDefs(stroke, distance, pool).map(r => ({ key: r.key, label: r.label }));
}

// Auto-fill the last split from the total once every earlier split is entered, so the
// coach types the total + all-but-one split and the remainder is computed. Returns true
// if it changed a value (caller re-renders). Skips 400+ free and single-box 50 LCM, and
// never overrides the last box while the coach is editing it (changedKey === last).
function autoLastSplit(changedKey) {
  if (state.view !== 'race-entry') return false;
  const f = state.form, rf = state.raceForm;
  const total = rf.times.target || 0;
  if (!(total > 0)) return false;
  if (f.stroke !== 'IM' && f.distance >= 400) return false; // uses first/last/total, not per-lap
  const segs = raceRowDefs(f.stroke, f.distance, f.pool).filter(d => d.kind === 'seg');
  if (segs.length < 2) return false;                         // single-box 50 LCM / nothing to derive
  const lastKey = segs[segs.length - 1].key;
  if (changedKey === lastKey) return false;                  // respect a manual last split
  const earlier = segs.slice(0, -1);
  if (!earlier.every(d => (rf.times[d.key] || 0) > 0)) return false; // wait for all earlier splits
  const sum = earlier.reduce((s, d) => s + (rf.times[d.key] || 0), 0);
  const rem = Math.round((total - sum) * 100) / 100;
  if (rem <= 0) return false;
  if (Math.abs((rf.times[lastKey] || 0) - rem) < 0.005) return false; // already correct
  rf.times[lastKey] = rem;
  return lastKey;   // the caller repaints just this box instead of re-rendering the screen
}

// Pre-fill the actual-split boxes with the predicted splits for the target (coach edits to real).
function seedRaceTimes() {
  const f = state.form;
  const prev = state.raceForm.times || {};
  const tgt = state.raceForm.times.target ?? f.targetSeconds ?? 120;
  const p = predict(f.stroke, f.sex, f.pool, f.distance, tgt);
  const times = { target: tgt };
  if (p) {
    if (f.stroke !== 'IM' && f.distance >= 400) {
      times.first = p.splits[0];
      times.last = p.splits[p.splits.length - 1];
      times.total = tgt;
    } else {
      raceRowDefs(f.stroke, f.distance, f.pool).forEach(def => {
        if (def.kind === 'hundo') { const j = def.idx; times[def.key] = p.splits[2 * j] + p.splits[2 * j + 1]; }
        else if (def.kind === 'seg') { const i = def.idxFromEnd != null ? p.splits.length - 1 - def.idxFromEnd : def.idx; times[def.key] = p.splits[i]; }
        else if (def.kind === 'total') { times.total = tgt; }
      });
    }
  }
  // Only boxes the coach has NOT typed into follow the time swam. Anything entered by hand
  // survives a re-seed — correcting the total by 0.1s must not wipe three real splits.
  const touched = state.raceForm.touched || {};
  Object.keys(touched).forEach((k) => { if (touched[k] && prev[k] != null) times[k] = prev[k]; });
  // A held split and freshly predicted neighbours would not add up to the time swam, so the
  // column on screen would contradict the swim. Stretch the untouched splits over whatever
  // time is left; the last of them absorbs the rounding so the total is exact.
  if (!(f.stroke !== 'IM' && f.distance >= 400)) {
    const segKeys = raceRowDefs(f.stroke, f.distance, f.pool).filter((d) => d.kind === 'seg').map((d) => d.key);
    const free = segKeys.filter((k) => !touched[k] && times[k] > 0);
    const held = segKeys.filter((k) => touched[k]).reduce((s, k) => s + (times[k] || 0), 0);
    const freeSum = free.reduce((s, k) => s + times[k], 0);
    const rem = Math.round((tgt - held) * 100) / 100;
    if (free.length && freeSum > 0 && rem > 0) {
      const scale = rem / freeSum;
      let acc = 0;
      free.forEach((k, i) => {
        if (i < free.length - 1) { times[k] = Math.round(times[k] * scale * 100) / 100; acc += times[k]; }
        else times[k] = Math.round((rem - acc) * 100) / 100;
      });
    }
  }
  state.raceForm.times = times;
}

function buildRaceComparison(race) {
  const t = race.times || {};
  const distFree = race.stroke !== 'IM' && race.distance >= 400;
  const defs = raceRowDefs(race.stroke, race.distance, race.pool);
  const scm50 = race.distance === 50 && race.pool === 'SCM'; // two-25-split 50
  // Actual total first — the shape bands are scaled to what they ACTUALLY swam,
  // so hitting/beating the goal doesn't get mislabelled "too fast".
  let actualTotal;
  if (distFree || (race.distance === 50 && !scm50)) actualTotal = t.total;      // single-box 50 (LCM) / 400+
  else if (scm50 && t.r0 == null && t.r1 == null) actualTotal = t.total || 0;   // legacy 50 SCM saved as one total (pre-25-split)
  else actualTotal = defs.reduce((s, def) => s + (def.kind === 'mid' ? 0 : (t[def.key] || 0)), 0); // sum segs (incl. 50 SCM's two 25s)
  // Splits are optional: if none were entered, fall back to the official time typed at the
  // top so the race is still a complete record (a total with no splits is a valid swim).
  if (!(actualTotal > 0)) actualTotal = race.targetSeconds || 0;
  const p = predict(race.stroke, race.sex, race.pool, race.distance, actualTotal);
  if (!p) return null;
  const nmid = p.splits.length - 2;
  const rows = defs.map(def => {
    let pred, lo = null, hi = null;
    if (def.kind === 'total') { pred = actualTotal; }
    else if (def.kind === 'mid') { pred = p.splits[1]; lo = p.lo[1]; hi = p.hi[1]; }
    else if (def.kind === 'hundo') {
      const j = def.idx; pred = p.splits[2 * j] + p.splits[2 * j + 1];
      lo = p.hundoLo ? p.hundoLo[j] : p.lo[2 * j] + p.lo[2 * j + 1];
      hi = p.hundoHi ? p.hundoHi[j] : p.hi[2 * j] + p.hi[2 * j + 1];
    } else {
      const i = def.idxFromEnd != null ? p.splits.length - 1 - def.idxFromEnd : def.idx;
      pred = p.splits[i]; lo = p.lo[i]; hi = p.hi[i];
    }
    let actual;
    if (def.kind === 'mid') actual = (t.total - t.first - t.last) / nmid;
    else actual = t[def.key];
    const cls = (lo != null && hi != null && actual != null) ? classifySplit(actual, lo, hi) : 'in-range';
    return { label: def.label, pred, lo, hi, actual, cls, delta: actual != null ? actual - pred : 0 };
  });
  const delta = actualTotal - race.targetSeconds;
  const hit = actualTotal <= race.targetSeconds + 0.05; // hit or beat the goal
  return { p, rows, actualTotal, target: race.targetSeconds, delta, hit,
           insights: raceInsights(rows, actualTotal, race.targetSeconds, hit) };
}

// Outcome-aware verdict: if they hit/beat the goal we celebrate first and coach the
// shape as an OPPORTUNITY; if they missed, we use the cautionary "it cost you" framing.
function raceInsights(rows, actualTotal, target, hit) {
  const out = [];
  const first = rows[0], last = rows[rows.length - 1];
  const firstFast = first && first.cls === 'too-fast';
  const firstSlow = first && first.cls === 'too-slow';
  const lastSlow = last && last.cls === 'too-slow';
  const lastFast = last && last.cls === 'too-fast';
  const anyLaterSlow = rows.slice(1).some(r => r.cls === 'too-slow');
  const anyLaterFast = rows.slice(1).some(r => r.cls === 'too-fast');
  const allIn = rows.length > 1 && rows.every(r => r.cls === 'in-range');
  const overBy = actualTotal - target;

  if (hit) {
    out.push({ tone: 'emerald', icon: '🎉', title: 'Nicely done hitting your target time!',
      body: overBy < -0.05 ? `Came in ${Math.abs(overBy).toFixed(2)}s under the goal — strong swim.` : `Right on the goal — strong swim.` });
    if (allIn) {
      out.push({ tone: 'emerald', icon: '✓', title: 'Textbook distribution',
        body: `Every split sat inside the elite range for that time — pacing was spot on. Bank this pattern.` });
    } else if (firstFast && (anyLaterSlow || lastSlow)) {
      const over = Math.abs(first.pred - first.actual);
      out.push({ tone: 'cyan', icon: '↗', title: 'Aggressive front half — and it worked',
        body: `Opened ~${over.toFixed(2)}s under the elite range and gave a little back late, but still made the time. There may be more there with a slightly more controlled opening.`,
        finals: `Next time: open ~${Math.max(0.2, over).toFixed(1)}s easier and hold the back half — you could go quicker.` });
    } else if (firstSlow && (anyLaterFast || lastFast)) {
      const under = Math.abs(first.actual - first.pred);
      out.push({ tone: 'cyan', icon: '↘', title: 'Saved it for the back — go out faster',
        body: `Opened ~${under.toFixed(2)}s over the elite range, then closed fast (under the range) and still made the time. You left speed on the table at the front.`,
        finals: `Next time: go out ~${Math.max(0.2, under).toFixed(1)}s quicker — you've shown the back-half speed to back it up, so a faster swim is right there.` });
    } else {
      out.push({ tone: 'cyan', icon: '•', title: 'Got the job done',
        body: `A few splits drifted outside the elite range but it didn't cost the result — smoothing those could find a touch more next time.` });
    }
  } else {
    if (firstFast && anyLaterSlow) {
      const over = Math.abs(first.pred - first.actual);
      out.push({ tone: 'amber', icon: '⚡', title: 'Went out too hard',
        body: `Opened ~${over.toFixed(2)}s under the elite range, then faded — and finished +${overBy.toFixed(2)}s over goal. The fast start cost the back half.`,
        finals: `Tonight: open about ${Math.max(0.2, over).toFixed(1)}s easier and protect the close.` });
    } else if (firstSlow && (anyLaterFast || lastFast)) {
      const under = Math.abs(first.actual - first.pred);
      out.push({ tone: 'amber', icon: '↘', title: 'Went out too easy',
        body: `Opened ~${under.toFixed(2)}s over the elite range and closed fast — that conservative start left +${overBy.toFixed(2)}s on the table. The back-half speed says the time is there.`,
        finals: `Tonight: go out ~${Math.max(0.2, under).toFixed(1)}s quicker — you've got the close to support it.` });
    } else if (lastSlow) {
      const fade = last.actual - last.pred;
      out.push({ tone: 'rose', icon: '🔻', title: 'Faded at the end',
        body: `The closing split ran +${fade.toFixed(2)}s over the elite range; finished +${overBy.toFixed(2)}s over goal — the time leaked late.`,
        finals: `Tonight: control the middle so the final split holds in range.` });
    } else if (allIn) {
      out.push({ tone: 'slate', icon: '•', title: 'Even race, just short of the time',
        body: `Distribution matched the elite shape — the +${overBy.toFixed(2)}s gap is speed/fitness, not pacing.` });
    } else {
      out.push({ tone: 'slate', icon: '•', title: `Missed goal by +${overBy.toFixed(2)}s`,
        body: `Mixed splits without one clear story — scan the chart to see where the time went.` });
    }
  }
  return out;
}

// 3-box time entry (min : sec . hundredths) bound by key into state.raceForm.times.
// Nothing at 400 m or shorter is ever 10+ minutes, so the minutes box takes one digit
// there (two for 800/1500) — fewer stray keystrokes on deck.
function minDigits(distance) { return (distance && distance <= 400) ? 1 : 2; }

// Write a time into an EXISTING min:sec.hh group without rebuilding the page. render()
// would replace every input node, which drops focus, closes the mobile keyboard and resets
// the scroll container — far too violent for "one derived number changed".
function paintTimeBoxes(key, seconds) {
  const grp = document.querySelector(`[data-tkey="${key}"]`);
  if (!grp) return false;
  // The caret is in this row: the coach is entering it by hand and their value wins. Report
  // success so the caller doesn't fall back to a full re-render.
  if (grp.contains(document.activeElement)) return true;
  const t = Math.max(0, seconds || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), h = Math.round((t - Math.floor(t)) * 100);
  const mi = grp.querySelector('.tb-min'), se = grp.querySelector('.tb-sec'), hh = grp.querySelector('.tb-hh');
  if (!mi || !se || !hh) return false;
  mi.value = String(m);
  se.value = String(s).padStart(2, '0');
  hh.value = String(h).padStart(2, '0');
  return true;
}

// Recompute the final split from the time swam and paint it in place. Deliberately never
// calls render(): a redraw is what used to throw the coach back to the top of the form. If the
// row somehow isn't on screen the state is still correct and the next natural redraw shows it.
function deriveLastSplit(changedKey) {
  const changed = autoLastSplit(changedKey);
  if (changed) paintTimeBoxes(changed, state.raceForm.times[changed]);
}

// Repaint every split box from state. Used when the time swam changes and the untouched
// splits are re-predicted: painting keeps the caret in the time box and the screen exactly
// where it is, which a render() would not.
function repaintRaceSplits() {
  const t = state.raceForm.times || {};
  Object.keys(t).forEach((k) => { if (k !== 'target' && t[k] != null) paintTimeBoxes(k, t[k]); });
}

// A re-entered time swam wins outright: every split goes back to the model's prediction
// for that time. Clearing `touched` is what makes this a full reset rather than the partial
// re-seed that only moved the boxes nobody had typed into.
function resetRaceSplits() {
  state.raceForm.touched = {};
  seedRaceTimes();
  repaintRaceSplits();
}

// A split the coach has typed into belongs to the coach: seedRaceTimes must never re-predict
// over it. 'target' IS the time swam and 'total' mirrors it, so neither can be claimed.
function markSplitTouched(key) {
  if (key === 'target' || key === 'total') return;
  const rf = state.raceForm;
  (rf.touched = rf.touched || {})[key] = true;
}

function timeBoxes(key, seconds, distance) {
  const md = minDigits(distance);
  const t = Math.max(0, seconds || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), h = Math.round((t - Math.floor(t)) * 100);
  return `<div class="flex items-center gap-1" data-tkey="${key}">
      <input class="tb tb-min" inputmode="numeric" maxlength="${md}" value="${m}" aria-label="minutes" />
      <span class="tb-sep">:</span>
      <input class="tb tb-sec" inputmode="numeric" maxlength="2" value="${String(s).padStart(2, '0')}" aria-label="seconds" />
      <span class="tb-sep">.</span>
      <input class="tb tb-hh" inputmode="numeric" maxlength="2" value="${String(h).padStart(2, '0')}" aria-label="hundredths" />
    </div>`;
}

// ----- Screen: Other tools -----
// Everything that isn't Record Races or Training Pace. The converter and adjacent events used
// to be private-only; they are in both builds now. The last two stay private.
// ===== Season targets =====
// A target is a saved plan carrying isTarget. Plans predate this, so treat a missing kind as
// 'plan' exactly as the rest of the app does.
function isPlan(s) { return !s.kind || s.kind === 'plan'; }
function targetFor(sid, stroke, pool, distance) {
  return state.saved.find((s) => isPlan(s) && s.isTarget && s.sid === sid
    && s.stroke === stroke && s.pool === pool && s.distance === distance) || null;
}
// Every swimmer holding a target at this pool + distance, whatever the stroke.
function targetsAt(pool, distance) {
  return state.saved.filter((s) => isPlan(s) && s.isTarget && s.sid && s.pool === pool && s.distance === distance);
}

// The gap between a target and the swimmer's best recorded race in the same event, split by
// split. Returns null when they've never raced it.
function targetGap(sid, stroke, sex, pool, distance, targetSeconds) {
  if (!sid || !(targetSeconds > 0)) return null;
  let best = null;
  state.saved.forEach((s) => {
    if (s.kind !== 'race' || s.sid !== sid) return;
    if (s.stroke !== stroke || s.pool !== pool || s.distance !== distance) return;
    const c = buildRaceComparison(s);
    const t = c ? c.actualTotal : 0;
    if (t > 0 && (!best || t < best.total)) best = { race: s, total: t };
  });
  if (!best) return null;
  const p = predict(stroke, sex, pool, distance, targetSeconds);
  const defs = raceRowDefs(stroke, distance, pool).filter((d) => d.kind === 'seg');
  const rows = [];
  // Only compare per segment when both sides describe the same segments. A 400+ race records
  // first/last/total while predict() returns eight 50 s — no honest row-by-row comparison.
  if (p && defs.length > 1 && defs.length === p.splits.length) {
    const seg = distance / defs.length;
    defs.forEach((d, i) => {
      const b = best.race.times && best.race.times[d.key];
      if (!(b > 0)) return;
      rows.push({ label: `${TP_ORD[i] || (i + 1) + 'th'} ${seg}`, best: b, target: p.splits[i], gap: p.splits[i] - b });
    });
  }
  return { bestTotal: best.total, date: best.race.date || '', gap: targetSeconds - best.total, rows };
}

// ===== Training Pace =====
// Which distances the model can predict for this pool, across every stroke. 50 m LCM has no
// entry in `ratios` — it comes from the separate fiftyRatios table via predict()'s fallback.
const TP_STROKES = ['Free', 'Back', 'Breast', 'Fly', 'IM'];
function tpDistances(pool) {
  const set = new Set();
  TP_STROKES.forEach((stroke) => {
    const byStroke = ratios[stroke] || {};
    Object.keys(byStroke).forEach((sex) => {
      const byPool = byStroke[sex] && byStroke[sex][pool];
      if (byPool) Object.keys(byPool).forEach((d) => set.add(+d));
    });
    if (pool === 'LCM' && fiftyRatios[stroke]) set.add(50);
  });
  return [...set].sort((a, b) => a - b);
}

// One entry per swimmer PER STROKE holding a recorded time at this pool + distance, alphabetical
// by first name. `basis` picks which of their swims sets the pace: 'best' (fastest) or 'recent'
// (latest date). Sex is per swimmer, read from their own race record — hence no sex picker.
// Segments come from buildDisplaySegments so a 100 SCM gets its four 25 s (25/75 modeled from
// real 100 SCM race splits), IM gets stroke legs, and 400+ gets the collapsed First/Middle/Last rows.
function trainingRows(pool, distance, basis) {
  const byKey = {};
  state.saved.forEach((s) => {
    if (s.kind !== 'race' || !s.sid) return;
    if (s.pool !== pool || s.distance !== distance) return;
    const c = buildRaceComparison(s);
    const t = c ? c.actualTotal : 0;
    if (!(t > 0)) return;
    const k = s.sid + '|' + s.stroke;
    (byKey[k] = byKey[k] || []).push({ race: s, t });
  });
  // Pacing off targets: a swimmer may hold a target for an event they haven't raced yet — the
  // common case early in a season — so seed those keys too.
  if (basis === 'target') {
    targetsAt(pool, distance).forEach((tg) => {
      const k = tg.sid + '|' + tg.stroke;
      if (!byKey[k]) byKey[k] = [];
    });
  }
  return Object.keys(byKey).map((k) => {
    const list = byKey[k];
    const sid = k.split('|')[0], stroke = k.split('|')[1];
    const pick = list.length ? (basis === 'recent'
      ? list.slice().sort((a, b) => (a.race.date || '').localeCompare(b.race.date || ''))[list.length - 1]
      : list.reduce((m, x) => (x.t < m.t ? x : m), list[0])) : null;
    const tg = basis === 'target' ? targetFor(sid, stroke, pool, distance) : null;
    // No target for this event: fall back to their best time and FLAG it, so the sheet never
    // silently mixes a target pace with a best-time pace.
    const fellBack = basis === 'target' && !tg;
    const total = tg ? tg.targetSeconds : (pick ? pick.t : 0);
    if (!(total > 0)) return null;
    const sex = (tg && tg.sex) || (pick && pick.race.sex) || 'M';
    const p = predict(stroke, sex, pool, distance, total);
    return {
      sid, stroke, sex, fellBack,
      name: swimmerName(sid) || (tg && tg.name) || (pick && pick.race.name) || '—',
      total, date: tg ? '' : (pick ? pick.race.date || '' : ''),
      segs: p ? buildDisplaySegments(p) : null,
      splits: (p && p.splits) || null,   // per-50 array, for the 400/800/1500 layouts
    };
  }).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
}

// Columns for one stroke at one event, in the order a coach calls the set: the 50 s first, then
// every 25 in order. (Target is rendered separately as the first column.)
const TP_ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
function tpCells(segs, stroke, pool, distance, splits, sex) {
  if (!segs || !segs.length) return [];
  // A 400 IM comes back as eight 50 s; it is swum and written as four 100 s, one per stroke.
  if (stroke === 'IM' && splits && splits.length === 8) {
    return ['Fly 100', 'Back 100', 'Breast 100', 'Free 100'].map((h, k) => ({
      h, v: splits[2 * k] + splits[2 * k + 1],
    }));
  }
  // Distance events: an opening block, the average middle 50 and its doubled 100, and a closing
  // block. Built from the per-50 splits, since buildDisplaySegments collapses without the 100.
  if (stroke !== 'IM' && splits && distance >= 400 && splits.length >= 8) {
    const n = splits.length;
    const ends = distance === 400 ? 1 : 2;                 // 400 opens/closes on a 50, 800+ on a 100
    const sum = (a, b) => splits.slice(a, b).reduce((s, x) => s + x, 0);
    const mid = sum(ends, n - ends) / (n - 2 * ends);      // mean of every 50 in between
    const lab = ends === 1 ? '50' : '100';
    return [
      { h: 'First ' + lab, v: sum(0, ends) },
      { h: 'Middle 50', v: mid },
      { h: 'Middle 100', v: mid * 2 },
      { h: 'Last ' + lab, v: sum(n - ends, n) },
    ];
  }
  if (pool === 'SCM' && distance === 100 && segs.length === 4 && stroke !== 'IM') {
    return [
      { h: '1st 50', v: segs[0].time + segs[1].time },
      { h: 'Mid 50', v: segs[1].time + segs[2].time },   // 25->75, excludes the dive
      { h: '2nd 50', v: segs[2].time + segs[3].time },
      { h: '1st 25', v: segs[0].time }, { h: '2nd 25', v: segs[1].time },
      { h: '3rd 25', v: segs[2].time }, { h: '4th 25', v: segs[3].time },
    ];
  }
  // 100 IM (SCM): the three rolling 50 combos coaches call, then the four 25 legs.
  if (pool === 'SCM' && distance === 100 && stroke === 'IM' && segs.length === 4) {
    return [
      { h: 'Fly-Bk', v: segs[0].time + segs[1].time },
      { h: 'Bk-Br', v: segs[1].time + segs[2].time },    // middle 50, excludes the dive
      { h: 'Br-Fr', v: segs[2].time + segs[3].time },
      { h: 'Fly', v: segs[0].time }, { h: 'Back', v: segs[1].time },
      { h: 'Breast', v: segs[2].time }, { h: 'Free', v: segs[3].time },
    ];
  }
  // SCM 200: the four 50s, then 1st 25 / 2nd 25 / last 25 modeled from real 200 SCM race medians
  // (scm200Per25) — dive-50 first-25 share and final-50 last-25 share, per stroke/sex.
  if (pool === 'SCM' && distance === 200 && stroke !== 'IM' && segs.length === 4) {
    const cells = segs.map((s, i) => ({ h: `${TP_ORD[i]} 50`, v: s.time }));
    const sp = scm200Per25[stroke] && scm200Per25[stroke][sex];
    if (sp) {
      const first50 = segs[0].time, last50 = segs[3].time;
      cells.push({ h: '1st 25', v: first50 * sp.p1 });
      cells.push({ h: '2nd 25', v: first50 * (1 - sp.p1) });
      cells.push({ h: 'Last 25', v: last50 * sp.pLast });
    }
    return cells;
  }
  // Uniform segments get "1st 50 / 2nd 50" style headings; collapsed 400+ rows and IM legs keep
  // the label buildDisplaySegments gave them.
  const uniform = segs.every((s) => !s.count || s.count === 1) && distance % segs.length === 0;
  const seg = uniform ? distance / segs.length : 0;
  return segs.map((s, i) => ({
    h: (stroke === 'IM' || !uniform) ? s.label : `${TP_ORD[i] || (i + 1) + 'th'} ${seg}`,
    v: s.time,
  }));
}

// ===== Training Pace: PDF download =====
// Loaded on demand, never at start-up: ~380 KB that most sessions never need. Resolves
// immediately once they're in memory, and the service worker caches them for offline use
// after the first successful download.
const TP_PDF_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
];
function tpPdfReady() {
  return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
}
function tpLoadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
}
function tpEnsurePdfLibs() {
  if (tpPdfReady()) return Promise.resolve();
  return TP_PDF_LIBS.reduce((p, src) => p.then(() => tpLoadScript(src)), Promise.resolve());
}

// Read the sheet that is ALREADY rendered rather than recomputing the numbers, so the PDF and
// the screen can never drift apart. Returns null when there's nothing to download.
function tpPdfModel() {
  const host = document.getElementById('tp-print');
  const table = host && host.querySelector('table');
  if (!table) return null;
  const title = (host.querySelector('[data-tp-title]') || {}).textContent || 'Training pace';
  const sub = (host.querySelector('[data-tp-sub]') || {}).textContent || '';
  const head = [[...table.querySelectorAll('thead th')].map((t) => t.textContent.trim())];
  const body = [];
  const rules = [];                       // body-row indexes that open a new stroke block
  [...table.querySelectorAll('tbody tr')].forEach((tr) => {
    const opensBlock = /border-t-2/.test(tr.getAttribute('class') || '');
    const ths = [...tr.querySelectorAll('th')];
    const tds = [...tr.querySelectorAll('td')];
    const cells = ths.length
      ? ths.map((t) => t.textContent.trim())                       // IM's own header row
      : tds.map((t, i) => {
          if (i === 0) { const d = t.querySelector('div'); return (d ? d.textContent : t.textContent).trim(); }
          return t.textContent.replace(/\s+/g, ' ').trim();
        });
    if (!cells.length) return;
    if (opensBlock) rules.push(body.length);
    body.push(cells);
  });
  return { title: title.trim(), sub: sub.trim(), head, body, rules };
}

function tpBuildPdf() {
  const m = tpPdfModel();
  if (!m) { showToast('Nothing to download'); return; }
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  const W = doc.internal.pageSize.getWidth();
  const M = 40;
  doc.setFontSize(14); doc.setTextColor(15, 23, 42);
  doc.text(m.title, M, 46);
  if (m.sub) { doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.text(m.sub, M, 61); }
  doc.autoTable({
    head: m.head, body: m.body, startY: 74, margin: { left: M, right: M },
    styles: { fontSize: 9, cellPadding: 4, textColor: [51, 65, 85], lineColor: [226, 232, 240], lineWidth: 0.5 },
    headStyles: { fillColor: [241, 245, 249], textColor: [30, 41, 59], fontStyle: 'bold' },
    columnStyles: { 0: { halign: 'left', fontStyle: 'bold' } },
    didParseCell: (d) => { if (d.column.index > 0) d.cell.styles.halign = 'right'; },
    // Redraw the block rule between strokes, from the same markers the screen uses.
    didDrawCell: (d) => {
      if (d.section === 'body' && d.column.index === 0 && m.rules.indexOf(d.row.index) > -1) {
        doc.setDrawColor(100, 116, 139); doc.setLineWidth(1.2);
        doc.line(M, d.cell.y, W - M, d.cell.y);
      }
    },
  });
  const name = ('Split Compass - ' + m.title).replace(/[^\w\s-]/g, '').replace(/\s+/g, ' ').trim();
  doc.save(name + '.pdf');
}

// Birth year, not age: a stored age silently goes wrong on a birthday. Year alone is also
// far less sensitive to hold than a full date of birth, which matters for a minor.
function selfBirthYear() { try { const v = +localStorage.getItem('sc_self_birthyear'); return v > 1900 ? v : null; } catch (e) { return null; } }
function setSelfBirthYear(y) { try { localStorage.setItem('sc_self_birthyear', y ? String(y) : ''); } catch (e) {} }
function swimmerBirthYear(sid) { const e = entriesOf(sid); for (let i = e.length - 1; i >= 0; i--) { if (e[i].by > 1900) return e[i].by; } return null; }
function setSwimmerBirthYear(sid, y) { const v = +y > 1900 ? +y : null; state.saved.forEach(s => { if (s.sid === sid) s.by = v; }); persistSaved(); }

// German age-group convention (Jahrgang): the age you reach in the calendar year of the
// swim, not your age on the day. Ages below 8 use the 8 table; above 18 uses "offen".
function rudolphAge(birthYear, whenISO) {
  if (!birthYear) return null;
  const yr = (whenISO && /^\d{4}/.test(whenISO)) ? +whenISO.slice(0, 4) : new Date().getFullYear();
  const a = yr - birthYear;
  if (a < 8) return { key: '8', shown: a, clamped: 'young' };
  if (a > 18) return { key: 'open', shown: a, clamped: 'open' };
  return { key: String(a), shown: a };
}

// Score is continuous, displayed rounded DOWN: 13.8 means you have earned 13, and the
// screen shows what 14 needs. Rounding up would hand out a level not yet swum.
function rudolphScore(sex, ageKey, stroke, dist, lcmSeconds) {
  const block = rudolph[sex + '|' + ageKey];
  if (!block || !(lcmSeconds > 0)) return null;
  let col = -1;
  RUD_EVENTS.forEach(([s, d], i) => { if (s === stroke && d === +dist) col = i; });
  if (col < 0) return null;
  const t20 = block[col][0] / 100, step = block[col][1] / 10000;
  // The table is published to hundredths and the compact form reproduces it to within
  // 0.01s, so swimming EXACTLY the published time must award that point. Compare with a
  // one-hundredth tolerance rather than trusting the reconstruction to the last digit.
  const TOL = 0.011;
  const raw = 20 - (lcmSeconds - t20) / step;
  const pts = Math.max(0, Math.min(20, raw));
  const whole = Math.max(0, Math.min(20, Math.floor(20 - (lcmSeconds - TOL - t20) / step)));
  const nextP = whole >= 20 ? null : whole + 1;
  return { raw, pts, whole, nextP,
           nextTime: nextP == null ? null : t20 + (20 - nextP) * step,
           atWhole: t20 + (20 - whole) * step, t20 };
}
