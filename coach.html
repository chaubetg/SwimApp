// convRatios is LCM/SCM, so SCM -> LCM multiplies and LCM -> SCM divides. Returns null when
// no paired-athlete ratio exists for that event rather than inventing one.
function convertCourse(sec, stroke, sex, dist, from, to) {
  if (from === to) return { s: sec, est: false };
  const r = convRatios[stroke] && convRatios[stroke][sex] && convRatios[stroke][sex][dist];
  if (!r || !r.mean) return null;
  if (from === 'SCM' && to === 'LCM') return { s: sec * r.mean, est: true };
  if (from === 'LCM' && to === 'SCM') return { s: sec / r.mean, est: true };
  return null;
}

// One row per standard that exists for this event, each compared in ITS OWN course —
// the swimmer's time is converted to meet the standard, never the other way round.
function standardRows(f) {
  const all = (stdTimes[f.sex] && stdTimes[f.sex][f.stroke] && stdTimes[f.sex][f.stroke][f.distance]) || {};
  const out = [];
  STD_DEFS.filter((d) => !f.src || f.src === 'all' || d.src === f.src).forEach((d) => {
    const target = all[d.k];
    if (target == null) return;
    const mine = f.seconds > 0 ? convertCourse(f.seconds, f.stroke, f.sex, f.distance, f.pool, d.course) : null;
    out.push({ d, target, mine: mine ? mine.s : null, est: mine ? mine.est : false,
               gap: mine ? mine.s - target : null });
  });
  out.sort((a, b) => (a.gap == null || b.gap == null) ? a.target - b.target : a.gap - b.gap);
  return out;
}

// Their fastest recorded swim for this exact event, or null. Uses the same
// buildRaceComparison total the rest of the app trusts, so it can never disagree with
// what Best times shows.
function stdBestFor(f) {
  const sid = f.sid || state.savedSid || (SWIMMER ? selfSid() : null);
  if (!sid) return null;
  const races = state.saved.filter((s) => s.kind === 'race' && s.sid === sid
    && s.stroke === f.stroke && s.pool === f.pool && +s.distance === +f.distance && s.sex === f.sex);
  let best = null;
  races.forEach((s) => {
    const c = buildRaceComparison(s);
    const t = c ? c.actualTotal : 0;
    if (t > 0 && (!best || t < best.t)) best = { t, date: s.date || '', meet: meetLabel(s) || '' };
  });
  return best;
}

// Called whenever the event changes. Pulls their best time in for the new event, or
// clears the box — a leftover time from the previous event would be measured against
// these standards as though it were real.
function stdSyncBest() {
  const f = state.stdForm;
  const b = stdBestFor(f);
  f.best = b;
  f.seconds = b ? b.t : 0;
  f.auto = !!b;
}

// The birth year in play: this swimmer's, or the one being typed on screen.
function stdBirthYear(f) {
  if (SWIMMER) return selfBirthYear();
  return f.sid ? swimmerBirthYear(f.sid) : null;
}

function rudolphCardHtml(f) {
  const by = stdBirthYear(f);
  if (!by) {
    return `<div class="bg-white border border-cyan-200 rounded-2xl p-4 space-y-2">
      <div class="font-semibold text-[15px] text-slate-800">What year were you born?</div>
      <div class="text-[11px] text-muted leading-snug">Rudolph points are age-graded, so the score means nothing without it. Stored once — the year, not your date of birth — and it never needs changing.</div>
      <div class="flex items-center gap-2 pt-1">
        <input type="number" inputmode="numeric" min="1900" max="2030" data-stdby placeholder="e.g. 2012"
          class="w-28 bg-slate-100 rounded-xl px-3 py-2.5 text-center mono font-bold text-[18px] text-cyan-800 outline-none focus:ring-2 focus:ring-cyan-300" />
        <button class="px-4 py-2.5 rounded-xl bg-cyan-600 text-white text-sm font-semibold hover:bg-cyan-700 active:scale-95 transition" data-action="std-save-by">Save</button>
      </div></div>`;
  }
  const when = (f.auto && f.best && f.best.date) ? f.best.date : '';
  const age = rudolphAge(by, when);
  const lcm = convertCourse(f.seconds, f.stroke, f.sex, f.distance, f.pool, 'LCM');
  if (!(f.seconds > 0)) return `<div class="bg-white border border-dashed border-slate-200 rounded-2xl px-4 py-4 text-center text-sm text-muted">Enter a time to score it.</div>`;
  if (!lcm) return `<div class="bg-white border border-dashed border-slate-200 rounded-2xl px-4 py-4 text-center text-sm text-muted">No conversion available for this event, so a short-course time can’t be scored against a long-course table.</div>`;
  const sc = rudolphScore(f.sex, age.key, f.stroke, f.distance, lcm.s);
  if (!sc) return `<div class="bg-white border border-dashed border-slate-200 rounded-2xl px-4 py-4 text-center text-sm text-muted">The Rudolph table doesn't cover ${f.distance} ${f.stroke}.</div>`;
  const band = sc.whole >= 18 ? 'world class' : sc.whole >= 14 ? 'national level'
             : sc.whole >= 10 ? 'strong regional' : sc.whole >= 6 ? 'developing' : 'early days';
  return `
    <div class="bg-gradient-to-br from-cyan-50 to-white border border-cyan-200 rounded-2xl px-4 py-4 text-center">
      <div class="label-cap text-cyan-800">Rudolph points</div>
      <div class="hero-time text-5xl mt-1 text-cyan-900">${sc.whole}<span class="text-2xl text-cyan-700">/20</span></div>
      <div class="text-[12px] text-cyan-800 mt-1">${band} for a ${age.shown}-year-old ${f.sex === 'M' ? 'boy' : 'girl'}</div>
      ${age.clamped === 'open' ? `<div class="text-[11px] text-muted mt-1">Scored on the open table — the age tables stop at 18.</div>` : ''}
      ${age.clamped === 'young' ? `<div class="text-[11px] text-muted mt-1">Scored on the 8-year-old table — the tables start at 8.</div>` : ''}
      ${lcm.est ? `<div class="text-[11px] text-amber-700 mt-1">Your ${f.pool} time converted to long course — estimate.</div>` : ''}
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-4 py-3 flex items-center gap-3 border-b border-slate-100">
        <div class="flex-1 min-w-0"><div class="font-semibold text-[14px] text-slate-800">You swam</div>
          <div class="text-[11px] text-muted mt-0.5">${f.pool === 'LCM' ? 'long course' : f.pool + ' · shown as long course'}</div></div>
        <div class="mono font-bold text-[15px] text-slate-700">${formatTime(lcm.s)}</div>
      </div>
      ${sc.nextP != null ? `<div class="px-4 py-3 flex items-center gap-3">
        <div class="flex-1 min-w-0"><div class="font-semibold text-[14px] text-cyan-900">${sc.nextP} points needs</div>
          <div class="text-[11px] text-muted mt-0.5">${formatTime(lcm.s - sc.nextTime)} faster</div></div>
        <div class="mono font-bold text-[15px] text-cyan-800">${formatTime(sc.nextTime)}</div>
      </div>` : `<div class="px-4 py-3 text-[13px] font-semibold text-emerald-800">20 out of 20 — world class for this age.</div>`}
    </div>
    <div class="text-[10px] text-faint leading-snug px-1">${RUD_AS_OF}. 20 points is world-class level for that age, benchmarked against the world top-ten average. Age is the age reached in the calendar year of the swim (Jahrgang). The table is long course.</div>`;
}

// ===== Team vs standards =====================================================
// The Training Pace table with the splits replaced by one column per standard: read down a
// column to see who is closest to a cut, read across a row to see one swimmer against all of
// them. Sources toggle independently so the table is only as wide as the question being asked.
const TS_SEXES = ['M', 'F'];

// Every swimmer's FASTEST swim at exactly this event, fastest first. The ranking is by the
// time as swum, never by a converted one, so the order is always a like-for-like comparison.
function teamStdRows(f) {
  const by = {};
  state.saved.forEach((s) => {
    if (s.kind !== 'race' || !s.sid) return;
    if (s.stroke !== f.stroke || +s.distance !== +f.distance || s.pool !== f.pool) return;
    const c = buildRaceComparison(s);
    const t = c ? c.actualTotal : 0;
    if (!(t > 0)) return;
    const cur = by[s.sid];
    if (!cur || t < cur.t) by[s.sid] = { sid: s.sid, t, date: s.date || '', sex: s.sex === 'F' ? 'F' : 'M' };
  });
  return Object.keys(by).map((sid) => Object.assign(by[sid], { name: swimmerName(sid) || '—' }))
    .sort((a, b) => a.t - b.t);
}

// The UNION of the standards across the sexes on screen. Men and women do not always have the
// same set at an event, and a per-sex column list would shift the columns halfway down the
// table; a standard a sex does not have renders blank instead.
function teamStdCols(f, sexes) {
  const has = {};
  sexes.forEach((sx) => {
    const all = (stdTimes[sx] && stdTimes[sx][f.stroke] && stdTimes[sx][f.stroke][f.distance]) || {};
    Object.keys(all).forEach((k) => { has[k] = 1; });
  });
  // In the order the chips are read, not the order STD_DEFS happens to be declared: with
  // Canada selected, a coach should not have to scroll past three Olympic columns to reach it.
  const order = { canada: 0, world: 1 };
  return STD_DEFS.filter((d) => f.src[d.src] && has[d.k])
    .map((d, i) => ({ d, i }))
    .sort((a, b) => (order[a.d.src] - order[b.d.src]) || (a.i - b.i))
    .map((x) => x.d);
}

function teamStdTarget(sex, f, k) {
  const all = (stdTimes[sex] && stdTimes[sex][f.stroke] && stdTimes[sex][f.stroke][f.distance]) || {};
  return all[k] == null ? null : all[k];
}

// One cell: how far this swimmer is from this cut, measured in the CUT's course — the swimmer's
// time moves to meet the standard, never the other way round, exactly as on the single-swimmer
// screen. `est` marks a cell whose comparison went through a course conversion.
function teamStdCell(r, d, f) {
  const target = teamStdTarget(r.sex, f, d.k);
  if (target == null) return null;
  const mine = convertCourse(r.t, f.stroke, r.sex, f.distance, f.pool, d.course);
  if (!mine) return { blocked: true };
  return { gap: mine.s - target, est: mine.est };
}

// Rudolph is a score out of 20, not a gap, so it is its own column. It needs a birth year and a
// long-course time; without either the cell says which is missing rather than inventing one.
function teamRudCell(r, f) {
  const by = swimmerBirthYear(r.sid);
  if (!by) return { noBy: true };
  const lcm = convertCourse(r.t, f.stroke, r.sex, f.distance, f.pool, 'LCM');
  if (!lcm) return { blocked: true };
  const age = rudolphAge(by, r.date);
  const sc = rudolphScore(r.sex, age.key, f.stroke, f.distance, lcm.s);
  if (!sc) return { blocked: true };
  return { pts: sc.whole, est: lcm.est, age: age.shown };
}

function teamStdDistances(f) {
  return [50, 100, 200, 400, 800, 1500].filter((d) =>
    TS_SEXES.some((sx) => stdTimes[sx] && stdTimes[sx][f.stroke] && stdTimes[sx][f.stroke][d] != null));
}

// One model, two consumers: the screen and the CSV. Sharing it is what stops a download from
// quietly disagreeing with the table it was taken from.
function teamStdModel() {
  const f = state.tsForm;
  if (f.pool === 'SCY') f.pool = 'SCM';
  const dists = teamStdDistances(f);
  if (dists.length && dists.indexOf(f.distance) < 0) f.distance = dists[0];
  const all = teamStdRows(f);
  const sexesPresent = TS_SEXES.filter((sx) => all.some((r) => r.sex === sx));
  const sxf = (f.sexFilter && sexesPresent.indexOf(f.sexFilter) >= 0) ? f.sexFilter : 'all';
  const q = (f.q || '').trim();
  const rows = all.filter((r) => (sxf === 'all' || r.sex === sxf) && nameMatches(r.name, q));
  const sexes = TS_SEXES.filter((sx) => rows.some((r) => r.sex === sx));
  return { f, dists, all, rows, sexes, sexesPresent, sxf, q,
           cols: teamStdCols(f, sexes), rud: !!f.src.rudolph };
}

function renderTeamStandards() {
  const m = teamStdModel();
  const f = m.f;
  const strokes = ['Free', 'Back', 'Breast', 'Fly', 'IM'];
  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const chip = (on) => `px-3 py-2 rounded-xl text-xs font-semibold border transition ${on
    ? 'bg-cyan-600 text-white border-cyan-600'
    : 'bg-white text-slate-700 border-slate-200 hover:border-cyan-300'}`;

  let anyEst = false, noYear = 0;
  let body = '';
  if (!m.all.length) {
    body = `<div class="px-4 py-10 text-center text-sm text-muted">No recorded ${f.distance} m ${f.stroke} ${f.pool} times yet.<br><span class="text-xs">Record a race at this event and the swimmer appears here.</span></div>`;
  } else if (!m.rows.length) {
    body = `<div class="px-4 py-10 text-center text-sm text-muted">${m.q ? 'No swimmer matches “' + esc(m.q) + '”.' : 'No swimmers in this filter.'}</div>`;
  } else if (!m.cols.length && !m.rud) {
    body = `<div class="px-4 py-10 text-center text-sm text-muted">No published standard for ${f.distance} m ${f.stroke} in the sets you have selected.</div>`;
  } else {
    const headRow = `<tr class="text-[10px] uppercase tracking-wide text-faint border-b-2 border-slate-400">
        <th class="text-left font-semibold py-1.5 pl-3">Swimmer</th>
        <th class="text-right font-semibold px-2">Best</th>
        ${m.cols.map((d) => `<th class="text-right font-semibold px-2 whitespace-nowrap">${d.label}<span class="text-slate-300"> ${d.course}</span></th>`).join('')}
        ${m.rud ? '<th class="text-right font-semibold px-2 whitespace-nowrap">Rudolph</th>' : ''}
      </tr>`;

    // The cut itself, once per sex block. Repeating it in every cell would be noise; a coach
    // reads the cut at the top of the block and the gaps underneath it.
    const cutRow = (sx, opensBlock) => `<tr class="ts-cut bg-slate-50 ${opensBlock ? 'border-t-2 border-slate-400' : ''}">
        <td class="py-1.5 pl-3 text-[10px] font-bold uppercase tracking-wide text-slate-500 whitespace-nowrap">${sx === 'M' ? 'Men' : 'Women'}${m.cols.length ? ' · cut' : ''}</td>
        <td></td>
        ${m.cols.map((d) => { const t = teamStdTarget(sx, f, d.k);
          return `<td class="text-right px-2 mono text-[12px] font-bold text-slate-500 whitespace-nowrap">${t == null ? '' : formatTime(t)}</td>`; }).join('')}
        ${m.rud ? '<td class="text-right px-2 mono text-[12px] font-bold text-slate-500">20</td>' : ''}
      </tr>`;

    const rowHtml = (r) => {
      const cells = m.cols.map((d) => {
        const c = teamStdCell(r, d, f);
        if (!c) return '<td class="px-2"></td>';
        if (c.blocked) return '<td class="text-right px-2 text-[12px] text-slate-300">—</td>';
        if (c.est) anyEst = true;
        const met = c.gap <= 0;
        return `<td class="text-right px-2 mono text-[13px] whitespace-nowrap ${met ? 'text-emerald-700 font-bold' : 'text-rose-600'}">${c.est ? '~' : ''}${met ? '−' : '+'}${formatTime(Math.abs(c.gap))}</td>`;
      }).join('');
      let rc = '';
      if (m.rud) {
        const c = teamRudCell(r, f);
        if (c.noBy) { noYear++; rc = '<td class="text-right px-2 text-[10px] text-amber-600 whitespace-nowrap">no year</td>'; }
        else if (c.blocked) rc = '<td class="text-right px-2 text-[12px] text-slate-300">—</td>';
        else { if (c.est) anyEst = true;
          rc = `<td class="text-right px-2 mono text-[13px] font-bold text-cyan-800">${c.est ? '~' : ''}${c.pts}</td>`; }
      }
      return `<tr class="ts-row border-t border-slate-100 clickable" data-tsrow="${r.sid}" data-name="${esc(r.name)}">
        <td class="py-2 pl-3">
          <div class="font-semibold text-[13px] leading-tight">${esc(r.name)}</div>
          ${r.date ? `<div class="text-[10px] text-faint leading-none mt-0.5">${r.date}</div>` : ''}
        </td>
        <td class="text-right px-2 mono text-[13px] font-bold text-cyan-800 whitespace-nowrap">${formatTime(r.t)}</td>
        ${cells}${rc}
      </tr>`;
    };

    let trs = '';
    m.sexes.forEach((sx, bi) => {
      trs += cutRow(sx, bi > 0);
      m.rows.filter((r) => r.sex === sx).forEach((r) => { trs += rowHtml(r); });
    });
    body = `<div class="overflow-x-auto"><table class="w-full tp-table ts-table"><thead>${headRow}</thead><tbody>${trs}</tbody></table></div>`;
  }

  const seg = (val, cur, attr, label) => `<div class="seg ${cur === val ? 'active' : ''}" data-${attr}="${val}">${label}</div>`;
  const srcChips = [['canada', 'Canada'], ['world', 'World'], ['rudolph', 'Rudolph']]
    .map(([k, l]) => `<button class="${chip(!!f.src[k])}" data-tssrc="${k}">${l}</button>`).join(' ');
  const search = m.all.length
    ? `<input type="text" data-ts-search value="${esc(f.q)}" placeholder="Search swimmer" class="w-full bg-slate-100 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-cyan-300 placeholder:text-muted" />` : '';

  // The columns are a choice, so the sheet has to say which choice it was printed with —
  // a page of gaps with no named source is unusable a week later.
  const chosen = [f.src.canada && 'Canada', f.src.world && 'World', f.src.rudolph && 'Rudolph']
    .filter(Boolean).join(' · ');
  m.legend = chosen + (m.sxf === 'all' ? '' : (m.sxf === 'M' ? ' · men' : ' · women'))
           + (m.q ? ' · "' + m.q + '"' : '');

  const notes = [];
  if (anyEst) notes.push('A <span class="mono">~</span> means the comparison crossed courses — that swimmer’s ' + f.pool + ' time converted to the standard’s course. It is an estimate; the official time is the one swum in that course.');
  if (noYear) notes.push(noYear + ' swimmer' + (noYear === 1 ? ' has' : 's have') + ' no birth year, so there is no Rudolph score. Tap the row to set it.');
  if (m.cols.length) notes.push('Standards as published: ' + STD_AS_OF + '. Junior eligibility depends on birth years set each year.');
  if (m.rud) notes.push(RUD_AS_OF + '. 20 is world-class for that age; age is the age reached in the calendar year of the swim. The table is long course.');

  return `
    <div class="statusbar"></div>
    ${screenHeader({
      title: `Team vs standards`,
      sub: `${f.distance} m ${f.stroke} · ${f.pool}`,
      exports: (m.rows.length && (m.cols.length || m.rud)) ? [['csv-page', 'Download CSV'], ['tp-download', 'Download PDF']] : [],
      cls: 'bg-white',
    })}
    <div class="scrollable bg-slate-50">
      <div class="mx-3 mt-3 bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
        <div>
          <div class="label-cap mb-2">Standards <span class="font-normal text-faint normal-case tracking-normal">· tap to add or remove columns</span></div>
          <div class="flex flex-wrap gap-1.5">${srcChips}</div>
        </div>
        <div>
          <div class="label-cap mb-2">Stroke</div>
          <div class="flex gap-1.5 flex-wrap">${strokes.map((s) => `<span class="pill pill-sm ${f.stroke === s ? 'active' : ''}" data-tsstroke="${s}">${s}</span>`).join('')}</div>
        </div>
        <div>
          <div class="label-cap mb-2">Pool${m.sexesPresent.length > 1 ? ' <span class="text-faint">and who</span>' : ''}</div>
          <div class="flex gap-2">
            <div class="seg-group flex-shrink-0">${seg('LCM', f.pool, 'tspool', 'LCM')}${seg('SCM', f.pool, 'tspool', 'SCM')}</div>
            ${m.sexesPresent.length > 1 ? `<div class="seg-group flex-1 min-w-0">${seg('all', m.sxf, 'ts-sex', 'All')}${seg('M', m.sxf, 'ts-sex', 'M')}${seg('F', m.sxf, 'ts-sex', 'F')}</div>` : ''}
          </div>
        </div>
        <div>
          <div class="label-cap mb-2">Distance</div>
          <div class="flex gap-1.5 flex-wrap">${m.dists.map((d) => `<span class="pill pill-sm ${f.distance === d ? 'active' : ''}" data-tsdist="${d}">${d}</span>`).join('')}</div>
        </div>
        ${search}
      </div>
      <div class="m-3 bg-white rounded-2xl border border-slate-200 overflow-hidden">
        ${m.rows.length && (m.cols.length || m.rud) ? `<div id="tp-print" class="bg-white">
          <div class="px-3 pt-3 pb-1">
            <div data-tp-title class="text-[15px] font-bold text-slate-900">${f.distance} m ${f.stroke} ${f.pool} — ${m.cols.length ? 'gap to the cut' : 'Rudolph points'}</div>
            <div data-tp-sub class="text-[11px] text-muted mt-0.5">${m.legend}</div>
          </div>
          ${body}
        </div>` : body}
      </div>
      <div class="px-4 pb-5 space-y-1.5">${notes.map((n) => `<div class="text-[10px] text-faint leading-snug">${n}</div>`).join('')}</div>
    </div>`;
}

function renderStandards() {
  const f = state.stdForm;
  if (f.pool === 'SCY') f.pool = 'SCM';
  const strokes = ['Free', 'Back', 'Breast', 'Fly', 'IM'];
  const dists = [50, 100, 200, 400, 800, 1500].filter((d) =>
    (stdTimes[f.sex] && stdTimes[f.sex][f.stroke] && stdTimes[f.sex][f.stroke][d] != null));
  if (dists.length && dists.indexOf(f.distance) < 0) { f.distance = dists[0]; stdSyncBest(); }
  const rows = standardRows(f);
  const next = rows.find((r) => r.gap != null && r.gap > 0);
  const cleared = rows.filter((r) => r.gap != null && r.gap <= 0).length;

  const head = f.seconds > 0 && next
    ? `<div class="bg-gradient-to-br from-cyan-50 to-white border border-cyan-200 rounded-2xl px-4 py-4 text-center">
         <div class="label-cap text-cyan-800">Next standard</div>
         <div class="hero-time text-4xl mt-1 text-cyan-900">${formatTime(next.gap)}</div>
         <div class="text-[12px] text-cyan-800 mt-1">off ${next.d.label} <span class="text-muted">(${next.d.course})</span></div>
         ${cleared ? `<div class="text-[11px] text-emerald-700 font-semibold mt-1.5">${cleared} standard${cleared === 1 ? '' : 's'} already met</div>` : ''}
       </div>`
    : f.seconds > 0
      ? `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl px-4 py-4 text-center">
           <div class="text-sm font-bold text-emerald-800">Every standard on this list is met.</div>
         </div>`
      : `<div class="bg-white border border-dashed border-slate-200 rounded-2xl px-4 py-4 text-center text-sm text-muted">Enter a time to see where it sits.</div>`;

  const rowHtml = rows.map((r) => {
    const met = r.gap != null && r.gap <= 0;
    const gapTxt = r.gap == null ? '' : (met ? '\u2212' + formatTime(-r.gap) : '+' + formatTime(r.gap));
    return `<div class="px-4 py-3 flex items-center gap-3 border-b border-slate-100 last:border-0">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[14px] ${met ? 'text-emerald-800' : 'text-slate-800'}">${r.d.label}
          <span class="text-[11px] font-normal text-muted">${r.d.course}</span></div>
        <div class="text-[11px] text-muted mt-0.5">${r.d.org}${r.d.note ? ' \u00b7 ' + r.d.note : ''}${r.est ? ' \u00b7 <span class="text-amber-700">your time converted, estimate</span>' : ''}</div>
      </div>
      <div class="text-right flex-shrink-0">
        <div class="mono font-bold text-[15px] ${met ? 'text-emerald-700' : 'text-slate-700'}">${formatTime(r.target)}</div>
        ${gapTxt ? `<div class="mono text-[11px] ${met ? 'text-emerald-700' : 'text-rose-600'}">${gapTxt}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const seg = (val, cur, attr, label) => `<div class="seg ${cur === val ? 'active' : ''}" data-${attr}="${val}">${label}</div>`;
  return `
    <div class="statusbar"></div>
    ${screenHeader({ title: `Compare to standards`, sub: `${f.name}`, exports: [['csv-page', 'Download CSV']] })}
    <div class="scrollable px-5 py-3 space-y-4 bg-slate-50">
      <div class="seg-group">
        <button class="seg ${f.src === 'canada' ? 'active' : ''}" data-stdsrc="canada">Canada</button>
        <button class="seg ${f.src === 'world' ? 'active' : ''}" data-stdsrc="world">World</button>
        <button class="seg ${f.src === 'rudolph' ? 'active' : ''}" data-stdsrc="rudolph">Rudolph</button>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
        <div>
          <div class="label-cap mb-2">Stroke</div>
          <div class="flex gap-2 flex-wrap">${strokes.map((s) => `<span class="pill ${f.stroke === s ? 'active' : ''}" data-stdstroke="${s}">${s}</span>`).join('')}</div>
        </div>
        <div class="flex gap-3">

// ===== Training splits (one swimmer, every event) ============================
// Same numbers as the coach's Training Pace table — literally the same function, filtered to
// this swimmer — so the two can never disagree about a target.
function swimmerSplitRows(pool, basis) {
  const sid = SWIMMER ? selfSid() : state.savedSid;
  if (!sid) return [];
  const ord = ['Free', 'Back', 'Breast', 'Fly', 'IM'];
  const out = [];
  tpDistances(pool).forEach((d) => {
    trainingRows(pool, d, basis).forEach((r) => {
      if (r.sid === sid) out.push(Object.assign({}, r, { distance: d }));
    });
  });
  out.sort((a, b) => a.distance - b.distance || ord.indexOf(a.stroke) - ord.indexOf(b.stroke));
  return out;
}

function renderTrainingSplits() {
  const f = state.tsplForm;
  if (f.pool === 'SCY') f.pool = 'SCM';
  const rows = swimmerSplitRows(f.pool, f.basis);
  const basisLab = f.basis === 'recent' ? 'most recent' : (f.basis === 'target' ? 'target' : 'best time');
  const chip = (on) => `px-3 py-2 rounded-xl text-xs font-semibold border transition ${on
    ? 'bg-cyan-600 text-white border-cyan-600'
    : 'bg-white text-slate-700 border-slate-200 hover:border-cyan-300'}`;
  const TP_ABBR = { Free: 'FR', Back: 'BK', Breast: 'BR', Fly: 'FLY', IM: 'IM' };

  let body = '', fellBack = 0;
  if (!rows.length) {
    body = `<div class="px-4 py-10 text-center text-sm text-muted">No recorded ${f.pool} times yet.<br><span class="text-xs">Record a race and its splits, and the pace for every event you swim appears here.</span></div>`;
  } else {
    // Every distance block has its own column shape, so the table pads to the widest of them
    // and short events simply leave the far columns empty.
    const byDist = {};
    rows.forEach((r) => { (byDist[r.distance] = byDist[r.distance] || []).push(r); });
    const dists = Object.keys(byDist).map(Number).sort((a, b) => a - b);
    const headsFor = (d) => {
      const r = byDist[d].find((x) => x.segs && x.segs.length);
      return r ? tpCells(r.segs, r.stroke, f.pool, d, r.splits, r.sex).map((c) => c.h) : [];
    };
    const nCol = Math.max(1, ...dists.map((d) => headsFor(d).length));
    const pad = (a) => a.concat(Array(Math.max(0, nCol - a.length)).fill(null));
    const headRow = (d, cls) => `<tr class="text-[10px] uppercase tracking-wide text-faint ${cls}">
        <th class="text-left font-semibold py-1.5 pl-3">${d} m</th>
        <th class="text-right font-semibold px-2">Time</th>
        ${pad(headsFor(d)).map((h) => `<th class="text-right font-semibold px-2 whitespace-nowrap">${h == null ? '' : h}</th>`).join('')}
      </tr>`;
    let thead = '', trs = '';
    dists.forEach((d, di) => {
      const heads = headsFor(d);
      // tpPdfModel() takes the PDF's header row from `thead th`, so the first block's header
      // has to be a real thead or the PDF is built with an empty one.
      if (di === 0) thead = headRow(d, 'border-b-2 border-slate-400');
      else trs += headRow(d, 'border-t-2 border-slate-400');
      byDist[d].forEach((r) => {
        if (r.fellBack) fellBack++;
        const cells = pad(tpCells(r.segs, r.stroke, f.pool, d, r.splits, r.sex));
        trs += `<tr class="border-t border-slate-100">
          <td class="py-2 pl-3">
            <div class="font-semibold text-[13px] whitespace-nowrap">${r.stroke}</div>
            ${r.date ? `<div class="text-[10px] text-faint leading-none mt-0.5 whitespace-nowrap">${r.date}</div>` : ''}
          </td>
          <td class="text-right px-2 whitespace-nowrap"><span class="mono text-[13px] font-bold text-cyan-800">${formatTime(r.total)}</span>${r.fellBack ? '<span class="text-[10px] text-amber-600">*</span>' : ''}</td>
          ${cells.map((c, i) => `<td class="text-right px-2 mono text-[13px] ${c && /((1st|2nd|3rd|4th|First|Last|Middle|Mid) ?(50|100)|Fly-Bk|Bk-Br|Br-Fr)$/.test(heads[i] || '') ? 'text-slate-900 font-semibold' : 'text-slate-600'}">${c ? formatTime(c.v) : ''}</td>`).join('')}
        </tr>`;
      });
    });
    body = `<div class="overflow-x-auto"><table class="w-full tp-table tspl-table"><thead>${thead}</thead><tbody>${trs}</tbody></table></div>`;
  }

  const group = (label, items, key) => `
    <div class="mb-3 last:mb-0">
      <div class="label-cap mb-1.5">${label}</div>
      <div class="flex flex-wrap gap-1.5">
        ${items.map(([v, lab]) => `<button class="${chip(String(f[key]) === String(v))}" data-tspl="${key}" data-tsplv="${v}">${lab}</button>`).join('')}
      </div>
    </div>`;

  return `
    <div class="statusbar"></div>
    ${screenHeader({
      title: `Training splits`,
      sub: `${f.pool} · from your ${basisLab}`,
      exports: rows.length ? [['csv-page', 'Download CSV'], ['tp-download', 'Download PDF']] : [],
      cls: 'bg-white no-print',
    })}
    <div class="scrollable bg-slate-50">
      <div class="px-5 py-4 bg-white border-b border-slate-100 no-print">
        ${group('Pool', [['LCM', 'LCM'], ['SCM', 'SCM']], 'pool')}
        ${group('Pace from', [['best', 'Best time'], ['recent', 'Most recent'], ['target', 'Target']], 'basis')}
      </div>
      <div class="m-3 bg-white rounded-2xl border border-slate-200 overflow-hidden">
        ${rows.length ? `<div id="tp-print" class="bg-white">
          <div class="px-3 pt-3 pb-1">
            <div data-tp-title class="text-[15px] font-bold text-slate-900">${selfName() ? selfName() + ' — ' : ''}${f.pool} training splits</div>
            <div data-tp-sub class="text-[11px] text-muted mt-0.5">Pace from your ${basisLab}</div>
          </div>
          ${body}
        </div>` : body}
      </div>
      ${fellBack ? `<div class="px-4 pb-3 text-[10px] text-faint leading-snug">* No target set for that event, so the pace comes from your best time instead.</div>` : ''}
      <div class="px-4 pb-5 text-[10px] text-faint leading-snug">Split shapes come from published race analysis of elite finals. Treat them as a reference for how a race that speed is usually paced, not a rule.</div>
    </div>`;
}

// ===== Who do you swim like? =================================================
// A-finalists from 21 international meets. The point is not that they are faster — it is the
// SHAPE: matched on how you take the race out, then what they do after that.
const FIN_MEETS = '21 international finals, 2009–2026';

let _finCache = {};
function finRows(course, sex, dist, stroke) {
  const key = course + '|' + sex + '|' + dist + '|' + stroke;
  if (_finCache[key]) return _finCache[key];
  const raw = FIN_SPLITS[key];
  if (!raw) return (_finCache[key] = []);
  const out = raw.split(';').map((r) => {
    const f = r.split(',');
    return { name: FIN_NAMES[+f[0]], nation: f[1], year: f[2],
             total: +f[3] / 100, splits: f.slice(4).map((x) => +x / 100) };
  });
  return (_finCache[key] = out);
}

// The swimmer's own race, cut into the segments the app actually records. Returns null where
// there is no shape to compare: a 50 LCM is one number, and 800/1500 keep only a first and
// last 50 while the finalist table holds those events per 100 — not the same thing, so they
// are left out rather than fudged.
function raceSegs(race) {
  const t = race.times || {};
  if (race.distance >= 800) return null;
  if (race.distance === 50 && race.pool !== 'SCM') return null;
  const defs = raceRowDefs(race.stroke, race.distance, race.pool);
  const distFree = race.stroke !== 'IM' && race.distance >= 400;
  if (distFree) {
    const first = t.first, last = t.last, total = t.total;
    if (!(first > 0 && last > 0 && total > first + last)) return null;
    const nMid = race.distance / 50 - 2;
    return { distFree: true, total,
             segs: [{ label: 'First 50', v: first },
                    { label: 'Middle 50 (avg)', v: (total - first - last) / nMid },
                    { label: 'Last 50', v: last }] };
  }
  const rows = defs.filter((d) => d.kind === 'seg' || d.kind === 'hundo');
  if (rows.length < 2) return null;
  const segs = [];
  for (const d of rows) {
    const v = t[d.key];
    if (!(v > 0)) return null;                    // a part-entered race has no shape to match
    segs.push({ label: d.label, v });
  }
  return { distFree: false, total: segs.reduce((s, x) => s + x.v, 0), segs };
}

// Fold a finalist's per-50 splits into the same segments. Their data is finer than the app's
// for some events (an SCM 200 is stored per 25), so the fold is always a whole-number grouping.
function finSegs(row, shape, race) {
  const sp = row.splits;
  if (shape.distFree) {
    if (sp.length < 4) return null;
    const mid = sp.slice(1, -1).reduce((s, x) => s + x, 0) / (sp.length - 2);
    return [sp[0], mid, sp[sp.length - 1]];
  }
  const n = shape.segs.length;
  if (sp.length === n) return sp.slice();
  if (sp.length % n !== 0) return null;
  const g = sp.length / n, out = [];
  for (let i = 0; i < n; i++) out.push(sp.slice(i * g, (i + 1) * g).reduce((s, x) => s + x, 0));
  return out;
}

// How much of the race went into the opening segment. This one number is the whole match:
// two swimmers with the same front-end share are taking the race out the same way, whatever
// their finishing times.
function frontShare(segs, total) { return segs[0] / total; }

// Everyone in the event, nearest way-of-racing first.
function swimLikeList(race) {
  const shape = raceSegs(race);
  if (!shape) return null;
  const mine = frontShare(shape.segs.map((s) => s.v), shape.total);
  const rows = finRows(race.pool, race.sex === 'F' ? 'F' : 'M', race.distance, race.stroke);
  const out = [];
  rows.forEach((r, i) => {
    const fs = finSegs(r, shape, race);
    if (!fs) return;
    const theirs = frontShare(fs, r.total);
    out.push({ i, row: r, fs, front: theirs, d: Math.abs(theirs - mine) });
  });
  out.sort((a, b) => a.d - b.d);
  return { shape, mine, list: out };
}

// The finalists who take the race out closest to this swimmer, and the median split shape of
// that group. One nearest neighbour is too close to be interesting — matching the front end
// tightly tends to match everything else — so the finding comes from a cohort, which is also
// a truer claim: this is what people who start like you do next, not what one person did once.
function swimLikeCohort(model, race, n) {
  const take = Math.min(n || 6, model.list.length);
  if (take < 3) return null;
  const grp = model.list.slice(0, take);
  const nSeg = grp[0].fs.length;
  const med = [];
  for (let i = 0; i < nSeg; i++) {
    const props = grp.map((c) => c.fs[i] / c.row.total).sort((a, b) => a - b);
    const m = props.length % 2 ? props[(props.length - 1) / 2]
      : (props[props.length / 2 - 1] + props[props.length / 2]) / 2;
    med.push(m);
  }
  const s = med.reduce((a, b) => a + b, 0);
  return { n: take, prop: med.map((x) => x / s), names: grp.map((c) => c.row.name) };
}

// One finalist against the swimmer. The third column is the point of the screen: their shape
// stretched over YOUR total, i.e. what your splits would be if you distributed the race the
// way they distribute theirs.
// The swimmer against the cohort's median shape. This is the headline finding, and the only
// place a "biggest gap" is claimed. Two segments cannot produce one — the opening share fixes
// the closing share — so those events get the match and no suggestion, which is what Gaël asked
// for.
function swimLikeVsCohort(race, model) {
  const shape = raceSegs(race);
  const co = shape && swimLikeCohort(model, race);
  if (!shape || !co) return null;
  const rows = shape.segs.map((s, i) => {
    const target = co.prop[i] * shape.total;
    return { label: s.label, mine: s.v, target, gap: s.v - target };
  });
  let worst = null;
  if (rows.length >= 3) {
    worst = rows.reduce((m, r) => (r.gap > m.gap ? r : m), rows[0]);
    if (worst.gap < 0.08) worst = null;
  }
  return { rows, worst, n: co.n };
}

function swimLikeCompare(race, cand) {
  const shape = raceSegs(race);
  if (!shape || !cand) return null;
  const rows = shape.segs.map((s, i) => {
    const atMine = cand.fs[i] / cand.row.total * shape.total;
    return { label: s.label, mine: s.v, theirs: cand.fs[i], atMine, gap: s.v - atMine };
  });
  return { rows, total: shape.total };
}

// ===== How would this have ranked at U SPORTS? ===============================
// The meet is short course, so a long-course swim has nothing to be ranked against and the
// card simply does not appear. Ranking is against each swimmer's fastest swim of that meet.
function uspField(race) {
  if (!race || race.pool !== 'SCM') return null;
  const raw = USP_TIMES[(race.sex === 'F' ? 'F' : 'M') + '|' + race.distance + '|' + race.stroke];
  if (!raw) return null;
  return raw.split(',').map((x) => +x / 100);
}

// Where a time would have come, plus the two lines that actually mean something to a
// university swimmer: the A final (top 8) and the B final (top 16).
function uspRank(race, seconds) {
  const field = uspField(race);
  if (!field || !(seconds > 0)) return null;
  // Ties place equal, and equalling the 8th time makes the final — so count how many were
  // strictly faster rather than how many are ahead in the sorted list.
  const faster = field.filter((t) => t < seconds - 0.0049).length;
  return {
    rank: faster + 1, n: field.length,
    win: field[0],
    aCut: field.length >= 8 ? field[7] : null,
    bCut: field.length >= 16 ? field[15] : null,
    inA: field.length >= 8 && seconds <= field[7] + 0.0049,
    inB: field.length >= 16 && seconds <= field[15] + 0.0049,
  };
}

function uspCardHtml(race, seconds) {
  const r = uspRank(race, seconds);
  if (!r) return '';
  const open = !!state.uspOpen;
  const head = `<button class="w-full px-4 py-3 flex items-center gap-3 text-left bg-slate-50 hover:bg-slate-100 active:bg-slate-100 transition" data-action="usp-toggle">
      <span class="flex-1 min-w-0">
        <span class="block font-semibold text-slate-800 text-[14px]">How would this have ranked at ${USP_MEET}?</span>
        <span class="block text-[11px] text-muted mt-0.5">${r.n} swimmers in this event</span>
      </span>
      <span class="text-slate-500 text-base font-bold flex-shrink-0">${open ? '–' : '+'}</span>
    </button>`;
  if (!open) return `<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">${head}</div>`;
  const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th'
    : n % 10 === 1 ? 'st' : n % 10 === 2 ? 'nd' : n % 10 === 3 ? 'rd' : 'th');
  const line = (label, val, note, good) => `<div class="px-4 py-2.5 flex items-center gap-3 border-t border-slate-100">
      <div class="flex-1 min-w-0"><div class="text-[13px] font-semibold text-slate-700">${label}</div>
        ${note ? `<div class="text-[11px] ${good ? 'text-emerald-700' : 'text-muted'} mt-0.5 leading-snug">${note}</div>` : ''}</div>
      <div class="mono font-bold text-[14px] text-slate-700 flex-shrink-0">${val}</div>
    </div>`;
  const gap = (cut) => formatTime(Math.abs(seconds - cut));
  return `<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
      ${head}
      <div class="px-4 py-4 text-center border-t border-slate-100">
        <div class="hero-time text-4xl text-slate-800">${ord(r.rank)}</div>
        <div class="text-[12px] text-muted mt-1">of ${r.n} at ${USP_MEET}</div>
      </div>
      ${r.aCut ? line('A final', formatTime(r.aCut),
          r.inA ? 'You would have been in it.' : gap(r.aCut) + ' outside', r.inA) : ''}
      ${r.bCut && !r.inA ? line('B final', formatTime(r.bCut),
          r.inB ? 'You would have been in it.' : gap(r.bCut) + ' outside', r.inB) : ''}
      ${line('Winner', formatTime(r.win), r.rank === 1 ? 'That was you.' : gap(r.win) + ' ahead of you', r.rank === 1)}
      <div class="px-4 py-2.5 text-[10px] text-faint leading-snug border-t border-slate-100">Short course, 12–14 March 2026. Each swimmer counted once, at their fastest swim of the meet — so this is where the time would have placed, not which heat it would have been in.</div>
    </div>`;
}

// ----- Screen: Who do you swim like? -----
function renderSwimLike() {
  const f = state.slForm;
  const sid = f.sid || (SWIMMER ? selfSid() : state.savedSid);
  const who = swimmerName(sid) || (SWIMMER ? (selfName() || '') : '');
  const evs = swimLikeEvents(sid);
  if (evs.length && !evs.some((e) => e.key === f.ev)) f.ev = evs[0].key;
  const ev = evs.find((e) => e.key === f.ev) || null;
  const model = ev ? swimLikeList(ev.race) : null;
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const chip = (on) => `px-3 py-2 rounded-xl text-xs font-semibold border transition ${on
    ? 'bg-cyan-600 text-white border-cyan-600'
    : 'bg-white text-slate-700 border-slate-200 hover:border-cyan-300'}`;

  let body;
  if (!evs.length) {
    body = `<div class="m-3 bg-white rounded-2xl border border-dashed border-slate-200 px-5 py-10 text-center text-sm text-muted">
      Nothing to compare yet.<br><span class="text-xs">Record a race with its splits and the finalists who swim like ${SWIMMER ? 'you' : 'them'} appear here. A 50 long course and the 800 and 1500 are left out — there is no split shape to match on.</span></div>`;
  } else if (!model || !model.list.length) {
    body = `<div class="m-3 bg-white rounded-2xl border border-dashed border-slate-200 px-5 py-10 text-center text-sm text-muted">No finalist data for this event yet.</div>`;
  } else if (f.pick != null) {
    body = swimLikeDetailHtml(ev, model, f.pick, who);
  } else {
    body = swimLikeListHtml(ev, model);
  }

  return `
    <div class="statusbar"></div>
    ${screenHeader({
      title: `Who do you swim like?`,
      sub: `${who ? who + ' · ' : ''}${ev ? ev.label : 'no events yet'}`,
      cls: 'bg-white',
    })}
    <div class="scrollable bg-slate-50">
      ${f.pick != null ? `<div class="px-5 pt-3 pb-1 bg-white">
        <button class="px-3.5 py-2 rounded-full bg-slate-100 text-slate-700 text-xs font-semibold hover:bg-slate-200 active:scale-95 transition" data-action="sl-back">‹ All finalists</button>
      </div>` : ''}
      ${evs.length > 1 && f.pick == null ? `<div class="px-5 py-4 bg-white border-b border-slate-100">
        <div class="label-cap mb-1.5">Your event</div>
        <div class="flex flex-wrap gap-1.5">${evs.map((e) => `<button class="${chip(e.key === f.ev)}" data-sl-ev="${esc(e.key)}">${e.label}</button>`).join('')}</div>
      </div>` : ''}
      ${body}
    </div>`;
}

// Every event this swimmer has a comparable race in, best time first, one entry per event.
function swimLikeEvents(sid) {
  if (!sid) return [];
  const by = {};
  state.saved.forEach((s) => {
    if (s.kind !== 'race' || s.sid !== sid) return;
    if (!finRows(s.pool, s.sex === 'F' ? 'F' : 'M', s.distance, s.stroke).length) return;
    const shape = raceSegs(s);
    if (!shape) return;
    const k = `${s.distance}|${s.stroke}|${s.pool}`;
    if (!by[k] || shape.total < by[k].total) by[k] = { key: k, race: s, total: shape.total,
      label: `${s.distance} ${s.stroke} ${s.pool}` };
  });
  return Object.values(by).sort((a, b) => a.race.distance - b.race.distance
    || a.label.localeCompare(b.label));
}

function swimLikeListHtml(ev, model) {
  const pct = (x) => (x * 100).toFixed(1) + '%';
  const co = swimLikeVsCohort(ev.race, model);
  const rows = model.list.map((c, i) => {
    const closest = i === 0;
    return `<button class="w-full px-4 py-3 flex items-center gap-3 text-left hover:bg-cyan-50/50 active:bg-cyan-50 transition border-b border-slate-100 last:border-0" data-sl-pick="${c.i}">
      <span class="w-7 text-center text-[11px] font-bold ${closest ? 'text-cyan-700' : 'text-slate-300'} flex-shrink-0">${i + 1}</span>
      <span class="flex-1 min-w-0">
        <span class="block font-semibold text-[14px] text-slate-800 truncate">${c.row.name}</span>
        <span class="block text-[11px] text-muted mt-0.5 truncate">${c.row.nation} · ${c.row.year} · out in ${pct(c.front)}</span>
        ${closest ? '<span class="inline-block mt-1 px-2 py-0.5 rounded-full bg-cyan-50 text-cyan-700 text-[10px] font-bold">closest to you</span>' : ''}
      </span>
      <span class="text-right flex-shrink-0">
        <span class="block mono font-bold text-[14px] text-slate-700">${formatTime(c.row.total)}</span>
      </span>
      <span class="text-slate-300 text-xl leading-none flex-shrink-0">›</span>
    </button>`;
  }).join('');
  return `
    <div class="px-5 pt-4 pb-2">
      <div class="text-[13px] text-slate-700 leading-snug">You take this race out in <span class="font-bold text-cyan-800">${pct(model.mine)}</span> of your total. These finalists are sorted by how close they are to that — not by how fast they went.</div>
    </div>
    ${co && co.worst ? `<div class="mx-3 mb-1 rounded-2xl bg-white border border-amber-200 px-4 py-3">
      <div class="label-cap text-amber-700">Where the race is</div>
      <div class="text-[13px] text-slate-800 leading-snug mt-1">Against the ${co.n} finalists who start like you, your <span class="font-bold">${co.worst.label}</span> is <span class="font-bold mono">${formatTime(co.worst.gap)}</span> slower than their shape says it should be at your time.</div>
    </div>` : ''}
    <div class="m-3 bg-white rounded-2xl border border-slate-200 overflow-hidden">${rows}</div>
    <div class="px-4 pb-5 text-[10px] text-faint leading-snug">A-finals from ${FIN_MEETS}. One swim per athlete per event, their fastest. The percentage is the share of the race in the opening ${ev.race.distance === 50 ? '25' : '50'}.</div>`;
}

function swimLikeDetailHtml(ev, model, pickIdx, who) {
  const cand = model.list.find((c) => c.i === pickIdx) || model.list[0];
  const cmp = swimLikeCompare(ev.race, cand);
  if (!cmp) return '<div class="m-3 px-5 py-10 text-center text-sm text-muted">Nothing to compare.</div>';
  const sgn = (v) => (v >= 0 ? '+' : '−') + formatTime(Math.abs(v));
  const rows = cmp.rows.map((r) => `<tr class="border-t border-slate-100">
      <td class="py-2.5 pl-2.5 text-[12px] font-semibold text-slate-700 whitespace-nowrap">${r.label}</td>
      <td class="text-right px-1.5 mono text-[12px] text-slate-800">${formatTime(r.mine)}</td>
      <td class="text-right px-1.5 mono text-[12px] text-slate-400">${formatTime(r.theirs)}</td>
      <td class="text-right px-1.5 mono text-[12px] font-bold text-cyan-800 whitespace-nowrap">${formatTime(r.atMine)}</td>
      <td class="text-right pr-2.5 pl-1 mono text-[11px] whitespace-nowrap ${Math.abs(r.gap) < 0.05 ? 'text-slate-400' : (r.gap > 0 ? 'text-rose-600' : 'text-emerald-700')}">${sgn(r.gap)}</td>
    </tr>`).join('');
  const rel = cand.row.total - cmp.total;

// ----- Screen: Training Pace -----
function renderTrainingPace() {
  const f = state.tpForm;
  const pools = ['LCM', 'SCM'];          // SCY hidden 2026-08-17 — see patch_no_scy.py
  if (f.pool === 'SCY') f.pool = 'SCM';
  const dists = tpDistances(f.pool);
  if (dists.length && dists.indexOf(f.distance) < 0) f.distance = dists[0];

  const chip = (on) => `px-3 py-2 rounded-xl text-xs font-semibold border transition ${on
    ? 'bg-cyan-600 text-white border-cyan-600'
    : 'bg-white text-slate-700 border-slate-200 hover:border-cyan-300'}`;
  const group = (label, items, key) => `
    <div class="mb-3">
      <div class="label-cap mb-1.5">${label}</div>
      <div class="flex flex-wrap gap-1.5">
        ${items.length
          ? items.map(([v, lab]) => `<button class="${chip(String(f[key]) === String(v))}" data-tp="${key}" data-tpv="${v}">${lab}</button>`).join('')
          : '<span class="text-xs text-muted">No events for this pool</span>'}
      </div>
    </div>`;

  const rows = state.tpShow ? trainingRows(f.pool, f.distance, f.basis) : null;
  // Stroke tabs: only the strokes with an event at this pool+distance.
  const availStrokes = rows ? TP_STROKES.filter((st) => predict(st, 'M', f.pool, f.distance, 100) || predict(st, 'F', f.pool, f.distance, 100)) : [];
  if (availStrokes.length && availStrokes.indexOf(f.stroke) < 0) f.stroke = availStrokes[0];
  const oneStroke = availStrokes.length <= 1;
  const tpQ = (f.q || '').trim();
  const sxf = f.sexFilter || 'all';
  const shownRows = rows ? rows.filter((r) => (oneStroke || r.stroke === f.stroke) && (sxf === 'all' || r.sex === sxf) && nameMatches(r.name, tpQ)) : null;
  const basisLab = f.basis === 'recent' ? 'most recent' : (f.basis === 'target' ? 'season target' : 'best');
  const TP_ABBR = { Free: 'FR', Back: 'BK', Breast: 'BR', Fly: 'FLY', IM: 'IM' };
  const TP_BLOCK = 'border-t-2 border-slate-400';   // the rule between stroke blocks
  let body = '';
  let anyEstimate = false;
  const fellBackCount = shownRows ? shownRows.filter((r) => r.fellBack).length : 0;

  if (rows && !rows.length) {
    body = `<div class="px-4 py-8 text-center text-sm text-muted">No recorded times for ${f.distance} m ${f.pool} yet.<br><span class="text-xs">Record a race at this distance and the swimmer appears here.</span></div>`;
  } else if (rows && shownRows && !shownRows.length) {
    body = `<div class="px-4 py-8 text-center text-sm text-muted">${tpQ ? 'No swimmer matches \u201c' + tpQ + '\u201d.' : 'No ' + f.stroke + ' times for ' + f.distance + ' m ' + f.pool + ' yet.'}</div>`;
  } else if (rows) {
    const byStroke = {};
    shownRows.forEach((r) => { (byStroke[r.stroke] = byStroke[r.stroke] || []).push(r); });
    // The four form strokes share a column shape at every event, so they share one header.
    // IM's splits are its stroke legs (a 400 IM is 4 legs, not First/Middle/Last), so if its
    // shape differs it gets its own header row inside the same table.
    const FORM = ['Free', 'Back', 'Breast', 'Fly'];
    const present = FORM.filter((s) => byStroke[s]);
    const shapeOf = (st) => {
      const r = byStroke[st].find((x) => x.segs && x.segs.length);
      return r ? tpCells(r.segs, st, f.pool, f.distance, r.splits, r.sex).map((c) => c.h) : [];
    };
    const mainHeads = present.length ? shapeOf(present[0]) : (byStroke.IM ? shapeOf('IM') : []);
    const imHeads = byStroke.IM ? shapeOf('IM') : [];
    const nCol = Math.max(mainHeads.length, imHeads.length);
    anyEstimate = f.pool === 'SCM' && f.distance === 100 && present.length > 0;
    const pad = (arr) => arr.concat(Array(Math.max(0, nCol - arr.length)).fill(null));

    const headRow = (heads, cls) => `<tr class="text-[10px] uppercase tracking-wide text-faint ${cls}">
        <th class="text-left font-semibold py-1.5 pl-3">Swimmer</th>
        <th class="text-right font-semibold px-2">Target</th>
        ${pad(heads).map((h) => `<th class="text-right font-semibold px-2 whitespace-nowrap">${h == null ? '' : h}</th>`).join('')}
      </tr>`;

    const rowHtml = (r, heads, opensBlock) => {
      const cells = pad(tpCells(r.segs, r.stroke, f.pool, f.distance, r.splits, r.sex));
      return `<tr class="tp-row ${opensBlock ? TP_BLOCK : 'border-t border-slate-100'}" data-name="${r.name}">
        <td class="py-2 pl-3">
          <div class="font-semibold text-[13px] whitespace-nowrap">${r.name}</div>
          ${r.date ? `<div class="text-[10px] text-faint leading-none mt-0.5">${r.date}</div>` : ''}
        </td>
        <td class="text-right px-2 whitespace-nowrap"><span class="mono text-[13px] font-bold text-cyan-800">${formatTime(r.total)}</span> <span class="text-[10px] font-semibold text-slate-500">(${TP_ABBR[r.stroke] || r.stroke})</span></td>
        ${cells.map((c, i) => `<td class="text-right px-2 mono text-[13px] ${c && /((1st|2nd|3rd|4th|First|Last|Middle|Mid) ?(50|100)|Fly-Bk|Bk-Br|Br-Fr)$/.test(heads[i] || '') ? 'text-slate-900 font-semibold' : 'text-slate-600'}">${c ? formatTime(c.v) : ''}</td>`).join('')}
      </tr>`;
    };

    let trs = '';
    present.forEach((st, bi) => {
      byStroke[st].forEach((r, ri) => { trs += rowHtml(r, mainHeads, ri === 0 && bi > 0); });
    });
    if (byStroke.IM) {
      const sameShape = JSON.stringify(imHeads) === JSON.stringify(mainHeads);
      if (!sameShape && present.length) trs += headRow(imHeads, TP_BLOCK);
      byStroke.IM.forEach((r, ri) => { trs += rowHtml(r, imHeads, ri === 0 && present.length > 0 && sameShape); });
    }
    body = `<div class="overflow-x-auto"><table class="w-full tp-table"><thead>${headRow(mainHeads, 'border-b-2 border-slate-400')}</thead><tbody>${trs}</tbody></table></div>`;
  }

  const strokeChips = (rows && rows.length && !oneStroke)
    ? availStrokes.map((st) => `<button class="${chip(f.stroke === st)}" data-tp-stroke="${st}">${st}</button>`).join(' ') : '';
  const sexesPresent = rows ? [...new Set(rows.map((r) => r.sex))] : [];
  const sexChips = (rows && rows.length && sexesPresent.length > 1)
    ? [['all', 'All'], ['M', 'Men'], ['F', 'Women']].map(([v, l]) => `<button class="${chip(sxf === v)}" data-tp-sex="${v}">${l}</button>`).join(' ') : '';
  const tpSearch = (rows && rows.length)
    ? `<input type="text" data-tp-search value="${f.q || ''}" placeholder="Search swimmer" class="w-full mt-2 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-cyan-300 placeholder:text-muted" />` : '';
  const sheet = rows && rows.length ? `
    <div id="tp-print" class="bg-white">
      <div class="px-3 pt-3 pb-1">
        <div data-tp-title class="text-[15px] font-bold text-slate-900">${f.distance} m ${f.pool} — training pace</div>
      </div>
      ${body}
    </div>` : body;

  return `
    <div class="statusbar"></div>
    ${screenHeader({
      title: `Training Pace`,
      sub: `${f.distance} m · ${f.pool} · ${f.basis === 'recent' ? 'most recent' : (f.basis === 'target' ? 'target' : 'best time')}`,
      exports: (rows && rows.length) ? [['csv-page', 'Download CSV'], ['tp-download', 'Download PDF']] : [],
      cls: 'bg-white no-print',
    })}
    <div class="scrollable bg-slate-50">
      <div class="px-5 py-4 bg-white border-b border-slate-100 no-print">
        ${group('Pool', pools.map((p) => [p, p]), 'pool')}
        ${group('Distance', dists.map((d) => [d, d + ' m']), 'distance')}
        ${group('Pace from', [['best', 'Best time'], ['recent', 'Most recent'], ['target', 'Target']], 'basis')}
        <button class="w-full bg-cyan-600 text-white font-semibold rounded-xl py-3.5 text-sm hover:bg-cyan-700 active:scale-[0.99] transition shadow-lg shadow-cyan-600/20" data-action="tp-show">Show Training Table</button>
      </div>
      ${rows && rows.length ? `<div class="mx-3 mt-3 no-print">${strokeChips ? `<div class="flex flex-wrap gap-1.5">${strokeChips}</div>` : ''}${sexChips ? `<div class="flex flex-wrap gap-1.5 mt-2">${sexChips}</div>` : ''}${tpSearch}</div>` : ''}
      ${rows ? `<div class="m-3 bg-white rounded-2xl border border-slate-200 overflow-hidden">${sheet}</div>` : ''}
    </div>`;
}
