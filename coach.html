// Expected last-15 SR: the swimmer's own early-race SR × the elite late-race ratio.
// Ratio = SR over the last 20 m of the race (excluding the final 5 m, i.e. the last-25
// video segment) ÷ early-race SR, per swimmer, averaged over the Paris 2024 + Fukuoka
// 2023 finals (50m_sprint_data.csv, sr_per25_by_swimmer.csv). Early-race baseline
// matches what the coach types: 50 → 1st-25 SR · 100 → first-50 SR · 200 → mean SR of
// the first three 50s. Sprints decay (~-2…-4%); 200s finish faster (Breast M +28%).
const mmSrDrop = {
  '50':  { Free: { M: 0.964, F: 0.961 }, Back: { M: 0.963, F: 0.971 }, Fly: { M: 0.981, F: 0.971 }, Breast: { M: 0.997, F: 0.994 } },
  '100': { Free: { M: 0.978, F: 0.966 }, Back: { M: 0.978, F: 0.952 }, Fly: { M: 0.983, F: 0.978 }, Breast: { M: 1.070, F: 1.046 } },
  '200': { Free: { M: 1.051, F: 1.029 }, Back: { M: 1.073, F: 0.993 }, Fly: { M: 1.016, F: 1.005 }, Breast: { M: 1.285, F: 1.148 } },
};
function expectedLast15(race) {
  const d = mmSrDrop[String(race.distance)];
  const t = d && d[race.stroke];
  const fac = t && t[race.sex];
  if (!fac) return null; // IM and 400+ have no reference
  const sr = race.sr || {};
  const num = (x) => { const v = parseFloat(x); return isFinite(v) && v > 0 ? v : null; };
  let base;
  if (race.distance === 50) base = num(sr.first25);
  else if (race.distance === 100) base = num(sr.r0);
  else {
    const xs = [num(sr.r0), num(sr.r1), num(sr.r2)].filter(v => v != null);
    base = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
  }
  return base ? base * fac : null;
}

// ----- Screen: Race analysis -----
function renderRaceAnalysis() {
  const race = state.race;
  if (!race) return renderRoster();
  const c = buildRaceComparison(race);
  if (!c) return `<div class="statusbar"></div><div class="p-8 text-center text-slate-500 text-sm">No pacing data for this event.</div>`;
  const beat = c.delta <= 0.05;
  const deltaColor = beat ? 'text-emerald-700' : 'text-rose-600';
  const deltaBg = beat ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100';
  const sr = race.sr || {};
  // Data-entry check: the total typed at the top vs what the splits add up to.
  // (LCM 50 and 400+ take the total directly, so they can't disagree; SCM 50 and the
  // 100/200 sum their splits, so this catches a typo.)
  const _mm = (race.targetSeconds > 0 && c.actualTotal > 0) ? c.actualTotal - race.targetSeconds : 0;
  const mismatch = Math.abs(_mm) > 0.10 ? _mm : null;
  const expL = PUBLIC_BUILD ? null : expectedLast15(race); // V1 keeps stroke rate simple: no expected last-15
  const defs = raceRowDefs(race.stroke, race.distance, race.pool);
  const pt = predict(race.stroke, race.sex, race.pool, race.distance, race.targetSeconds);
  const predAt = defs.map(def => {
    if (!pt) return null;
    if (def.kind === 'total') return race.targetSeconds;
    if (def.kind === 'mid') return pt.splits[1];
    if (def.kind === 'hundo') return pt.splits[2 * def.idx] + pt.splits[2 * def.idx + 1];
    const i = def.idxFromEnd != null ? pt.splits.length - 1 - def.idxFromEnd : def.idx;
    return pt.splits[i];
  });
  const GT = 'display:grid;grid-template-columns:minmax(0,1fr) 4rem 4rem 2.9rem 2.1rem;gap:4px;align-items:center;';
  const head = `<div style="${GT}" class="px-3 pt-3 pb-1"><span class="label-cap text-muted">Split</span><span class="label-cap text-muted" style="text-align:right;">Ideal</span><span class="label-cap text-muted" style="text-align:right;">Swum</span><span class="label-cap text-muted" style="text-align:right;">Δ</span><span class="label-cap text-muted" style="text-align:center;">SR</span></div>`;
  // Running cumulatives shown in () beside each split — skipped on the first row (it would
  // repeat the split), on the averaged middle row, and on single-row (50 m) events.
  let cumP = 0, cumA = 0;
  const splitRows = c.rows.map((r, i) => {
    const def = defs[i], pred = predAt[i];
    const d = (r.actual != null && pred != null) ? r.actual - pred : null;
    const dc = d == null ? 'text-slate-400' : (d > 0.05 ? 'text-rose-600' : (d < -0.05 ? 'text-emerald-700' : 'text-slate-500'));
    if (pred != null && def.kind !== 'total' && def.kind !== 'mid') cumP += pred;
    if (r.actual != null && def.kind !== 'total' && def.kind !== 'mid') cumA += r.actual;
    // No cumulative on the first split (repeats it) or the last (that's the finish time).
    const showCum = i > 0 && i < c.rows.length - 1 && def.kind !== 'total' && def.kind !== 'mid';
    const cumTag = (v) => showCum ? `<div class="mono text-[10px] text-faint leading-none mt-0.5">(${formatTime(v)})</div>` : '';
    return `<div style="${GT}" class="px-3 py-2 border-b border-slate-100 last:border-0">
      <div class="text-sm font-semibold text-slate-700 leading-tight">${r.label}</div>
      <div class="mono text-xs text-slate-500 leading-tight" style="text-align:right;">${pred != null ? formatTime(pred) : '—'}${pred != null ? cumTag(cumP) : ''}</div>
      <div class="mono text-sm font-semibold text-slate-800 leading-tight" style="text-align:right;">${r.actual != null ? formatTime(r.actual) : '—'}${r.actual != null ? cumTag(cumA) : ''}</div>
      <div class="mono text-xs font-semibold ${dc}" style="text-align:right;">${d != null ? (d >= 0 ? '+' : '') + d.toFixed(2) : ''}</div>
      <div class="mono text-xs text-slate-600" style="text-align:center;">${sr[def.key] != null && sr[def.key] !== '' ? sr[def.key] : '—'}</div>
    </div>`;
  }).join('');

  // --- comparisons on demand: their best, or their previous race of the same event ---
  // Candidates = same swimmer + distance + stroke + pool, excluding this swim.
  const cmpPool = state.saved.filter(s => s.kind === 'race' && race.sid && s.sid === race.sid && s.id !== race.id
    && s.distance === race.distance && s.stroke === race.stroke && s.pool === race.pool)
    .map(s => ({ s: s, c: buildRaceComparison(s) }))
    .filter(x => x.c && x.c.actualTotal > 0);
  const cmpBest = cmpPool.reduce((m, x) => (!m || x.c.actualTotal < m.c.actualTotal) ? x : m, null);
  const cmpLast = cmpPool.slice().sort((a, b) =>
    String(b.s.date || '').localeCompare(String(a.s.date || '')) || String(b.s.id).localeCompare(String(a.s.id)))[0] || null;
  // Saved target (Set-target-time plan) for this exact event — prefer the starred one.
  const cmpTargetList = state.saved.filter(s => (!s.kind || s.kind === 'plan') && race.sid && s.sid === race.sid
    && s.distance === race.distance && s.stroke === race.stroke && s.pool === race.pool && s.targetSeconds > 0);
  const cmpTarget = cmpTargetList.find(s => s.isTarget) || cmpTargetList[cmpTargetList.length - 1] || null;
  // Predicted per-split times for a total (mirrors predAt) — the target's column is predicted.
  const predForTotal = (seconds) => {
    const pt2 = predict(race.stroke, race.sex, race.pool, race.distance, seconds);
    if (!pt2) return null;
    return defs.map(def => {
      if (def.kind === 'total') return seconds;
      if (def.kind === 'mid') return pt2.splits[1];
      if (def.kind === 'hundo') return pt2.splits[2 * def.idx] + pt2.splits[2 * def.idx + 1];
      const i = def.idxFromEnd != null ? pt2.splits.length - 1 - def.idxFromEnd : def.idx;
      return pt2.splits[i];
    });
  };
  const cmpBtn = (mode, label, avail) => avail
    ? `<button class="flex-1 rounded-xl px-3 py-2.5 text-xs font-semibold transition ${state.cmpMode === mode ? 'bg-cyan-600 text-white shadow' : 'bg-white border border-slate-200 text-slate-700 hover:border-cyan-300 hover:bg-cyan-50/40'}" data-action="cmp-mode" data-mode="${mode}">${label}</button>`
    : '';
  // All three slots are always accounted for. A mode with no data becomes a prompt
  // explaining what would unlock it, never a silently absent button.
  const evName = `${race.distance} ${race.stroke} ${race.pool}`;
  const cmpButtons = `<div class="space-y-2">
      ${(cmpBest || cmpLast || cmpTarget) ? `<div class="flex gap-2 flex-wrap">${cmpBtn('best', 'Compare to best time', cmpBest)}${cmpBtn('last', 'Compare to last race', cmpLast)}${cmpBtn('target', 'Compare to target time', cmpTarget)}</div>` : ''}
      ${!cmpTarget ? `<button class="w-full rounded-xl px-3 py-2.5 text-xs font-semibold bg-white border border-dashed border-cyan-300 text-cyan-800 hover:bg-cyan-50/40 active:scale-[0.99] transition" data-action="cmp-set-target">Set a target time for ${evName} to compare</button>` : ''}
      ${(!cmpBest && !cmpLast) ? `<div class="text-[11px] text-muted leading-snug px-1">Record another ${evName} and you can compare this one to your best and most recent.</div>` : ''}
    </div>`;

  let bestCard = '';
  let ref = null;
  if (state.cmpMode === 'best' && cmpBest) ref = { otherT: cmpBest.c.actualTotal, otherRows: cmpBest.c.rows.map(r => ({ label: r.label, actual: r.actual })), entry: cmpBest.s, col: 'Best', head: 'vs their best' };
  else if (state.cmpMode === 'last' && cmpLast) ref = { otherT: cmpLast.c.actualTotal, otherRows: cmpLast.c.rows.map(r => ({ label: r.label, actual: r.actual })), entry: cmpLast.s, col: 'Last', head: 'vs last race' };
  else if (state.cmpMode === 'target' && cmpTarget) { const tp = predForTotal(cmpTarget.targetSeconds); ref = { otherT: cmpTarget.targetSeconds, otherRows: tp ? defs.map((def, i) => ({ label: def.label, actual: tp[i] })) : c.rows.map(r => ({ label: r.label, actual: null })), entry: cmpTarget, col: 'Target', head: 'vs target', predicted: true }; }
  if (ref) {
    const other = ref.entry, otherT = ref.otherT;
    const gap = c.actualTotal - otherT;
    const gc = gap > 0.005 ? 'text-rose-600' : 'text-emerald-700';
    const beats = state.cmpMode === 'best' && c.actualTotal < otherT;
    // Running cumulatives under each split (target mode only), same format as the
    // ideal-splits table above: skipped on the first/last row and on total/mid rows.
    const showCums = !!ref.predicted;
    let cumR = 0, cumC = 0;
    const rows = ref.otherRows.map((br, i) => {
      const cur = c.rows[i];
      if (!cur) return '';
      const def = defs[i];
      const notAgg = !!def && def.kind !== 'total' && def.kind !== 'mid';
      const dd = (cur.actual != null && br.actual != null) ? cur.actual - br.actual : null;
      const ddc = dd == null ? 'text-slate-400' : (dd > 0.05 ? 'text-rose-600' : (dd < -0.05 ? 'text-emerald-700' : 'text-slate-500'));
      if (br.actual != null && notAgg) cumR += br.actual;
      if (cur.actual != null && notAgg) cumC += cur.actual;
      const showCum = showCums && i > 0 && i < ref.otherRows.length - 1 && notAgg;
      const cumTag = (v) => showCum ? `<div class="mono text-[10px] text-faint leading-none mt-0.5">(${formatTime(v)})</div>` : '';
      return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 4rem 4rem 3rem;gap:4px;align-items:center;" class="px-3 py-2 border-b border-slate-100 last:border-0">
        <div class="text-sm font-semibold text-slate-700 leading-tight">${br.label}</div>
        <div class="mono text-xs text-slate-500 leading-tight" style="text-align:right;">${br.actual != null ? formatTime(br.actual) : '—'}${br.actual != null ? cumTag(cumR) : ''}</div>
        <div class="mono text-sm font-semibold text-slate-800 leading-tight" style="text-align:right;">${cur.actual != null ? formatTime(cur.actual) : '—'}${cur.actual != null ? cumTag(cumC) : ''}</div>
        <div class="mono text-xs font-semibold ${ddc}" style="text-align:right;">${dd != null ? (dd >= 0 ? '+' : '') + dd.toFixed(2) : ''}</div>
      </div>`;
    }).join('');
    bestCard = `<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-3 pt-3 pb-1 flex items-baseline justify-between gap-2">
        <span class="label-cap text-muted">${ref.head}</span>
        <span class="text-[11px] text-muted">${formatTime(otherT)}${ref.predicted ? ' · target' : (other.date ? ' · ' + other.date : '') + (meetLabel(other) ? ' · ' + meetLabel(other) : '')}</span>
      </div>
      ${beats ? `<div class="px-3 pb-2"><span class="text-xs font-semibold text-emerald-700">New best for this event — ${Math.abs(gap).toFixed(2)}s faster.</span></div>`
              : `<div class="px-3 pb-2"><span class="text-xs ${gc} font-semibold">${gap >= 0 ? '+' : ''}${gap.toFixed(2)}s ${ref.head}${ref.predicted ? ' (predicted splits)' : ''}</span></div>`}
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 4rem 4rem 3rem;gap:4px;align-items:center;" class="px-3 pb-1"><span class="label-cap text-muted">Split</span><span class="label-cap text-muted" style="text-align:right;">${ref.col}</span><span class="label-cap text-muted" style="text-align:right;">Swum</span><span class="label-cap text-muted" style="text-align:right;">Δ</span></div>
      ${rows}
      ${(other.notes || '').trim() ? `<div class="px-3 py-2.5 border-t border-slate-100"><div class="label-cap text-muted mb-1">${ref.col} notes</div><div class="text-xs text-slate-600 leading-relaxed" style="white-space:pre-wrap;">${(other.notes || '').replace(/</g, '&lt;')}</div></div>` : ''}
    </div>`;
  }
  return `
    <div class="statusbar"></div>
    ${screenHeader({
      title: `${race.name || 'Race'}`,
      sub: `${race.distance} ${race.stroke} ${race.pool}${meetLabel(race) ? ' · ' + meetLabel(race) : ''}${race.date ? ' · ' + race.date : ''}`,
      primary: `${state.raceSaved === 'saved' ? '<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-semibold flex-shrink-0">Saved ✓</span>'
          : state.raceSaved === 'noname' ? '<span class="px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 text-[11px] font-semibold flex-shrink-0">Not saved · no name</span>'
          : state.raceSaved === 'notime' ? '<span class="px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 text-[11px] font-semibold flex-shrink-0">Not saved · no time</span>' : ''}`,
      secondary: hdrEditBtn('edit-race'),
      exports: [['csv-page', 'Download CSV']],
      cls: 'bg-white',
    })}
    <div class="px-5 py-3 bg-white border-b border-slate-100">
      <div class="bg-cyan-50 border border-cyan-100 rounded-2xl p-4 text-center">
        <div class="label-cap text-muted">Time swum</div>
        <div class="hero-time text-3xl mt-1 text-cyan-900">${formatTime(c.actualTotal)}</div>
        ${mismatch != null ? `<div class="text-[11px] text-amber-700 mt-1.5">Official time entered ${formatTime(race.targetSeconds)} · splits add up to ${formatTime(c.actualTotal)} (${mismatch >= 0 ? '+' : ''}${mismatch.toFixed(2)})</div>` : ''}
      </div>
    </div>
    <div class="scrollable px-5 py-3 space-y-3 bg-slate-50">
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">${head}${splitRows}</div>
      ${(sr.first25 > 0 || sr.second25 > 0 || sr.last15 > 0 || expL) ? `<div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="label-cap text-muted mb-1">Stroke rate</div><div class="text-sm text-slate-700">${[sr.first25 > 0 ? `1st 25 <span class="mono font-semibold">${sr.first25}</span>` : '', sr.second25 > 0 ? `2nd 25 <span class="mono font-semibold">${sr.second25}</span>` : '', sr.last15 > 0 ? `last 15 m <span class="mono font-semibold ${expL && parseFloat(sr.last15) < expL * 0.95 ? 'text-rose-600' : ''}">${sr.last15}</span>${expL ? ` <span class="text-xs text-muted">(expected ~${expL.toFixed(1)})</span>` : ''}` : (expL ? `expected last 15 m ≈ <span class="mono font-semibold">${expL.toFixed(1)}</span>` : '')].filter(Boolean).join(' · ')}${expL && sr.last15 > 0 && parseFloat(sr.last15) < expL * 0.95 ? `<div class="text-xs text-rose-600 mt-1">Rate faded more than the elite pattern (−5%+) — finishing tempo collapsed.</div>` : ''}</div></div>` : ''}
      ${race.notes ? `<div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="label-cap text-muted mb-1">Notes</div><div class="text-sm text-slate-700 leading-relaxed" style="white-space:pre-wrap;">${(race.notes || '').replace(/</g, '&lt;')}</div></div>` : ''}
      ${cmpButtons}
      ${bestCard}
      ${uspCardHtml(race, c.actualTotal)}
      ${SWIMMER ? reflectSectionsHtml() : ''}
    </div>
  `;
}

// ----- Screen: Race compare (e.g. Prelim vs Final) -----
function renderRaceCompare() {
  const A = state.saved.find(s => s.id === state.compareIds[0]);
  const B = state.saved.find(s => s.id === state.compareIds[1]);
  if (!A || !B) return renderRoster();
  const ca = buildRaceComparison(A), cb = buildRaceComparison(B);
  const tA = ca.actualTotal, tB = cb.actualTotal;
  const totalDelta = tB - tA;
  const rowsHtml = ca.rows.map((r, i) => {
    const rb = cb.rows[i];
    const a = r.actual, b = rb ? rb.actual : null;
    const d = (b != null && a != null) ? b - a : null;
    const dColor = d == null ? 'text-faint' : (d < -0.005 ? 'text-emerald-700' : d > 0.005 ? 'text-rose-600' : 'text-faint');
    return `
      <div class="px-4 py-3 ${i < ca.rows.length - 1 ? 'border-b border-slate-100' : ''}">
        <div class="text-xs label-cap text-faint mb-1">${r.label}</div>
        <div class="grid grid-cols-3 items-baseline">
          <div class="hero-time text-lg">${formatTime(a)}</div>
          <div class="hero-time text-lg text-center">${formatTime(b)}</div>
          <div class="text-sm font-semibold text-right ${dColor} tnum">${d == null ? '—' : (d >= 0 ? '+' : '') + d.toFixed(2)}</div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="statusbar"></div>
    ${screenHeader({ title: `${A.name || 'Compare'}`, sub: `${A.distance} ${A.stroke} ${A.pool} · ${A.round} vs ${B.round}`, cls: 'bg-white' })}
    <div class="px-5 py-3 bg-white border-b border-slate-100">
      <div class="grid grid-cols-3 items-end gap-2">
        <div><div class="label-cap text-muted">${A.round}</div><div class="hero-time text-xl mt-1">${formatTime(tA)}</div></div>
        <div class="text-center"><div class="label-cap text-muted">${B.round}</div><div class="hero-time text-xl mt-1">${formatTime(tB)}</div></div>
        <div class="text-right"><div class="label-cap ${totalDelta < 0 ? 'text-emerald-700' : 'text-rose-600'}">Change</div><div class="hero-time text-xl mt-1 ${totalDelta < 0 ? 'text-emerald-700' : 'text-rose-600'}">${totalDelta >= 0 ? '+' : ''}${totalDelta.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="scrollable px-5 py-3 space-y-4 bg-slate-50">
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="grid grid-cols-3 px-4 py-2.5 border-b border-slate-100 label-cap text-faint">
          <span>${A.round}</span><span class="text-center">${B.round}</span><span class="text-right">Δ</span>
        </div>
        ${rowsHtml}
      </div>
      <div class="text-[11px] text-faint text-center px-4">Green = faster in ${B.round} than ${A.round}. Negative split shape shows where the final was better or worse.</div>
    </div>
  `;
}

// ----- Screen 5: Squad targets -----
// ============================================================
// EVENTS
// ============================================================

// Press-and-hold on the target nudges: first repeat after 500 ms, then every 120 ms,
// accelerating to 60 ms once held past ~1.5 s. Pointer events cover mouse + touch; the
// click that follows the press is suppressed so a hold doesn't add one extra step.
(function holdRepeat() {
  let timer = null, started = 0, suppressClick = false;
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
  // NOTE: render() rebuilds the screen on every step, so the pressed button element is
  // detached each tick — we hold the DELTA, not the node, and re-check that a matching
  // nudge button still exists (i.e. we're still on the splits screen) before repeating.
  const fire = (delta) => {
    if (!delta || !state.result) return stop();
    const next = Math.max(10, state.result.targetSeconds + delta);
    state.form.targetSeconds = next;
    state.result = predict(state.result.stroke, state.result.sex, state.result.pool, state.result.distance, next);
    render();
  };
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('[data-action="nudge-target"]');
    if (!el) return;
    const delta = parseFloat(el.getAttribute('data-delta') || '0');
    const sel = `[data-action="nudge-target"][data-delta="${el.getAttribute('data-delta')}"]`;
    started = Date.now();
    suppressClick = false;
    const tick = () => {
      if (!document.querySelector(sel)) return stop();
      suppressClick = true;
      fire(delta);
      timer = setTimeout(tick, Date.now() - started > 1500 ? 60 : 120);
    };
    timer = setTimeout(tick, 500);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    document.addEventListener(evt, stop));
  document.addEventListener('click', (e) => {
    if (suppressClick && e.target.closest('[data-action="nudge-target"]')) {
      suppressClick = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);
})();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.hdrMore) { state.hdrMore = false; render(); }
});

document.addEventListener('click', (e) => {
  const phone = document.getElementById('phone');
  // An open printer menu closes on any tap that is not the button and not inside the menu.
  // Runs before the nav handlers so the tap still does whatever it was going to do.
  if (state.hdrMore) {
    const inMenu = !!e.target.closest('[data-hdr-menu]');
    const onButton = !!e.target.closest('[data-action="hdr-more"]');
    if (!onButton) {
      state.hdrMore = false;
      // Picking a download runs a handler that writes a file and never re-renders, so the
      // popover would sit there over the page. Redraw after the action, not instead of it.
      if (inMenu) setTimeout(() => { if (typeof render === 'function') render(); }, 0);
      else if (!e.target.closest('[data-action]')) { render(); return; }
    }
  }
  // Click handler for phone-internal nav
  if (phone.contains(e.target)) {
    // Delete buttons are checked first so they win over the row's navigation handler.
    const delEv = e.target.closest('[data-del-event]');
    if (delEv) { deleteEvent(delEv.getAttribute('data-del-event')); return; }
    const delSw = e.target.closest('[data-del-swimmer]');
    if (delSw) { deleteSwimmer(delSw.getAttribute('data-del-swimmer')); return; }
    const swim = e.target.closest('[data-swimmer]');
    if (swim) {
      const id = swim.getAttribute('data-swimmer');
      const s = swimmers.find(x => x.id === id);
      navigate('swimmer-detail', { swimmer: s });
      return;
    }
    const tfEl = e.target.closest('[data-teamfilter]');
    if (tfEl) { state.teamFilter = tfEl.getAttribute('data-teamfilter'); render(); return; }
    const svn = e.target.closest('[data-savedsid]');
    if (svn) {
      state.savedSid = svn.getAttribute('data-savedsid');
      state.swimmerView = null; state.swimmerStroke = null;
      navigate('saved-swimmer');
      return;
    }
    const pg = e.target.closest('[data-proggroup]');
    if (pg) { state.progGroup = decodeURIComponent(pg.getAttribute('data-proggroup')); state.progMetric = null; state.progWindow = 'all'; navigate('progress-group'); return; }
    const bm = e.target.closest('[data-btmode]');
    if (bm) {
      const m = bm.getAttribute('data-btmode');
      if (m === 'year') { state.btYearOpen = !state.btYearOpen; }
      else { state.btFilter = { mode: m, year: null }; state.btYearOpen = false; }
      render(); return;
    }
    const by = e.target.closest('[data-btyear]');
    if (by) { state.btFilter = { mode: 'year', year: +by.getAttribute('data-btyear') }; state.btYearOpen = false; render(); return; }
    const bs = e.target.closest('[data-btsort]');
    if (bs) { state.btSort = bs.getAttribute('data-btsort'); render(); return; }
    const pm = e.target.closest('[data-progmetric]');
    if (pm) { state.progMetric = pm.getAttribute('data-progmetric'); render(); return; }
    const pw = e.target.closest('[data-progwindow]');
    if (pw) { state.progWindow = pw.getAttribute('data-progwindow'); render(); return; }
    const rg = e.target.closest('[data-rgroup]');
    if (rg) { state.rgOpen = state.rgOpen || {}; const k = rg.getAttribute('data-rgroup'); state.rgOpen[k] = !state.rgOpen[k]; render(); return; }
    // Training Pace pickers — the table below refreshes with the choice once it's been shown.
    const slEv = e.target.closest('[data-sl-ev]');
    if (slEv) { state.slForm.ev = slEv.getAttribute('data-sl-ev'); state.slForm.pick = null; render(); return; }
    const slPick = e.target.closest('[data-sl-pick]');
    if (slPick) { state.slForm.pick = +slPick.getAttribute('data-sl-pick'); render(); return; }
    const tspl = e.target.closest('[data-tspl]');
    if (tspl) { state.tsplForm[tspl.getAttribute('data-tspl')] = tspl.getAttribute('data-tsplv'); render(); return; }
    const tp = e.target.closest('[data-tp]');
    if (tp) {
      const k = tp.getAttribute('data-tp'), v = tp.getAttribute('data-tpv');
      state.tpForm[k] = (k === 'distance') ? parseInt(v, 10) : v;
      render(); return;
    }
    const selfSx = e.target.closest('[data-self-sex]');
    if (selfSx) { (state.selfSetup = state.selfSetup || {}).sex = selfSx.getAttribute('data-self-sex'); render(); return; }
    const tps = e.target.closest('[data-tp-stroke]');
    if (tps) { state.tpForm.stroke = tps.getAttribute('data-tp-stroke'); render(); return; }
    const tpx = e.target.closest('[data-tp-sex]');
    if (tpx) { state.tpForm.sexFilter = tpx.getAttribute('data-tp-sex'); render(); return; }
    const sds = e.target.closest('[data-stdsrc]');
    if (sds) { state.stdForm.src = sds.getAttribute('data-stdsrc'); render(); return; }
    const sdk = e.target.closest('[data-stdstroke]');
    if (sdk) { state.stdForm.stroke = sdk.getAttribute('data-stdstroke'); stdSyncBest(); render(); return; }
    const sdx = e.target.closest('[data-stdsex]');
    if (sdx) { state.stdForm.sex = sdx.getAttribute('data-stdsex'); stdSyncBest(); render(); return; }
    const sdp = e.target.closest('[data-stdpool]');
    if (sdp) { state.stdForm.pool = sdp.getAttribute('data-stdpool'); stdSyncBest(); render(); return; }
    const sdd = e.target.closest('[data-stddist]');
    if (sdd) { state.stdForm.distance = +sdd.getAttribute('data-stddist'); stdSyncBest(); render(); return; }
    // Team vs standards pickers. The source chips toggle rather than switch — one, two or all
    // three sets of columns at once — but the last one on cannot be turned off, because an
    // empty table is never what the tap meant.

      const f = state.adjForm;
      if (!(f.name || '').trim()) { showToast('Add a swimmer name to save'); break; }
      if (!f.seconds) { showToast('Enter a time first'); break; }
      const upd = upsertSaved({ id: 'aj' + Date.now().toString(36), sid: resolveSid(f), kind: 'adjacent', name: f.name.trim(),
        stroke: f.stroke, sex: f.sex, pool: f.pool, distance: f.distance, seconds: f.seconds });
      showToast(`${upd ? 'Updated' : 'Saved'} ${f.name.trim()} · adjacent`);
      break;
    }
    case 'add-adjacent': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.adjForm = { stroke: 'Free', sex: last ? last.sex : 'M', pool: (last && last.pool) || 'LCM', distance: 100, seconds: 0, name: swimmerName(sid), sid };
      navigate('adjacent'); break;
    }
    case 'add-fifty': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.fiftyForm = { stroke: 'Free', sex: last ? last.sex : 'M', seconds: 0, name: swimmerName(sid), sid, best: {}, sr: {}, sc: {}, date: '' };
      navigate('fifty'); break;
    }
    case 'add-eff': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.effForm = { stroke: 'Free', sex: last ? last.sex : 'M', dist: '50', course: 'LCM', t: 0, acts: {}, cps: {}, name: swimmerName(sid), sid: sid, date: '' };
      navigate('efficiency'); break;
    }
    case 'add-convert': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.convForm = { stroke: 'Free', sex: last ? last.sex : 'M', distance: 100, from: 'LCM', seconds: 0, name: swimmerName(sid), sid };
      navigate('converter'); break;
    }
    case 'rename-swimmer': {
      const sid = state.savedSid; if (!sid) break;
      const cur = swimmerName(sid);
      const nn = (prompt('Rename swimmer', cur) || '').trim();
      if (!nn || nn === cur) break;
      state.saved.forEach(s => { if (s.sid === sid) s.name = nn; });
      persistSaved(); render();
      showToast(`Renamed to ${nn}`);
      break;
    }
    case 'set-birthyear': {
      const sid = state.savedSid; if (!sid) break;
      const cur = swimmerBirthYear(sid);
      const y = prompt('Birth year (for age-graded Rudolph points)', cur || '');
      if (y === null) break;
      const n = +String(y).trim();
      if (!(n > 1900 && n < 2100)) { showToast('Enter a four-digit year'); break; }
      setSwimmerBirthYear(sid, n);
      render();
      showToast(`Birth year set to ${n}`);
      break;
    }
    case 'set-team': {
      const sid = state.savedSid; if (!sid) break;
      const cur = swimmerTeam(sid);
      const t = prompt('Team name (leave blank to clear)', cur);
      if (t === null) break;                 // cancelled
      setSwimmerTeam(sid, t);
      render();
      showToast(t.trim() ? `Team set to ${t.trim()}` : 'Team cleared');
      break;
    }
    case 'cmp-set-target': {
      const r = state.race; if (!r) break;
      // Seed the goal from the time they actually swam, so it only needs nudging.
      const rc = buildRaceComparison(r);
      const t = (rc && rc.actualTotal > 0) ? rc.actualTotal : (r.targetSeconds || 0);
      state.swimmer = null;
      state.form = { stroke: r.stroke, sex: r.sex, pool: r.pool, distance: r.distance,
                     targetSeconds: t, name: r.name || '', sid: r.sid || null };
      state.result = null;
      seedSelf();   // swimmer build: keep the pinned identity (name/sid/sex)
      navigate('quick-calc');
      break;
    }
    case 'cmp-mode': {
      const m = el?.getAttribute('data-mode');
      state.cmpMode = state.cmpMode === m ? null : m; // tap the active button again to close
      render();
      break;
    }
    case 'back': back(); break;
    // The race is finished with: go home. Edit is the only way back into the entry form, so
    // the two controls in that header no longer lead to the same screen.
    case 'home': navigate('roster'); break;
    case 'refl-toggle': {
      const s = el?.getAttribute('data-sec'); if (!s) break;
      state.reflOpen = state.reflOpen || {};
      const opening = !state.reflOpen[s];
      state.reflOpen[s] = opening;
      render();
      // render() keeps the scroll position when redrawing the same screen, so an opened
      // section unfolds below the fold and the tap looks like it did nothing.
      if (opening) setTimeout(() => {
        const node = document.querySelector(`[data-refl-sec="${s}"]`);
        if (node && node.scrollIntoView) { try { node.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) {} }
      }, 0);
      break;
    }
    case 'team-standards': {
      // Open on the event the squad has actually raced most rather than an arbitrary default,
      // so the first thing on screen is a table with swimmers in it.
      const tallies = {};
      state.saved.forEach((s) => {
        if (s.kind !== 'race' || !s.sid || s.pool === 'SCY') return;
        const k = s.stroke + '|' + s.distance + '|' + s.pool;
        tallies[k] = (tallies[k] || 0) + 1;
      });
      const top = Object.keys(tallies).sort((a, b) => tallies[b] - tallies[a])[0];
      if (top) { const p = top.split('|');
        state.tsForm.stroke = p[0]; state.tsForm.distance = +p[1]; state.tsForm.pool = p[2]; }
      state.tsForm.q = '';
      navigate('team-standards');
      break;
    }
    case 'standards': {
      // Seed from whoever is on screen: a swimmer's best time in their most recent event
      // beats making them retype something the app already knows.
      const sid = state.savedSid || (SWIMMER ? selfSid() : null);
      const f = state.stdForm;
      f.sid = sid || null;
      f.name = sid ? (swimmerName(sid) || '') : '';
      if (sid) {
        // Open on their most recent event rather than an arbitrary default.
        const races = state.saved.filter((s) => s.kind === 'race' && s.sid === sid && s.pool !== 'SCY');
        races.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const last = races[races.length - 1];
        if (last) { f.stroke = last.stroke; f.distance = last.distance; f.pool = last.pool; f.sex = last.sex; }
      }
      if (SWIMMER) f.sex = selfSex() || f.sex;
      stdSyncBest();
      navigate('standards');
      break;
    }
    case 'std-save-by': {
      const el2 = document.querySelector('[data-stdby]');
      const y = el2 ? +el2.value : 0;
      if (!(y > 1900 && y < 2100)) { showToast('Enter a four-digit birth year'); break; }
      if (SWIMMER) setSelfBirthYear(y);
      else if (state.stdForm.sid) setSwimmerBirthYear(state.stdForm.sid, y);
      else { showToast('Open this from a swimmer to save their birth year'); break; }
      render();
      break;
    }
    case 'print-page': printPage(); break;
    // Back to the coach-or-swimmer front door. ?switch is what stops index.html
    // bouncing straight back here off the stored sc_start.
    case 'switch-version': location.href = 'index.html?switch'; break;
    case 'self-save': {
      const f = state.selfSetup || {};
      const nm = (f.name || '').trim();
      if (!nm) { showToast('Enter your name to continue'); break; }
      let sid = selfSid();
      if (!sid) { sid = newSid(); setSelfSid(sid); }
      try { localStorage.setItem('sc_self_sex', f.sex || 'M'); } catch (e) {}
      setSelfName(nm);
      // Apply to existing entries too, so a correction actually repairs saved races —
      // a wrong sex silently skews every split prediction until it is fixed.
      const sx = f.sex || 'M';
      state.saved.forEach((s) => { if (s.sid === sid) { s.name = nm; s.sex = sx; } });
      persistSaved();
      seedSelf();
      navigate('roster');
      break;
    }
    case 'self-edit': {
      // Open the setup screen prefilled. Reset the draft here (not in render) so a
      // re-entry always starts from what is actually stored, without clobbering typing.
      state.selfSetup = { name: selfName(), sex: selfSex() || 'M' };
      navigate('swimmer-setup');
      break;
    }
    case 'training-pace': state.tpShow = false; navigate('training-pace'); break;
    case 'training-splits': navigate('training-splits'); break;
    case 'swim-like': {
      state.slForm = { sid: SWIMMER ? selfSid() : state.savedSid, ev: null, pick: null };
      navigate('swim-like');
      break;
    }
    case 'sl-back': state.slForm.pick = null; render(); break;
    case 'usp-toggle': state.uspOpen = !state.uspOpen; render(); break;
    case 'hdr-more': state.hdrMore = !state.hdrMore; render(); break;
    case 'tp-show': state.tpShow = true; render(); break;
    case 'tp-download': {
      if (!tpPdfReady()) showToast('Preparing the PDF…');
      tpEnsurePdfLibs()
        .then(() => tpBuildPdf())
        .catch(() => {
          // Offline before the libraries were ever cached: the print dialog's "Save as PDF"
          // reaches the same place, and the @media print sheet is already styled for it.
          showToast('Could not load the PDF tool — opening print instead');
          document.body.classList.add('print-tp');
          const _endTp = () => { document.body.classList.remove('print-tp'); window.removeEventListener('afterprint', _endTp); };
          window.addEventListener('afterprint', _endTp);
          window.print();
          setTimeout(_endTp, 1500);
        });
      break;
    }
    case 'settings': showToast('Settings — not in v1 mock'); break;
    case 'add-swimmer': showToast('Add swimmer — not in v1 mock'); break;
    case 'save': {
      const nm = (state.form.name || '').trim();
      if (!nm) { showToast('Add a swimmer name to save'); break; }
      if (!state.result) { showToast('Nothing to save'); break; }
      const r = state.result;
      const sid = resolveSid(state.form);
      // Same-event plan already saved for this swimmer? Offer replace (showing the old
      // target) or keep both (Gaël 2026-07-22e). Edits-in-place (reviewId) skip the prompt.
      if (!state.reviewId) {
        const dup = state.saved.filter(x => x.sid === sid && (!x.kind || x.kind === 'plan') &&
          x.distance === r.distance && x.stroke === r.stroke && x.pool === r.pool).pop();
        if (dup) {
          if (confirm(`${nm} already has a ${r.distance} ${r.stroke} ${r.pool} plan — target ${formatTime(dup.targetSeconds)}.\n\nOK = replace it with ${formatTime(r.targetSeconds)}\nCancel = keep both (saves a new entry)`)) {
            dup.sex = r.sex; dup.targetSeconds = r.targetSeconds;
            if (state.form.isTarget !== false) {
              state.saved.forEach((x) => {
                if (isPlan(x) && x.sid === sid && x.stroke === r.stroke && x.pool === r.pool && x.distance === r.distance) x.isTarget = false;
              });
              dup.isTarget = true;
            }
            persistSaved();
            state.planSaved = true;
            showToast(`Replaced ${nm} · ${r.distance} ${r.stroke} ${r.pool} plan`);
            render();
            break;
          }
        }
      }
      // Saving against a named swimmer sets their season target by default; the star on the
      // splits screen turns that off when the coach only wants a saved prediction.
      const wantTarget = state.form.isTarget !== false;
      if (wantTarget) {
        // Exactly one target per swimmer per event, or "Pace from: Target" is ambiguous.
        state.saved.forEach((x) => {
          if (isPlan(x) && x.sid === sid && x.stroke === r.stroke && x.pool === r.pool && x.distance === r.distance) x.isTarget = false;
        });
      }
      const upd = upsertSaved({ id: 'sv' + Date.now().toString(36), sid, name: nm, kind: 'plan', isTarget: wantTarget,
        stroke: r.stroke, sex: r.sex, pool: r.pool, distance: r.distance, targetSeconds: r.targetSeconds });
      state.planSaved = true;
      showToast(`${upd ? 'Updated' : 'Saved'} ${nm} · ${r.distance} ${r.stroke}`);
      render();
      break;
    }
    // Edit is the only route back to the Split Predictor form — the ‹ goes home, so the two
    // controls in that header never lead to the same screen (same rule as Record Races, 24i).
    case 'edit-plan': navigate('quick-calc'); break;
    case 'toggle-target': state.form.isTarget = !(state.form.isTarget !== false); render(); break;
    case 'plan-from-pb':
      state.form = {
        stroke: state.swimmer.bestEvent.stroke,
        sex: state.swimmer.sex,
        pool: state.swimmer.bestEvent.pool,
        distance: state.swimmer.bestEvent.distance,
        targetSeconds: state.swimmer.bestEvent.time * 0.99, // 1% stretch
      };
      navigate('quick-calc');
      break;
    case 'log-race':
      if (state.swimmer && state.swimmer.id === sampleRace.swimmerId) {
        state.race = sampleRace;
        navigate('race-analysis');
      } else {
        showToast('Race entry form — not in v1 mock');
      }
      break;
    case 'open-race':
      state.race = sampleRace;
      navigate('race-analysis');
      break;
    case 'nudge-target': {
      const delta = parseFloat(el?.getAttribute('data-delta') || '0');
      const next = Math.max(10, state.result.targetSeconds + delta);
      state.planSaved = false;          // the target moved, so what's on screen is no longer saved
      state.form.targetSeconds = next;
      state.result = predict(state.result.stroke, state.result.sex, state.result.pool, state.result.distance, next);
      render();
      break;
    }
    case 'target-preset': {
      const mode = el?.getAttribute('data-mode');
      const base = (state.swimmer && state.swimmer.bestEvent.stroke === state.result.stroke && state.swimmer.bestEvent.distance === state.result.distance)
        ? state.swimmer.bestEvent.time
        : state.result.targetSeconds;
      let next = state.result.targetSeconds;
      if (mode === 'pb') next = base;
      else if (mode === 'minus1') next = base * 0.99;
      else if (mode === 'plus1') next = base * 1.01;
      state.form.targetSeconds = next;
      state.result = predict(state.result.stroke, state.result.sex, state.result.pool, state.result.distance, next);
      render();
      break;
    }
    case 'splitview': {
      state.splitView = el?.getAttribute('data-mode') || '100';
      render();
      break;
    }
  }
}

function handleJumpTo(view) {
  switch (view) {
    case 'roster': navigate('roster'); break;
    case 'quick-calc':
      state.swimmer = null;
      navigate('quick-calc');
      break;
    case 'predicted-splits':
      if (!state.result) {
        state.result = predict('Free', 'M', 'LCM', 200, 120);
      }
      navigate('predicted-splits');
      break;
    case 'race-analysis':
      state.race = sampleRace;
      navigate('race-analysis');
      break;
    case 'squad-targets':
      navigate('squad-targets');
      break;
  }
}

function runDemo(flow) {
  switch (flow) {
    case 'quick200':
      state.swimmer = null;
      state.form = { stroke: 'Free', sex: 'M', pool: 'LCM', distance: 200, targetSeconds: 120 };
      state.result = predict('Free', 'M', 'LCM', 200, 120);
      state.history = ['roster', 'quick-calc'];
      navigate('predicted-splits', { skipHistory: true });
      break;
    case 'ben':
      state.swimmer = swimmers.find(s => s.id === 'br');
      state.form = { stroke: 'Fly', sex: 'M', pool: 'LCM', distance: 100, targetSeconds: 54.8 };
      state.result = predict('Fly', 'M', 'LCM', 100, 54.8);
      state.history = ['roster', 'swimmer-detail', 'quick-calc'];
      navigate('predicted-splits', { skipHistory: true });
      break;
    case 'quinn':
      state.swimmer = swimmers.find(s => s.id === 'qp');
      state.race = sampleRace;
      state.history = ['roster', 'swimmer-detail'];
      navigate('race-analysis', { skipHistory: true });
      break;
    case 'reset':
      state.history = [];
      state.swimmer = null;
      state.result = null;
      state.race = null;
      navigate('roster');
      break;
  }
}

// ===== Keyboard inset =========================================================
// Scroll the focused field into the middle of what's left, but ONLY when it is
// actually out of view — so the focus restoration render() performs after a redraw
// doesn't yank the screen around.
function centreFocusedField() {
  const el = document.activeElement;
  if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  // Centre the whole min:sec.hh group rather than one 40px box.
  const target = (el.closest && el.closest('[data-tkey]')) || el;
  const sc = target.closest && target.closest('.scrollable');
  if (!sc || !target.getBoundingClientRect || !target.scrollIntoView) return;
  const t = target.getBoundingClientRect(), v = sc.getBoundingClientRect();
  if (!v.height || !t.height) return;                           // not laid out — don't guess
  if (t.top >= v.top + 4 && t.bottom <= v.bottom - 4) return;   // already visible
  try { target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
}

// iOS will not let a page block the edge-swipe, so intercept it. The app keeps its own
// state.history and never touched browser history, which is why a swipe walked the BROWSER
// back — straight out to the chooser, however deep you were. Keep one spare entry alive:
// popstate consumes it, we do the in-app back, then push a replacement so the depth never
// changes. On the home page state.history is empty, so the swipe leaves the app — correct.
function setupSwipeBack() {
  if (!window.history || !window.history.pushState) return;
  try { history.pushState({ sc: 1 }, ''); } catch (e) { return; }
  window.addEventListener('popstate', () => {
    if (!state.history.length) return;          // home page: let the browser leave
    try { history.pushState({ sc: 1 }, ''); } catch (e) {}
    back();
  });
}

function setupKeyboardInset() {
  const vv = window.visualViewport;
  if (!vv) return;                       // iOS 12 and older: today's behaviour, nothing worse
  const MIN = 120;                       // under this it's the accessory bar, not a keyboard
  const JITTER = 80;                     // predictive bar toggling must not bounce the layout
  let applied = 0, timer = null;
  const sync = () => {
    const raw = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
    const kb = raw < MIN ? 0 : Math.round(raw);
    if (kb === applied) return;
    if (kb !== 0 && applied !== 0 && Math.abs(kb - applied) < JITTER) return;
    applied = kb;
    document.documentElement.style.setProperty('--kb', kb + 'px');
    if (kb) setTimeout(centreFocusedField, 180);   // after the height transition settles
  };
  const queue = () => { clearTimeout(timer); timer = setTimeout(sync, 60); };
  vv.addEventListener('resize', queue);
  vv.addEventListener('scroll', queue);
  // Moving between fields while the keyboard is already up fires no resize at all.
  document.addEventListener('focusin', (e) => {
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    setTimeout(centreFocusedField, 250);
  });
}

// ============================================================
// BOOT
// ============================================================
persistSaved(); // lock in any sids assigned by migration so they stay stable across reloads
seedSelf();     // swimmer build: point the entry forms at the one athlete
render();
setupKeyboardInset();   // keep the field you're typing in above the keyboard
setupSwipeBack();       // the edge swipe goes back one screen, not out to the chooser
</script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
