  const factor = Math.pow(10, precision);

  const s = seconds - m * 60;
  if (m === 0 && !opts.forceMin) return s.toFixed(precision);

  if (colon === -1) {

    return isNaN(v) ? null : v;
  }
  const m = parseInt(str.slice(0, colon), 10);
  const s = parseFloat(str.slice(colon + 1));
  if (isNaN(m) || isNaN(s)) return null;

function waBaseTime(stroke, distance, pool, sex) {

}

  const b = waBaseTime(stroke, distance, pool, sex);

}
// The SLOWEST hundredth that still scores >= P. Truncating the cubic estimate alone can
// land a hundredth short (scoring P-1) because of float error at exact boundaries, so the
// result is verified with the forward formula and stepped until it holds.
function waTimeForPoints(points, stroke, distance, pool, sex) {
  const b = waBaseTime(stroke, distance, pool, sex);
  const P = Math.round(points);
  if (!b || !(P > 0)) return null;
  const pts = (x) => Math.floor(1000 * Math.pow(b / x, 3));
  const hundredth = (x) => Math.round(x * 100) / 100;
  let t = Math.floor(b * Math.pow(1000 / P, 1 / 3) * 100) / 100;
  let guard = 0;
  while (t > 0.01 && pts(t) < P && guard++ < 1000) t = hundredth(t - 0.01);
  guard = 0;
  while (pts(hundredth(t + 0.01)) >= P && guard++ < 1000) t = hundredth(t + 0.01);
  return t;
}

function getRatios(stroke, sex, pool, distance) {
  return ratios?.[stroke]?.[sex]?.[pool]?.[distance] ?? null;
}

function predict(stroke, sex, pool, distance, targetSeconds) {
  let r = getRatios(stroke, sex, pool, distance);
  // 50 m LCM has no pacing table — build the two 25s from the 50 m LCM sub-split ratios.
  if (!r && distance === 50 && pool === 'LCM' && fiftyRatios[stroke] && fiftyRatios[stroke][sex]) {
    const fr = fiftyRatios[stroke][sex], iq = fiftyIqr[stroke] && fiftyIqr[stroke][sex];
    r = { median: [fr.first25, fr.second25],
          q25: iq ? [iq.f1lo, iq.f2lo] : [fr.first25, fr.second25],
          q75: iq ? [iq.f1hi, iq.f2hi] : [fr.first25, fr.second25], n: null };
  }
  if (!r) return null;
  // Defensive renormalisation so the predicted splits sum to exactly the target.
  const sum = r.median.reduce((a, b) => a + b, 0);
  const k = sum ? 1 / sum : 1;
  return {
    splits: r.median.map(x => x * k * targetSeconds),
    lo: r.q25.map(x => x * k * targetSeconds),
    hi: r.q75.map(x => x * k * targetSeconds),
    pb50: r.pb50Ratio ? r.pb50Ratio * targetSeconds : null,
    pb50Lo: r.pb50Q25 ? r.pb50Q25 * targetSeconds : null,
    pb50Hi: r.pb50Q75 ? r.pb50Q75 * targetSeconds : null,
    hundoLo: r.hundoLo ? r.hundoLo.map(x => x * k * targetSeconds) : null,
    hundoHi: r.hundoHi ? r.hundoHi.map(x => x * k * targetSeconds) : null,
    n: r.n ?? null,
    segLen: distance === 50 ? 25 : 50,
    targetSeconds,
    stroke, sex, pool, distance,

}

function classifySplit(actual, lo, hi) {
  if (actual < lo - 0.01) return 'too-fast';
  if (actual > hi + 0.01) return 'too-slow';
  return 'in-range';
}

function generateInsights(prediction, actualSplits, swimmer) {
  const insights = [];
  const classes = actualSplits.map((a, i) => classifySplit(a, prediction.lo[i], prediction.hi[i]));
  const firstFast = classes[0] === 'too-fast';
  const lastTwoSlow = classes.length >= 2 &&
    classes.slice(-2).every(c => c === 'too-slow');
  const anyLaterSlow = classes.slice(1).some(c => c === 'too-slow');
  const allInRange = classes.every(c => c === 'in-range');

  if (firstFast && anyLaterSlow) {
    insights.push({
      tone: 'amber', icon: '⚡', title: 'Went out too hard',
      body: `You opened ${(prediction.splits[0] - actualSplits[0]).toFixed(2)}s under predicted pace, then paid for it the rest of the race.`,
      action: 'Try the next attempt with a controlled opening — sit within the predicted range for the first 50.',
    });
  }

  if (lastTwoSlow) {
    const fade = (actualSplits.slice(-2).reduce((a, b) => a + b, 0) -
                  prediction.splits.slice(-2).reduce((a, b) => a + b, 0));
    insights.push({
      tone: 'rose', icon: '🔻', title: 'Back-end fade',
      body: `Your last two splits were +${fade.toFixed(2)}s vs predicted. The drop-off is bigger than pacing alone — points to aerobic endurance, not just race discipline.`,
      action: 'Aerobic threshold sets, broken 200s on short rest.',
    });
  }

  if (allInRange) {
    insights.push({
      tone: 'emerald', icon: '✓', title: 'Well-paced race',
      body: 'Every split landed inside the predicted range. Distribution matched elite pacing — strong execution.',
    });
  }

  // Top-end speed limiter — only relevant to short events with pb50
  if (prediction.pb50 && swimmer && swimmer.pb50) {
    const knownPB = swimmer.pb50[prediction.stroke];
    if (knownPB && knownPB > prediction.pb50 + 0.3) {
      insights.push({
        tone: 'amber', icon: '⚠', title: 'Top-end speed is the limiter',
        body: `To go this time, the math wants a ${prediction.pb50.toFixed(1)}s opening 50 — but your 50 PB is ${knownPB.toFixed(2)}s. The opening won't be there without faster top-end speed.`,
        action: 'Sprint work — dive-15s, broken 25s, race-pace overspeed.',
      });
    }
  }

  return insights;
}

function navigate(view, opts = {}) {
  const { skipHistory, ...rest } = opts;
  if (!skipHistory && state.view !== view) state.history.push(state.view);
  // The main page is the root: nothing can sit behind it, so no path can build up a loop.
  if (view === 'roster') state.history.length = 0;
  state.view = view;
  state.editing = false; // leave edit mode whenever we change screens
  // Abandoning the entry form unbinds it from the race it was editing. edit-race sets
  // raceEditId and then navigates HERE, so only a move away can clear it; analyze-race
  // has already consumed and cleared it by the time it navigates on.
  if (view !== 'race-entry') state.raceEditId = null;
  state.reviewId = null; // default: a fresh open is a new entry (review-clicks pass reviewId in opts)
  state.cmpMode = null;  // comparisons start closed on every screen change
  if (view !== 'race-analysis') state.raceSaved = null; // the Saved chip belongs to the save that just happened
  if (view !== 'predicted-splits') state.planSaved = false; // ditto for the Split Predictor's Saved ✓
  Object.assign(state, rest);
  render();
}

// Show a saved-swimmer sub-view, navigating to that screen first if we aren't on it.
function openSwimmerView() {
  if (state.view !== 'saved-swimmer') navigate('saved-swimmer');
  else render();
}

function back() {
  if (state.history.length === 0) return navigate('roster');
  // Go through navigate() so a Back applies the SAME resets as any other screen change —
  // a bare view swap left state.editing, cmpMode and reviewId from the previous screen.
  navigate(state.history.pop(), { skipHistory: true });
}

// Fit the current screen onto one page by measuring it rather than guessing a
// shrink factor: the card's true height is the fixed header plus the scroller's
// entire content, and the page gives us Letter (1056px at 96dpi) less the 12mm
// @page margins. Only ever shrinks — a short race still prints at 1:1.
function printPage() {
  const ph = document.getElementById('phone');
  if (!ONE_PAGE_VIEWS[state.view] || !ph) { window.print(); return; }
  const sc = ph.querySelector('.scrollable');
  const full = sc ? (ph.clientHeight - sc.clientHeight + sc.scrollHeight) : ph.scrollHeight;
  const avail = 1056 - 2 * 45;
  const z = full > 0 ? Math.min(1, avail / full) : 1;
  document.body.classList.add('print-fit');
  ph.style.zoom = z;
  const end = () => {
    document.body.classList.remove('print-fit');
    ph.style.zoom = '';
    window.removeEventListener('afterprint', end);
  };
  window.addEventListener('afterprint', end);
  window.print();
}

function downloadFile(filename, content, mime) {

// --- Analysis CSV: tidy "long" format, one row per split (numeric seconds for pivots/charts) ---
function exportAnalysisCsv() {
  if (!state.saved.length) { showToast('No saved swimmers to export'); return; }
  const header = ['swimmer', 'sex', 'type', 'stroke', 'distance', 'pool', 'round', 'date',
    'target_s', 'actual_total_s', 'delta_s', 'segment', 'segment_m', 'split_s', 'cumulative_s']; // entry_id kept internally, dropped from the export (2026-07-22d)
  const lines = [header];
  const fmt = (v) => (v == null || v === '' || isNaN(v)) ? '' : (+v).toFixed(2);
  const segM = (label) => { const m = String(label).match(/(\d+)\s*m/); return m ? +m[1] : ''; };
  const kindOf = (s) => s.kind === 'race' ? 'race' : (!s.kind || s.kind === 'plan' ? 'plan' : s.kind);
  const sorted = state.saved.slice().sort((a, b) =>
    (a.name || '').localeCompare(b.name || '') || String(a.kind || '').localeCompare(String(b.kind || '')));
  sorted.forEach(s => {
    const type = kindOf(s);
    const base = [s.name, s.sex, type, s.stroke, s.distance ?? '', s.pool ?? '',
      s.kind === 'race' ? (s.round || '') : '', s.kind === 'race' ? (s.date || '') : ''];
    if (s.kind === 'race') {
      const c = buildRaceComparison(s); if (!c) return;
      let cum = 0;
      c.rows.forEach(r => {
        if (r.actual == null || /total/i.test(r.label)) return;
        cum += r.actual;
        lines.push([...base, fmt(s.targetSeconds), fmt(c.actualTotal), (c.delta >= 0 ? '+' : '') + c.delta.toFixed(2),
          r.label, segM(r.label), r.actual.toFixed(2), cum.toFixed(2)]);
      });
    } else if (type === 'plan') {
      const r = predict(s.stroke, s.sex, s.pool, s.distance, s.targetSeconds); if (!r || !r.splits) return;
      let cum = 0; const seg = r.segLen || 50;
      r.splits.forEach((x, i) => { cum += x; const m = (i + 1) * seg;
        lines.push([...base, fmt(s.targetSeconds), '', '', `${m}m`, m, x.toFixed(2), cum.toFixed(2)]); });
    } else {
      // tool saves (convert / fifty / adjacent): one summary row with the input time
      lines.push([...base, fmt(s.seconds), '', '', '(input)', s.distance ?? '', fmt(s.seconds), '']);
    }
  });
  const csv = '﻿' + lines.map(row => row.map(csvCell).join(',')).join('\r\n'); // BOM → Excel reads accents
  const stamp = new Date().toISOString().slice(0, 10);
  downloadFile(`race_equation_analysis_${stamp}.csv`, csv, 'text/csv');
  showToast(`Exported ${state.saved.length} saved ${state.saved.length === 1 ? 'entry' : 'entries'}`);
}

function screenCsvModel() {

    let cum = 0;
    c.rows.forEach((row, i) => {

      rows.push([r.name || '', ev, r.pool, meetLabel(r) || '', r.date || '', row.label,

        row.actual != null ? formatTime(row.actual) : '', num(row.actual),
        row.actual != null ? (row.delta >= 0 ? '+' : '') + row.delta.toFixed(2) : '',

        sr[key] != null ? sr[key] : '']);
    });
    return { name: `split_compass_race_${slug(r.name)}_${slug(ev)}_${r.date || stamp}.csv`, rows,

  if (state.view === 'predicted-splits') {

    let cum = 0;
    segs.forEach((s) => {

             note: `${rows.length - 1} split rows` };
  }

  if (state.view === 'best-times') { exportBestTimesCsv(); return 'handled'; }

  if (state.view === 'saved-swimmer') {
    const sid = state.savedSid;
    const all = state.saved.filter((s) => s.sid === sid);
    if (!all.length) return null;
    const who = swimmerName(sid) || '';
    const tab = state.swimmerView === 'plans' ? 'plans' : 'races';
    const stroke = state.swimmerStroke;
    const pick = all.filter((s) => (tab === 'plans' ? (!s.kind || s.kind === 'plan') : s.kind === 'race')
                                   && (!stroke || s.stroke === stroke));
    if (!pick.length) return null;
    if (tab === 'plans') {
      const rows = [['swimmer', 'distance_m', 'stroke', 'pool', 'sex', 'target', 'target_s']];
      pick.forEach((s) => rows.push([who, s.distance, s.stroke, s.pool, s.sex === 'M' ? 'M' : 'F',
        formatTime(s.targetSeconds), num(s.targetSeconds)]));
      return { name: `split_compass_targets_${slug(who)}_${stamp}.csv`, rows, note: `${pick.length} target times` };
    }
    const rows = [['swimmer', 'distance_m', 'stroke', 'pool', 'sex', 'time', 'time_s',
                   'date', 'meet', 'round', 'aqua_points']];
    pick.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach((s) => {
      const c = buildRaceComparison(s); const t = c ? c.actualTotal : 0;
      rows.push([who, s.distance, s.stroke, s.pool, s.sex === 'M' ? 'M' : 'F',
        t > 0 ? formatTime(t) : '', num(t), s.date || '', s.competition || '', s.round || '',

      const n = g.entries.length;
      const a = progMetrics(g.entries[0]).find((m) => m.primary);
      const b = progMetrics(g.entries[n - 1]).find((m) => m.primary);
      const d = (a && b && a.value != null && b.value != null) ? b.value - a.value : null;
      rows.push([who, g.sig, PROG_KINDS[g.kind] || g.kind, n, num(a && a.value), num(b && b.value),
        d == null ? '' : (d >= 0 ? '+' : '') + d.toFixed(2)]);
    });
    return { name: `split_compass_progress_${slug(who)}_${stamp}.csv`, rows, note: `${groups.length} groups` };
  }

  if (state.view === 'progress-group' || state.view === 'training-pace') {
    // Both screens render a real <table>; read it rather than recomputing, so the file
    // matches the metric rows / stroke blocks exactly as filtered on screen.
    const host = state.view === 'training-pace' ? document.getElementById('tp-print') : document.querySelector('#screen-container');
    const table = host && host.querySelector('table');
    if (!table) return null;

    const rows = [...table.querySelectorAll('thead tr'), ...table.querySelectorAll('tbody tr')]

    if (rows.length < 2) return null;
    const who = state.view === 'training-pace' ? 'training_pace' : slug(swimmerName(state.savedSid)) + '_' + slug(state.progGroup);
    return { name: `split_compass_${slug(who)}_${stamp}.csv`, rows, note: `${rows.length - 1} rows` };
  }
  return null;
}

// ---- Hy-Tek "Individual Top Times" CSV import (total-only race records) --------
function parseHytekTime(s) {
  s = String(s || '').trim().replace(/^x/i, '').trim();   // strip Hy-Tek exhibition/converted flag
  const m = s.match(/^(?:(\d+):)?(\d{1,2}(?:\.\d+)?)$/);
  if (!m) return null;
  const sec = (m[1] ? parseInt(m[1], 10) * 60 : 0) + parseFloat(m[2]);
  return sec > 0 ? sec : null;
}
function parseCsvLine(l) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < l.length; i++) { const c = l[i];
    if (c === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else cur += c; }
  out.push(cur); return out;
}
const HYTEK_COURSE = { Y: 'SCY', L: 'LCM', S: 'SCM' };
const HYTEK_ROUND = { F: 'Final', P: 'Prelim', S: 'Semifinal', T: 'Time Trial' };
function parseHytekTopTimes(text) {
  const nameRe = /^(.*?)\s+\((\d+)\)\s+([MWF])/;   // "Name  (age)  M/W" (Yr tag optional)
  const rows = String(text).split(/\r?\n/).filter((l) => l.trim());
  const cands = [], scy = []; let malformed = 0;
  rows.forEach((line) => {
    const r = parseCsvLine(line);
    const mm = nameRe.exec(r[12] || '');
    const sec = parseHytekTime(r[15]);
    const pool = HYTEK_COURSE[(r[16] || '').trim()];
    const dist = parseInt(r[22], 10), stroke = (r[23] || '').trim();
    if (!mm || !sec || !dist || !stroke || !pool) { malformed++; return; }
    const c = { name: mm[1].trim(), sex: mm[3] === 'W' ? 'F' : mm[3], seconds: sec,
      pool, distance: dist, stroke, round: HYTEK_ROUND[(r[19] || '').trim()] || 'Final',
      date: (r[25] || '').trim(), team: (r[13] || '').trim(), competition: (r[26] || '').trim() };
    (pool === 'SCY' ? scy : cands).push(c);
  });
  return { cands, scy, malformed };
}
function triggerImportCsv() {
  showToast('File must be in Hy-Tek CSV format');
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain'; inp.style.display = 'none';
  inp.addEventListener('change', () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { prepareImportPreview(reader.result); navigate('import-preview'); };
    reader.readAsText(file);
  });
  document.body.appendChild(inp); inp.click();
  setTimeout(() => inp.remove(), 1000);
}
// The swum total of a saved race: its actual time, NOT the (goal) targetSeconds.
function raceActualTotal(e) {
  const t = (e && e.times) || {};
  if (t.total > 0) return t.total;
  const c = buildRaceComparison(e);
  return (c && c.actualTotal > 0) ? c.actualTotal : ((e && e.targetSeconds) || 0);
}
// Match key for de-duping: same swimmer + event + date + total (0.01 s). No round —
// a swim already recorded (manually, with notes/SR, or a prior import) shouldn't re-import.
function raceMatchSig(sid, date, dist, stroke, pool, total) {
  return sid + '|' + (date || '') + '|' + dist + '|' + stroke + '|' + pool + '|' + (total || 0).toFixed(2);
}
// Split candidates into importable / already-recorded / no-pacing-table.
function prepareImportPreview(text) {
  const parsed = parseHytekTopTimes(text);
  const nameToSid = {};
  state.saved.forEach((s) => { if (s.name && !(s.name in nameToSid)) nameToSid[s.name] = s.sid; });
  const existing = new Set(state.saved.filter((s) => s.kind === 'race')
    .map((s) => raceMatchSig(s.sid, s.date, s.distance, s.stroke, s.pool, raceActualTotal(s))));
  const importable = [], unsupported = [], duplicates = [];
  parsed.cands.forEach((c) => {
    if (!predict(c.stroke, c.sex, c.pool, c.distance, 100)) { unsupported.push(c); return; }
    const sid = nameToSid[c.name];
    if (sid && existing.has(raceMatchSig(sid, c.date, c.distance, c.stroke, c.pool, c.seconds))) { duplicates.push(c); return; }
    importable.push(c);
  });
  state.importPreview = { importable, unsupported, duplicates, scy: parsed.scy, malformed: parsed.malformed,
    nSwimmers: new Set(importable.map((c) => c.name)).size };
  return state.importPreview;
}
function doImportTimes() {
  const P = state.importPreview;
  if (!P || !P.importable.length) { showToast('Nothing to import'); return; }
  const nameToSid = {};
  state.saved.forEach((s) => { if (s.name && !(s.name in nameToSid)) nameToSid[s.name] = s.sid; });
  const seen = new Set(state.saved.filter((s) => s.kind === 'race')
    .map((s) => raceMatchSig(s.sid, s.date, s.distance, s.stroke, s.pool, raceActualTotal(s))));
  let added = 0, dup = 0, i = 0;
  P.importable.forEach((c) => {
    let sid = nameToSid[c.name]; if (!sid) { sid = newSid(); nameToSid[c.name] = sid; }
    const s = raceMatchSig(sid, c.date, c.distance, c.stroke, c.pool, c.seconds);
    if (seen.has(s)) { dup++; return; }
    const e = { id: 'rc' + Date.now().toString(36) + (i++).toString(36) + Math.random().toString(36).slice(2, 5),
      kind: 'race', name: c.name, sid, stroke: c.stroke, sex: c.sex, pool: c.pool, distance: c.distance,
      targetSeconds: c.seconds, times: { target: c.seconds, total: c.seconds }, sr: {},
      competition: c.competition, round: c.round, date: c.date, team: c.team || '', notes: 'Imported (Hy-Tek Top Times)' };
    seen.add(s); state.saved.push(e); added++;
  });
  persistSaved();
  state.importPreview = null;
  showToast(`Imported ${added} swim${added === 1 ? '' : 's'}${dup ? ` · ${dup} already recorded` : ''}`);
  navigate('roster');
}

function triggerImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.style.display = 'none';
  inp.addEventListener('change', () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importBackupData(reader.result);
    reader.readAsText(file);
  });
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => inp.remove(), 1000);
}
function importBackupData(text) {
  let data;
  try { data = JSON.parse(String(text).replace(/^﻿/, '')); } catch (e) { showToast('Could not read that file'); return; }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.saved) ? data.saved : null);
  if (!arr) { showToast('Not a Split Compass backup file'); return; }
  const existing = new Set(state.saved.map(s => s.id));
  let added = 0;
  arr.forEach(e => {
    if (e && e.id && e.name && !existing.has(e.id)) { state.saved.push(e); existing.add(e.id); added++; }
  });
  persistSaved();
  if (added) markBackedUp();   // they hold a file that reproduces this state
  render();
  showToast(added ? `Imported ${added} ${added === 1 ? 'entry' : 'entries'}` : 'Nothing new to import');
}

// ----- Delete: one saved event (pace plan or race) -----
function deleteEvent(id) {
  const entry = state.saved.find(x => x.id === id);
  if (!entry) return;
  const label = entry.kind === 'race' ? `${entry.round ? entry.round + ' ' : ''}${entry.distance} ${entry.stroke} race`
    : entry.kind === 'fifty' ? `50 m ${entry.stroke} splits`
    : entry.kind === 'adjacent' ? `${entry.distance} m ${entry.stroke} adjacent`
    : entry.kind === 'convert' ? `${entry.distance} m ${entry.stroke} conversion`
    : entry.kind === 'eff' ? `${entry.stroke} efficiency test`
    : `${entry.distance} ${entry.stroke} pace plan`;
  const whose = SWIMMER ? 'your' : `${entry.name}'s`;
  if (!confirm(`Delete ${whose} ${label}?\n\nThis can't be undone.`)) return;
  const name = entry.name;
  state.saved = state.saved.filter(x => x.id !== id);
  persistSaved();
  // If that was the swimmer's last entry, drop back to the roster.
  if (!state.saved.some(x => x.name === name)) {
    navigate('roster');
  } else {
    render();
  }
  showToast('Deleted');
}

// ----- Delete: a whole swimmer (all their plans + races) -----
function deleteSwimmer(sid) {
  const evs = state.saved.filter(x => x.sid === sid);
  if (!evs.length) return;
  const name = evs[evs.length - 1].name || 'this swimmer';
  if (!confirm(`Delete ${name} and all ${evs.length} saved ${evs.length === 1 ? 'item' : 'items'}?\n\nThis can't be undone.`)) return;
  state.saved = state.saved.filter(x => x.sid !== sid);
  persistSaved();
  navigate('roster'); // also clears edit mode
  showToast(`Deleted ${name}`);
}

const screenLabels = {
  roster: { num: 1, label: 'Roster' },
  'quick-calc': { num: 2, label: 'Set target time' },
  'predicted-splits': { num: 3, label: 'Predicted splits' },

let renderedView = null;   // which screen the DOM currently shows, for scroll restoration

function render() {
  const host = document.getElementById('screen-container');
  // Redrawing the SAME screen means a value changed — the coach should stay exactly where
  // they were. Moving to a DIFFERENT screen still starts at the top, as expected.
  const prevScroller = host.querySelector('.scrollable');
  const keepScroll = (renderedView === state.view && prevScroller) ? prevScroller.scrollTop : 0;
  // Remember which time box held the caret: every input node is about to be replaced.
  const ae = document.activeElement;
  const aeGrp = (ae && host.contains(ae) && ae.closest) ? ae.closest('[data-tkey]') : null;
  const keepFocus = (renderedView === state.view && aeGrp)
    ? { key: aeGrp.getAttribute('data-tkey'), box: (ae.className.split(' ').find((c) => c.indexOf('tb-') === 0) || '') }
    : null;
  // Back on the main page: forget which events were expanded, so opening any swimmer starts
  // with every event collapsed. Drilling into a race and back keeps your place, because that
  // path never passes through the roster.
  if (state.view === 'roster') state.rgOpen = {};
  let html = '';
  switch (state.view) {
    case 'roster': html = SWIMMER ? (selfSid() ? renderSwimmerHome() : renderSwimmerSetup()) : renderRoster(); break;
    case 'swimmer-setup': html = renderSwimmerSetup(); break;
    case 'saved-swimmer': html = renderSavedSwimmer(); break;
    case 'swimmer-detail': html = renderSwimmerDetail(); break;
    case 'quick-calc': html = renderQuickCalc(); break;
    case 'predicted-splits': html = renderPredictedSplits(); break;
    case 'race-entry': html = renderRaceEntry(); break;
    case 'race-analysis': html = renderRaceAnalysis(); break;
    case 'race-compare': html = renderRaceCompare(); break;
    case 'squad-targets': html = renderSquadTargets(); break;
    case 'converter': html = renderConverter(); break;
    case 'efficiency': html = renderEfficiency(); break;
    case 'fifty': html = renderFifty(); break;
    case 'adjacent': html = renderAdjacent(); break;
    case 'trends': html = renderTrends(); break;
    case 'progress': html = renderProgress(); break;
    case 'progress-group': html = renderProgressGroup(); break;
    case 'best-times': html = renderBestTimes(); break;
    case 'import-menu': html = renderImportMenu(); break;
    case 'import-season': html = renderImportSeason(); break;
    case 'import-meet': html = renderImportMeet(); break;
    case 'import-preview': html = renderImportPreview(); break;
    case 'training-pace': html = renderTrainingPace(); break;
    case 'other-tools': html = renderOtherTools(); break;
    default: html = '<div class="p-8 text-slate-500">Unknown view</div>';
  }
  host.innerHTML = html;
  renderedView = state.view;
  if (keepScroll) { const sc = host.querySelector('.scrollable'); if (sc) sc.scrollTop = keepScroll; }
  if (keepFocus && keepFocus.box) {
    const g = host.querySelector(`[data-tkey="${keepFocus.key}"]`);
    const box = g && g.querySelector('.' + keepFocus.box);
    if (box) { box.focus(); box.select(); }
  }
  renderJumper();
  // Re-bind input event for time field if present
  const ti = host.querySelector('[data-time-input]');
  if (ti) {
    ti.addEventListener('input', () => {
      const v = parseTime(ti.value);
      if (v != null) state.form.targetSeconds = v;
    });
    ti.addEventListener('blur', () => {
      ti.value = formatTime(state.form.targetSeconds);
    });
  }
  // On the predicted-splits screen the target is editable inline — recompute splits on commit.
  const tedit = host.querySelector('[data-target-edit]');
  if (tedit) {
    const commit = () => {
      const v = parseTime(tedit.value);
      if (v != null && state.result) {
        const r = state.result;
        state.form.targetSeconds = v;
        state.result = predict(r.stroke, r.sex, r.pool, r.distance, v);
        render();
      }
    };
    // The one time input without a minutes cap. Nothing at 400 m or shorter runs 10+ minutes,
    // so trim the minutes portion to minDigits() exactly as the segmented boxes do.
    tedit.addEventListener('input', () => {
      const cap = minDigits(state.form.distance);
      tedit.value = tedit.value.replace(/^(\s*)(\d+)(?=\s*:)/, (m, ws, d) => ws + d.slice(0, cap));
    });
    tedit.addEventListener('blur', commit);
    tedit.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tedit.blur(); } });
  }
  // Segmented target time (min : sec . hundredths) on the Split predictor form.
  const tmin = host.querySelector('[data-tmin]');
  const tsec = host.querySelector('[data-tsec]');
  const thh = host.querySelector('[data-thh]');
  if (tmin && tsec && thh) {
    const wapts = host.querySelector('[data-wapts]');
    const showPts = () => {                    // keep the points box in step with the time
      if (!wapts || document.activeElement === wapts) return;
      const f = state.form;
      const p = waPoints(f.targetSeconds, f.stroke, f.distance, f.pool, f.sex);
      wapts.value = (p != null && p > 0) ? p : '';
    };
    const sync = () => {
      const m = parseInt(tmin.value || '0', 10) || 0;
      const s = parseInt(tsec.value || '0', 10) || 0;
      const h = parseInt(thh.value || '0', 10) || 0;
      state.form.targetSeconds = m * 60 + s + h / 100;
      showPts();
    };
    if (wapts) {
      wapts.addEventListener('focus', () => wapts.select());
      wapts.addEventListener('input', () => {
        wapts.value = wapts.value.replace(/\D/g, '').slice(0, 4);
        const f = state.form;
        const p = parseInt(wapts.value || '0', 10);
        const t = p > 0 ? waTimeForPoints(p, f.stroke, f.distance, f.pool, f.sex) : null;
        if (t == null) return;
        state.form.targetSeconds = t;          // drive the time boxes, don't re-render (keeps the caret)
        tmin.value = Math.floor(t / 60);
        tsec.value = String(Math.floor(t % 60)).padStart(2, '0');
        thh.value = String(Math.round((t - Math.floor(t)) * 100)).padStart(2, '0');
      });
      wapts.addEventListener('blur', () => render());
    }
    [tmin, tsec, thh].forEach((el) => {
      el.addEventListener('focus', () => el.select());
      el.addEventListener('input', () => {
        const cap = (el === tmin) ? minDigits(state.form.distance) : 2;
        el.value = el.value.replace(/\D/g, '').slice(0, cap); // digits only
        sync();
        if (el === tmin && el.value.length === cap) { tsec.focus(); tsec.select(); }
        else if (el === tsec && el.value.length === 2) { thh.focus(); thh.select(); }
      });
      el.addEventListener('blur', () => {
        if ((el === tsec || el === thh) && el.value !== '') el.value = el.value.padStart(2, '0');
        sync();
      });
    });
  }
  // Course-converter segmented input (min:sec.hh) → state.convForm.seconds; live-update the result.
  const cmin = host.querySelector('[data-cmin]');
  const csec = host.querySelector('[data-csec]');
  const chh = host.querySelector('[data-chh]');
  if (cmin && csec && chh) {
    const res = host.querySelector('#conv-result');
    const sync = () => {
      const m = parseInt(cmin.value || '0', 10) || 0;
      const s = parseInt(csec.value || '0', 10) || 0;
      const h = parseInt(chh.value || '0', 10) || 0;
      state.convForm.seconds = m * 60 + s + h / 100;
      if (res) res.innerHTML = convResultHtml();
    };
    [cmin, csec, chh].forEach((el) => {
      el.addEventListener('focus', () => el.select());
      el.addEventListener('input', () => {
        el.value = el.value.replace(/\D/g, '').slice(0, 2);
        sync();
        if (el === cmin && el.value.length === 2) { csec.focus(); csec.select(); }
        else if (el === csec && el.value.length === 2) { chh.focus(); chh.select(); }
      });
      el.addEventListener('blur', () => {
        if ((el === csec || el === chh) && el.value !== '') el.value = el.value.padStart(2, '0');
        sync();
      });
    });
  }
  // Generic segmented-time binder used by the 50 m and adjacent screens (live-updates a result box).
  const bindSegTime = (minSel, secSel, hhSel, setSeconds, resultSel, resultHtml) => {
    const mn = host.querySelector(minSel), sc = host.querySelector(secSel), hh = host.querySelector(hhSel);
    if (!mn || !sc || !hh) return;
    const box = resultSel ? host.querySelector(resultSel) : null;
    const tenths = hh.hasAttribute('data-tenths');
    const div = tenths ? 10 : 100, cap = tenths ? 1 : 2;
    const sync = () => {
      const m = parseInt(mn.value || '0', 10) || 0, s = parseInt(sc.value || '0', 10) || 0, h = parseInt(hh.value || '0', 10) || 0;
      setSeconds(m * 60 + s + h / div);
      if (box) box.innerHTML = resultHtml();
    };
    [mn, sc, hh].forEach((el) => {
      el.addEventListener('focus', () => el.select());
      el.addEventListener('input', () => {
        el.value = el.value.replace(/\D/g, '').slice(0, el === hh ? cap : 2);
        sync();
        if (el === mn && el.value.length === 2) { sc.focus(); sc.select(); }
        else if (el === sc && el.value.length === 2) { hh.focus(); hh.select(); }
      });
      el.addEventListener('blur', () => {
        if (el === sc && el.value !== '') el.value = el.value.padStart(2, '0');
        else if (el === hh && !tenths && el.value !== '') el.value = el.value.padStart(2, '0');
        sync();
      });
    });
  };
  bindSegTime('[data-fmin]', '[data-fsec]', '[data-fhh]', (v) => { state.fiftyForm.seconds = v; }, '#fifty-result', fiftyResultHtml);

  bindSegTime('[data-emin]', '[data-esec]', '[data-ehh]', (v) => { state.effForm.t = v; }, '#eff-result', effResultHtml);

  host.querySelectorAll('[data-toolname]').forEach((el) => {

    const box = document.createElement('div');
    box.className = 'hidden';
    box.style.cssText = 'position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:60;max-height:200px;overflow-y:auto;';

      const q = el.value.trim();
      const names = [...new Set(state.saved.map(s => s.name).filter(Boolean))];
      const matches = q ? names.filter(n => nameMatches(n, q)) : [];
      const exact = q && names.some(n => normName(n) === normName(q));
      let rows = matches.slice(0, 8).map(n => `<div data-suggest="${n.replace(/"/g, '&quot;')}" class="px-3.5 py-2.5 text-sm clickable hover:bg-slate-50">${n}</div>`).join('');

    box.addEventListener('mousedown', (e) => {
      const nu = e.target.closest('[data-suggest-new]');

      const opt = e.target.closest('[data-suggest]'); if (!opt) return;
      e.preventDefault();

      const match = state.saved.filter(s => s.name === nm);

  });
  const effDateEl = host.querySelector('[data-eff-date]');
  if (effDateEl) effDateEl.addEventListener('input', () => { state.effForm.date = effDateEl.value; });
  host.querySelectorAll('[data-eff15]').forEach((el) => {
    const field = el.getAttribute('data-eff15');
    el.addEventListener('input', () => { state.effForm[field] = parseFloat(el.value) || 0; const er = host.querySelector('#eff-result'); if (er) er.innerHTML = effResultHtml(); });
  });
  const fiftyDateEl = host.querySelector('[data-fifty-date]');
  if (fiftyDateEl) fiftyDateEl.addEventListener('input', () => { state.fiftyForm.date = fiftyDateEl.value; });
  // 50 m "best time" inputs — delegated on the (persistent) result box so listeners survive its
  // live innerHTML updates. Store on input; recompute Δ% + colours on focus-out.
  const fr = host.querySelector('#fifty-result');
  if (fr && !fr._bestBound) {
    fr._bestBound = true;
    fr.addEventListener('input', (e) => {
      const el = e.target.closest('[data-best],[data-fifty-cp],[data-fifty-sr],[data-fifty-sc]'); if (!el) return;
      const v = parseFloat(el.value); const empty = el.value.trim() === '';
      const put = (obj, key) => { if (empty) delete obj[key]; else if (!isNaN(v)) obj[key] = v; };
      if (el.hasAttribute('data-best')) put(state.fiftyForm.best, el.getAttribute('data-best'));
      else if (el.hasAttribute('data-fifty-cp')) put(state.fiftyForm.best, el.getAttribute('data-fifty-cp'));
      else if (el.hasAttribute('data-fifty-sr')) put(state.fiftyForm.sr = (state.fiftyForm.sr || {}), el.getAttribute('data-fifty-sr'));
      else if (el.hasAttribute('data-fifty-sc')) put(state.fiftyForm.sc = (state.fiftyForm.sc || {}), el.getAttribute('data-fifty-sc'));
    });
    fr.addEventListener('focusout', (e) => {
      if (e.target.closest('[data-best],[data-fifty-cp],[data-fifty-sr],[data-fifty-sc]')) fr.innerHTML = fiftyResultHtml();
    });
  }
  const er = host.querySelector('#eff-result');
  if (er && !er._effBound) {
    er._effBound = true;
    er.addEventListener('input', (e) => {
      const el = e.target.closest('[data-eff-in]'); if (!el) return;
      const p = el.getAttribute('data-eff-in').split(':'); // a:<test>:t|s (whole test) or c:<mark>:t|s (race-map checkpoint)
      const vv = parseFloat(el.value); const val = (el.value.trim() === '' || isNaN(vv)) ? null : vv;
      const f = state.effForm;
      if (p[0] === 'a') {
        const a = (f.acts = f.acts || {}); const rec = (a[p[1]] = a[p[1]] || {});
        if (val == null) delete rec[p[2]]; else rec[p[2]] = val;
        const cell = er.querySelector('#effr-' + p[1]); if (cell) cell.innerHTML = effActResult(p[1]);
      } else if (p[0] === 'c') {
        const c = (f.cps = f.cps || {}); const k = 'sg' + p[1] + p[2];
        if (val == null) delete c[k]; else c[k] = val;
        const cell = er.querySelector('#effcp-' + p[1]); if (cell) cell.innerHTML = effCpResult(parseInt(p[1], 10));
      }
    });
    // Re-render only when focus leaves the result box entirely - tabbing between segment inputs keeps focus alive.
    er.addEventListener('focusout', (e) => { if (e.relatedTarget && er.contains(e.relatedTarget)) return; er.innerHTML = effResultHtml(); });
  }

    const key = grp.getAttribute('data-tkey');
    const mi = grp.querySelector('.tb-min'), se = grp.querySelector('.tb-sec'), hh = grp.querySelector('.tb-hh');
    if (!mi || !se || !hh) return;
    const sync = () => {
      const m = parseInt(mi.value || '0', 10) || 0, s = parseInt(se.value || '0', 10) || 0, h = parseInt(hh.value || '0', 10) || 0;
      state.raceForm.times[key] = m * 60 + s + h / 100;
    };
    [mi, se, hh].forEach((el) => {
      el.addEventListener('focus', () => el.select());
      el.addEventListener('input', () => {
        const cap = (el === mi) ? minDigits(state.form.distance) : 2;
        el.value = el.value.replace(/\D/g, '').slice(0, cap);
        sync();
        markSplitTouched(key);
        if (el === mi && el.value.length === cap) { se.focus(); se.select(); }
        else if (el === se && el.value.length === 2) { hh.focus(); hh.select(); }
        // The split is fully entered the moment the hundredths box fills — adjust the last
        // split right then, so it lands without the coach having to tap anywhere.
        if (key !== 'target' && el === hh && el.value.length === 2) deriveLastSplit(key);
      });
      el.addEventListener('blur', () => {
        if ((el === se || el === hh) && el.value !== '') el.value = el.value.padStart(2, '0');
        sync();
        if (key === 'target') return;
        // Auto-advance (sec -> hh) fires blur too, so acting here would re-derive the last
        // split and redraw the screen BETWEEN the seconds and the hundredths of the number
        // being typed. Wait a tick and only act once focus has left the whole group — the
        // same guard the target box uses.
        setTimeout(() => {
          if (grp.contains(document.activeElement)) return;
          deriveLastSplit(key);
        }, 0);
      });
    });
    // Time-swam box: refresh the predicted "what they swam" splits whenever the time changes.
    if (key === 'target') {
      [mi, se, hh].forEach((el) => {
        el.addEventListener('focus', () => { if (grp._t0 == null) grp._t0 = state.raceForm.times.target; });
        // The time is complete the moment the hundredths box fills — refresh the splits right
        // then, instead of making the coach tap somewhere first.
        // Fires on a KEYSTROKE, not on the value changing — re-typing the same time has to
        // reset too. The flag is what stops a stray tap-in-tap-out wiping real splits.
        el.addEventListener('input', () => {
          grp._edited = true;
          if (el !== hh || el.value.length !== 2 || state.view !== 'race-entry') return;
          resetRaceSplits();
        });
        el.addEventListener('blur', () => {
          setTimeout(() => {
            if (grp.contains(document.activeElement)) return;
            const edited = !!grp._edited;
            grp._t0 = null; grp._edited = false;
            // Painted, never rendered — a redraw here is what used to move the screen.
            if (edited && state.view === 'race-entry') resetRaceSplits();
          }, 0);
        });
      });
    }
  });
  // Race-entry extra fields: per-split SR, competition, date, notes.
  host.querySelectorAll('[data-race-sr]').forEach((el) => {
    const key = el.getAttribute('data-race-sr');
    el.addEventListener('input', () => { (state.raceForm.sr = state.raceForm.sr || {})[key] = el.value; });
  });
  const rcomp = host.querySelector('[data-race-comp]');
  if (rcomp) {
    const cbox = host.querySelector('[data-comp-suggest]');
    const raceComps = state.saved.filter(s => s.kind === 'race' && (s.competition || '').trim());
    const comps = [...new Set(raceComps.map(s => s.competition.trim()))];
    const compDates = {};
    raceComps.forEach(s => { const k = s.competition.trim().toLowerCase(); if (s.date && (!compDates[k] || s.date > compDates[k])) compDates[k] = s.date; });
    const showComp = () => {
      if (!cbox) return;
      const q = rcomp.value.trim().toLowerCase();
      const m = q ? comps.filter(c => c.toLowerCase().startsWith(q) && c.toLowerCase() !== q) : [];
      if (!m.length) { cbox.classList.add('hidden'); cbox.innerHTML = ''; return; }
      cbox.innerHTML = m.slice(0, 8).map(c => `<div data-comp-pick="${c.replace(/"/g, '&quot;')}" class="px-3.5 py-2.5 text-sm clickable hover:bg-slate-50">${c.replace(/</g, '&lt;')}</div>`).join('');
      cbox.classList.remove('hidden');
    };
    rcomp.addEventListener('input', () => { state.raceForm.competition = rcomp.value; showComp(); });
    rcomp.addEventListener('focus', showComp);
    rcomp.addEventListener('blur', () => setTimeout(() => cbox && cbox.classList.add('hidden'), 150));
    if (cbox) cbox.addEventListener('mousedown', (e) => {
      const opt = e.target.closest('[data-comp-pick]');
      if (opt) {
        e.preventDefault();
        const v = opt.getAttribute('data-comp-pick');
        rcomp.value = v; state.raceForm.competition = v;
        const d = compDates[v.trim().toLowerCase()];      // pull that meet's last-used date
        if (d) { state.raceForm.date = d; const rdate = host.querySelector('[data-race-date]'); if (rdate) rdate.value = d; }
        cbox.classList.add('hidden');
      }
    });
  }
  const rdate = host.querySelector('[data-race-date]'); if (rdate) rdate.addEventListener('input', () => { state.raceForm.date = rdate.value; });
  const rnotes = host.querySelector('[data-race-notes]'); if (rnotes) rnotes.addEventListener('input', () => { state.raceForm.notes = rnotes.value; });
  // Reflection fields. Painted, never re-rendered on input — a redraw would close the
  // keyboard and lose the caret mid-sentence.
  host.querySelectorAll('[data-refl]').forEach((el) => {
    const k = el.getAttribute('data-refl');
    el.addEventListener('input', () => {

      const r = state.race; if (!r) return;
      (r.reflect = r.reflect || {})[k] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
      if (state.saved.some((s) => s.id === r.id)) persistSaved();

  });
  host.querySelectorAll('[data-refl-hint]').forEach((el) => {

      render();
    });
  });
  // Split-predictor name field: autocomplete from previously saved names (first/last prefix).
  const nameInput = host.querySelector('[data-name-input]');
  if (nameInput) {
    const box = host.querySelector('[data-name-suggest]');
    const showSuggest = () => {
      state.form.name = nameInput.value;
      if (!box) return;
      const q = nameInput.value.trim();
      const names = [...new Set(state.saved.map(s => s.name).filter(Boolean))];
      const matches = q ? names.filter(n => nameMatches(n, q)) : [];
      const exact = q && names.some(n => normName(n) === normName(q));
      let rows = matches.slice(0, 8).map(n =>
        `<div data-suggest="${n.replace(/"/g, '&quot;')}" class="px-3.5 py-2.5 text-sm clickable hover:bg-slate-50">${n}</div>`).join('');
      if (q && !exact) rows += `<div data-suggest-new="${q.replace(/"/g, '&quot;')}" class="px-3.5 py-2.5 text-sm clickable hover:bg-cyan-50 text-cyan-700 font-semibold${rows ? ' border-t border-slate-100' : ''}">＋ New swimmer “${q}”</div>`;
      if (!rows) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.innerHTML = rows;
      box.classList.remove('hidden');
    };
    nameInput.addEventListener('input', showSuggest);
    nameInput.addEventListener('focus', showSuggest);
    // Typing a name = a new swimmer (clear any linked id); picking a suggestion re-links to that swimmer.
    nameInput.addEventListener('input', () => { state.form.sid = null; });
    nameInput.addEventListener('blur', () => setTimeout(() => box && box.classList.add('hidden'), 150));
    if (box) box.addEventListener('mousedown', (e) => {
      const nu = e.target.closest('[data-suggest-new]');
      if (nu) { e.preventDefault(); const nm = nu.getAttribute('data-suggest-new'); nameInput.value = nm; state.form.name = nm; state.form.sid = null; box.classList.add('hidden'); return; }
      const opt = e.target.closest('[data-suggest]');
      if (opt) {

        box.classList.add('hidden');
      }
    });
  }
  // Roster search: live-filter rows by name (token prefix), no full re-render so focus is kept.
  const search = host.querySelector('[data-search]');
  if (search) {
    search.addEventListener('input', () => {
      state.search = search.value;
      const q = search.value.trim();
      host.querySelectorAll('.roster-row').forEach(row => {
        row.style.display = nameMatches(row.getAttribute('data-name') || '', q) ? '' : 'none';
      });
    });
    // Return/"check" key: commit the search — refresh to the full current-settings list.
    search.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search.blur(); render(); } });
  }
  const selfN = host.querySelector('[data-self-name]');
  if (selfN) {
    selfN.addEventListener('input', () => { (state.selfSetup = state.selfSetup || {}).name = selfN.value; });
    selfN.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); selfN.blur(); } });
  }
  const tpq = host.querySelector('[data-tp-search]');
  if (tpq) {
    tpq.addEventListener('input', () => {
      state.tpForm.q = tpq.value; const q = tpq.value.trim();
      host.querySelectorAll('.tp-row').forEach((row) => { row.style.display = nameMatches(row.getAttribute('data-name') || '', q) ? '' : 'none'; });
    });

    tpq.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tpq.blur(); render(); } });
  }
  // Name the keyboard's return key. iOS draws a named action (search/done) as the
  // prominent blue key; the unnamed default is a grey "return". Doing it here covers
  // every field on every screen instead of 21 hand-edited tags.
  // Enter also blurs, so the key does what its label promises — and dismissing the
  // keyboard is what restores the page scale on any iOS that still zoomed.
  const NO_HINT = { checkbox: 1, radio: 1, date: 1, range: 1, file: 1 };
  host.querySelectorAll('input').forEach((el) => {
    if (NO_HINT[(el.getAttribute('type') || 'text').toLowerCase()]) return;

    el.setAttribute('enterkeyhint', isSearch ? 'search' : 'done');
    if (isSearch) return;                      // those two already commit on Enter
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  });
}

// One card, hairline dividers, no border on the last row. Rows are built here rather

      </button>`).join('');
  return `<div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">${html}</div>`;

// Three sections, each collapsible, each capped at four questions. The LAST question of
// every section is the forward-looking one, and it is the one that echoes back next time.

  { key: 'race', title: 'Reflect on your race?', sub: 'What happened in the water.',
    fields: [
      { k: 'r_well', label: 'What did you do well technically?', rows: 3, max: 300,

    ] },

// The same swimmer's previous saved race — where the echo comes from.
function lastReflect(key) {
  const cur = state.race || {};
  const sid = cur.sid || selfSid();
  const races = state.saved.filter((s) => s.kind === 'race' && s.sid === sid && s.reflect
    && s.id !== cur.id && (s.date || '') <= (cur.date || '9999')
    && String(s.reflect[key] == null ? '' : s.reflect[key]).trim());
  races.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const r = races[races.length - 1];
  return r ? { text: r.reflect[key], date: r.date || '', ev: `${r.distance} ${r.stroke}` } : null;
}

function reflectSectionsHtml() {
  const r = state.race;
  if (!r) return '';
  const v = r.reflect || (r.reflect = {});
  const open = state.reflOpen || (state.reflOpen = {});
  const esc = (s) => String(s == null ? '' : s).replace(/</g, '&lt;');
  const hintHtml = (f) => `<button class="w-5 h-5 rounded-full bg-slate-100 text-slate-500 text-[11px] font-bold flex items-center justify-center flex-shrink-0 hover:bg-slate-200" data-refl-hint="${f.k}" aria-label="What to write here">?</button>`;

  const field = (f) => {
    const showHint = open['h:' + f.k] !== false;   // open until they close it
    const hint = showHint ? `<div class="text-[11px] text-muted leading-snug mb-1.5">${f.hint}</div>` : '';
    let echo = '';
    if (f.echo) {
      const p = lastReflect(f.k);
      if (p) echo = `<div class="rounded-xl bg-cyan-50 border border-cyan-200 px-3 py-2 mb-2 text-[11px] text-cyan-900 leading-snug">
        <span class="font-semibold">Last race you said:</span> “${esc(p.text)}”
        <span class="text-cyan-700">— how did that go?</span></div>`;
    }
    const head = `<div class="flex items-start justify-between gap-2 mb-1">
        <div class="text-[13px] font-semibold text-slate-700 leading-snug">${f.label}</div>${hintHtml(f)}
      </div>`;
    if (f.type === 'num') {
      return `<div>${head}${hint}
        <input type="number" min="1" max="10" step="1" inputmode="numeric" value="${v[f.k] == null ? '' : v[f.k]}" data-refl="${f.k}" placeholder="\u2013"
          class="w-16 h-14 bg-slate-100 rounded-xl text-center mono font-bold text-[22px] text-cyan-800 outline-none focus:ring-2 focus:ring-cyan-300" aria-label="${f.label}" />
      </div>`;
    }
    if (f.type === 'three') {
      const rows = [0, 1, 2].map((i) => `<input type="text" maxlength="${f.max}" value="${String(v[f.k + i] || '').replace(/"/g, '&quot;')}" data-refl="${f.k}${i}" placeholder="${i + 1}." class="w-full bg-slate-100 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-cyan-300" />`).join('');
      return `<div>${head}${hint}<div class="space-y-2">${rows}</div></div>`;
    }
    return `<div>${head}${hint}${echo}
      <textarea data-refl="${f.k}" rows="${f.rows}" maxlength="${f.max}" class="w-full bg-slate-100 rounded-xl px-3.5 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-300 resize-none">${esc(v[f.k])}</textarea></div>`;
  };

  const filled = (s) => s.fields.reduce((n, f) => n + (f.type === 'three'
    ? [0, 1, 2].filter((i) => String(v[f.k + i] || '').trim()).length
    : (String(v[f.k] == null ? '' : v[f.k]).trim() ? 1 : 0)), 0);

  const sec = (s) => {
    const isOpen = !!open[s.key];
    const n = filled(s);
    return `<div class="bg-white border border-cyan-200 rounded-2xl overflow-hidden">
      <button class="w-full px-4 py-3 flex items-center gap-3 text-left bg-cyan-50 hover:bg-cyan-100 active:bg-cyan-100 transition" data-action="refl-toggle" data-sec="${s.key}">
        <span class="flex-1 min-w-0">
          <span class="block font-semibold text-cyan-900 text-[14px]">${s.title}</span>
          <span class="block text-[11px] text-cyan-700 mt-0.5">${s.sub}</span>
        </span>
        ${n ? `<span class="text-[11px] font-semibold text-cyan-700 flex-shrink-0">${n} answered</span>` : ''}
        <span class="text-cyan-700 text-base font-bold flex-shrink-0">${isOpen ? '\u2013' : '+'}</span>
      </button>
      ${isOpen ? `<div class="px-4 pb-4 pt-3 space-y-4 border-t border-cyan-100">${s.fields.map(field).join('')}</div>` : ''}
    </div>`;
  };

  return `<div class="space-y-2">
      <div class="text-[11px] text-muted px-1 leading-snug">All optional \u2014 and saved as you type. You can come back to this any time from My races.</div>
      ${REFL_SECTIONS.map(sec).join('')}
    </div>`;
}

function renderSavedSwimmer() {
  const sid = state.savedSid;
  const all = sid ? state.saved.filter(s => s.sid === sid) : [];
  if (!all.length) return renderRoster();
  const name = all[all.length - 1].name || '';
  const editing = state.editing;
  const plans   = all.filter(s => !s.kind || s.kind === 'plan');
  const races   = all.filter(s => s.kind === 'race');
  const adj     = all.filter(s => s.kind === 'adjacent');
  const fifties = all.filter(s => s.kind === 'fifty');
  const convs   = all.filter(s => s.kind === 'convert');
  const effs    = all.filter(s => s.kind === 'eff');

  // Shared row scaffolding: clickable to review (data-saved), or a trash button in edit mode.
  const delBtn = (id, label) => `<button class="w-9 h-9 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center hover:bg-rose-100 active:scale-95 transition flex-shrink-0" data-del-event="${id}" aria-label="Delete ${label}">${TRASH_SVG}</button>`;
  const rowOpen = (id) => `<div class="px-3 py-3.5 flex items-center gap-3 ${editing ? '' : 'clickable'} rounded-xl border-b border-slate-100" ${editing ? '' : `data-saved="${id}"`} style="min-height: 56px;">`;
  const arrow = (t) => `<span class="text-cyan-700 text-sm font-bold">${t}</span>`;
  const sexL = (s) => s.sex === 'M' ? 'Men' : 'Women';

  // Group races and plans by event: one header row per distance+stroke+pool, tap to expand.
  state.rgOpen = state.rgOpen || {};
  const strokeOrd = { Free: 0, Back: 1, Breast: 2, Fly: 3, IM: 4 };
  const groupByEvent = (arr) => {
    const g = {};
    arr.forEach(s => { const k = s.distance + '|' + s.stroke + '|' + s.pool; (g[k] = g[k] || []).push(s); });
    return Object.keys(g).sort((a, b) => {
      const A = a.split('|'), B = b.split('|');
      return (strokeOrd[A[1]] ?? 9) - (strokeOrd[B[1]] ?? 9) || (+A[0]) - (+B[0]) || A[2].localeCompare(B[2]);
    }).map(k => [k, g[k]]);
  };
  const groupHead = (gk, dist, stk, pool, sub, open) => `
    <div class="px-3 py-3.5 flex items-center gap-3 clickable rounded-xl border-b border-slate-100" data-rgroup="${gk}" style="min-height:52px;">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[15px]">${dist} ${stk} <span class="text-xs font-normal text-muted">${pool}</span></div>
        <div class="text-xs text-muted mt-0.5">${sub}</div>
      </div>
      <span class="text-slate-400 text-base">${open ? '▾' : '▸'}</span>
    </div>`;

  const planRow = (s) => `
    ${rowOpen(s.id)}
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[15px]">${s.isTarget ? '<span class="text-amber-500">★</span> ' : ''}Target <span class="mono text-slate-700">${formatTime(s.targetSeconds)}</span></div>
        <div class="text-xs text-muted mt-0.5">${s.pool} · ${sexL(s)}</div>
      </div>
      ${editing ? delBtn(s.id, 'pace plan') : arrow('Splits →')}
    </div>`;
  const predGroupsHtml = (arr, forceOpen) => groupByEvent(arr).map(([k, list]) => {
    const [dist, stk, pool] = k.split('|');
    const gk = 'p:' + k;
    const open = forceOpen || editing || !!state.rgOpen[gk];
    const latest = list[list.length - 1];
    const sub = list.length + ' plan' + (list.length === 1 ? '' : 's') + ' · latest <span class="mono font-semibold text-slate-700">' + formatTime(latest.targetSeconds) + '</span>';
    return groupHead(gk, dist, stk, pool, sub, open) + (open ? `<div style="padding-left:14px;">${list.slice().reverse().map(planRow).join('')}</div>` : '');
  }).join('');
  const predRows = predGroupsHtml(plans);

  const racePts = (s) => { const c = buildRaceComparison(s); const t = c ? c.actualTotal : 0; return t > 0 ? waPoints(t, s.stroke, s.distance, s.pool, s.sex) : null; };
  const raceRow = (s) => {
    const c = buildRaceComparison(s);
    const tot = c ? c.actualTotal : 0;
    const pts = racePts(s);
    return `
    ${rowOpen(s.id)}
      <div class="flex-1 min-w-0">

  const raceRowsHtml = raceGroupsHtml(races);
  const strokesIn = (arr) => [...new Set(arr.map((s) => s.stroke))].sort((a, b) => (strokeOrd[a] ?? 9) - (strokeOrd[b] ?? 9));
  const strokeTabs = (arr, sel) => { const ss = strokesIn(arr); return ss.length ? `<div class="px-3 pt-3 pb-1 flex flex-wrap gap-1.5 bg-slate-50">${ss.map((st) => `<button class="px-3 py-1.5 rounded-full text-xs font-semibold border transition ${sel === st ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-white text-slate-700 border-slate-200'}" data-sw-stroke="${st}">${st}</button>`).join('')}</div>` : ''; };

  const adjRows = adj.slice().reverse().map(s => `

  const fiftyRows = fifties.slice().reverse().map(s => `

  const compareBtn = ''; // compare removed in the simplified race logger

  const section = (label, rows, big) => rows ? `<div class="px-2 ${big ? 'pt-4' : 'pt-3'} pb-1">${big ? `<span class="text-[17px] font-bold text-slate-800">${label}</span>` : `<span class="label-cap">${label}</span>`}</div>${rows}` : '';
  const subtitle = [

    adj.length ? `${adj.length} adjacent` : '',

    convs.length ? `${convs.length} conversion${convs.length === 1 ? '' : 's'}` : '',

  const swHeader = (title) => `

    const arr = tab === 'plans' ? plans : races;
    const ss = strokesIn(arr); let sel = state.swimmerStroke; if (ss.indexOf(sel) < 0) sel = ss[0];
    const rows = !sel ? '' : (tab === 'plans'
      ? predGroupsHtml(plans.filter((s) => s.stroke === sel), true)

    const empty = tab === 'plans' ? 'No saved target times.' : 'No races.';
    // Nothing left to edit — drop out of edit mode rather than showing a bare Done.
    if (editing && !arr.length) state.editing = false;
    return `${swHeader(both ? 'Races and target times' : (tab === 'plans' ? 'Target times' : 'Past races'))}${viewTabs}${strokeTabs(arr, sel)}<div class="scrollable px-3 pb-2 bg-slate-50">${rows || `<div class="p-8 text-center text-sm text-muted">${empty}</div>`}</div>`;
  }

  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-3 flex items-center gap-3">

    ${(races.length || plans.length || hasProgress(sid)) ? `<div class="px-5 pb-2">${navCard([

    <div class="scrollable px-3 pb-2 bg-slate-50">
      ${editing ? section('Record Races', raceRowsHtml, true) : ''}
      ${editing ? section('Season targets', predRows, true) : ''}
      ${section('Adjacent events', adjRows)}
      ${section('50 m LCM splits', fiftyRows)}
      ${section('Course conversions', convRows)}
      ${section('Efficiency tests', effRows)}
    </div>
  `;
}

// ----- Screen: Best times (fastest saved race per event, with time-window filters) -----
function bestTimesFor(sid, f) {
  const races = state.saved.filter(s => s.sid === sid && s.kind === 'race');
  const now = new Date();
  const inWin = (r) => {
    if (f.mode === 'all') return true;
    if (!r.date) return false;
    const d = new Date(r.date + 'T12:00:00');
    if (isNaN(d)) return false;
    if (f.mode === 'year') return f.year != null && d.getFullYear() === f.year;
    const c = new Date(now);
    c.setMonth(c.getMonth() - ({ m1: 1, m3: 3, m6: 6, m9: 9 }[f.mode] || 0));
    return d >= c;
  };
  const best = {};
  races.forEach(r => {
    if (!inWin(r)) return;
    const c = buildRaceComparison(r);
    if (!c || !(c.actualTotal > 0)) return;
    const key = r.distance + '|' + r.stroke + '|' + r.pool;
    if (!best[key] || c.actualTotal < best[key].t - 1e-9) best[key] = { r, t: c.actualTotal };
  });
  const order = { Free: 0, Back: 1, Breast: 2, Fly: 3, IM: 4 };
  return Object.values(best).sort((a, b) =>
    (order[a.r.stroke] ?? 9) - (order[b.r.stroke] ?? 9) || a.r.distance - b.r.distance || String(a.r.pool).localeCompare(String(b.r.pool)));
}

function renderBestTimes() {
  const sid = state.savedSid;
  const all = sid ? state.saved.filter(s => s.sid === sid) : [];
  if (!all.length) return renderRoster();
  const name = all[all.length - 1].name || '';
  const f = state.btFilter || (state.btFilter = { mode: 'all', year: null });
  const races = all.filter(s => s.kind === 'race');
  const years = [...new Set(races.map(r => (r.date || '').slice(0, 4)).filter(y => /^\d{4}$/.test(y)))].sort().reverse();
  const chips = [['m1', '1 mo'], ['m3', '3 mo'], ['m6', '6 mo'], ['m9', '9 mo'], ['year', 'Year'], ['all', 'All']];
  const undated = races.filter(r => !r.date).length;
  const list = bestTimesFor(sid, f);
  // Sorting by AQUA points replaces the old separate "Ranked by AQUA points" screen.
  // It respects the window chips above, which the old screen never did.
  const withPts = list.map(({ r, t }) => ({ r, t, pts: waPoints(t, r.stroke, r.distance, r.pool, r.sex) }));
  const anyPts = withPts.some((x) => x.pts != null);
  const sort = anyPts && state.btSort === 'pts' ? 'pts' : 'event';
  const shown = sort === 'pts'
    ? withPts.filter((x) => x.pts != null).sort((a, b) => b.pts - a.pts)
    : withPts;
  const rows = shown.map(({ r, t, pts }, i) => `
    <div class="px-3 py-3.5 flex items-center gap-3 clickable rounded-xl border-b border-slate-100" data-saved="${r.id}" style="min-height:56px;">
      ${sort === 'pts' ? `<div class="w-6 text-center text-sm font-bold text-slate-400 flex-shrink-0">${i + 1}</div>` : ''}
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[15px]">${r.distance} ${r.stroke} <span class="text-xs font-normal text-muted">${r.pool}</span></div>
        <div class="text-xs text-muted mt-0.5">${sort === 'pts' ? `<span class="mono">${formatTime(t)}</span> · ` : ''}${r.date || 'no date'}${meetLabel(r) ? ' · ' + meetLabel(r) : ''}</div>
      </div>
      ${sort === 'pts'
        ? `<div class="text-right flex-shrink-0"><div class="mono font-bold text-[17px] text-cyan-800">${pts}</div><div class="text-[10px] text-faint">pts</div></div>`
        : `<div class="mono font-bold text-[17px] text-cyan-800">${formatTime(t)}</div>`}
      <span class="text-slate-300 text-2xl">›</span>
    </div>`).join('');
  const sortSeg = anyPts ? `<div class="px-5 pb-2"><div class="seg-group">
      <button class="seg ${sort === 'event' ? 'active' : ''}" data-btsort="event">By event</button>
      <button class="seg ${sort === 'pts' ? 'active' : ''}" data-btsort="pts">By AQUA points</button>
    </div></div>` : '';
  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-3 flex items-center gap-3">
      <button class="w-11 h-11 rounded-full bg-cyan-50 border border-cyan-200 flex items-center justify-center text-cyan-700 text-2xl font-semibold leading-none hover:bg-cyan-100 active:scale-95 transition" data-action="back">‹</button><button class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 active:scale-95 transition flex-shrink-0" data-action="home" aria-label="Home" title="Home"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M9.5 20v-5.4h5V20"/></svg></button>
      <div class="flex-1 min-w-0">
        <div class="text-lg font-semibold truncate">Best times</div>
        <div class="text-xs text-muted truncate">${name}</div>
      </div>
      ${csvBtn()}
    </div>
    <div class="px-5 pb-2 flex flex-wrap gap-2">
      ${chips.map(([k, l]) => `<span class="pill ${f.mode === k ? 'active' : ''}" data-btmode="${k}">${k === 'year' && f.mode === 'year' && f.year ? f.year : l}</span>`).join('')}
    </div>
    ${state.btYearOpen ? `<div class="px-5 pb-2 flex flex-wrap gap-2">${years.length ? years.map(y => `<span class="pill ${f.year === +y ? 'active' : ''}" data-btyear="${y}">${y}</span>`).join('') : '<span class="text-xs text-muted">No dated races yet</span>'}</div>` : ''}
    ${sortSeg}
    <div class="scrollable px-3 pb-2 bg-slate-50">
      ${rows || `<div class="bg-white border border-dashed border-slate-200 rounded-2xl p-6 m-2 text-center text-sm text-muted">No races ${f.mode === 'all' ? 'saved yet' : 'in this window'} — best times come from saved races.</div>`}
      ${f.mode !== 'all' && undated ? `<div class="px-3 py-2 text-xs text-muted">${undated} race${undated === 1 ? '' : 's'} without a date only count under “All”.</div>` : ''}
    </div>
  `;
}

// ----- Screen: Trends (per-swimmer race progression) -----
function trendableCount(entries) { return entries.filter(s => s.kind === 'race').length; }

// Minimal dependency-free line chart. races: [{date,total,target}], lower line = faster.
function trendChartSvg(races, targetRef) {
  const W = 300, H = 130, padL = 8, padR = 8, padT = 14, padB = 22;
  const vals = races.map(r => r.total);
  let vmin = Math.min(...vals), vmax = Math.max(...vals);
  if (targetRef != null) { vmin = Math.min(vmin, targetRef); vmax = Math.max(vmax, targetRef); }
  if (vmax - vmin < 0.5) { vmax += 0.5; vmin -= 0.5; }
  const range = vmax - vmin;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = i => padL + (races.length === 1 ? plotW / 2 : (i / (races.length - 1)) * plotW);

// ===== Progress / trends across Race Review, 50 m splits, efficiency =====
const PROG_KINDS = { race: 'Race', fifty: '50 m splits', eff: 'Efficiency' };

// Grouping signature: the "same test" for one swimmer (stroke+distance+pool for races).
function progSig(s) {
  if (s.kind === 'race') return `${s.distance} ${s.stroke} ${s.pool}`;
  if (s.kind === 'fifty') return `50 ${s.stroke} LCM splits`;
  if (s.kind === 'eff') { if (s.predict) return null; if (s.uni && s.si == null && !(s.cps && Object.keys(s.cps).length)) return null; return s.test ? `${s.stroke} SI score · ${s.pace || '100'} pace · ${mmTestLabel[s.test] || s.test}` : `${s.stroke} SI · ${s.pace || '100'} pace`; }
  return null;
}

// Ordered numeric metrics inside one saved entry: [{key,label,value,t,primary}].
function progMetrics(s) {
  const out = [];
  if (s.kind === 'race') {
    const c = buildRaceComparison(s); if (!c) return out;
    const defs = raceRowDefs(s.stroke, s.distance, s.pool);
    out.push({ key: 'total', label: 'Total', value: c.actualTotal, t: 'time', primary: true });
    c.rows.forEach((row, i) => {
      const def = defs[i];
      if (def.kind !== 'total' && row.actual != null) out.push({ key: 'seg:' + def.key, label: row.label, value: row.actual, t: 'time' });
    });
    if (s.sr) {
      defs.forEach((def) => { const v = s.sr[def.key]; if (v > 0) out.push({ key: 'sr:' + def.key, label: (defs.length > 1 ? def.label + ' ' : '') + 'SR', value: +v, t: 'count' }); });

      Object.keys(extra).forEach((k) => { const v = s.sr[k]; if (v > 0) out.push({ key: 'sr:' + k, label: extra[k], value: +v, t: 'count' }); });
    }
  } else if (s.kind === 'fifty') {

    const cpLab = (k) => M[k] || (/^cp\d+$/.test(k) ? k.replace('cp', '') + ' m' : k);
    out.push({ key: 'time', label: '50 time', value: s.seconds, t: 'time', primary: true });
    const b = s.best || {}, srM = s.sr || {}, scM = s.sc || {};
    Object.keys(M).forEach((k) => { if (b[k] > 0) out.push({ key: 'best:' + k, label: M[k], value: b[k], t: 'time' }); });
    Object.keys(b).forEach((k) => { if (/^cp\d+$/.test(k) && b[k] > 0) out.push({ key: 'best:' + k, label: cpLab(k), value: b[k], t: 'time' }); });
    Object.keys(srM).forEach((k) => { if (srM[k] > 0) out.push({ key: 'sr:' + k, label: cpLab(k) + ' SR', value: +srM[k], t: 'count' }); });
    Object.keys(scM).forEach((k) => { if (scM[k] > 0) out.push({ key: 'sc:' + k, label: cpLab(k) + ' SC', value: +scM[k], t: 'count' }); });

      out.push({ key: 'si', label: 'Stroke Index', value: s.si, t: 'si', hb: true });
      if (s.srActual != null) out.push({ key: 'sr', label: 'Stroke rate', value: s.srActual, t: 'count' });
    } else if (s.siCount != null || s.scoreCount != null) {
      const pc = (s.siCount != null && s.eliteSI) ? s.siCount / s.eliteSI * 100 : null;
      if (pc != null) out.push({ key: 'siPctCount', label: '% elite', value: pc, t: 'pct', hb: true, primary: true });
      if (s.siCount != null) out.push({ key: 'siCount', label: 'Stroke Index', value: s.siCount, t: 'si', hb: true });

}

function progFmt(v, t) {
  if (v == null || isNaN(v)) return '—';
  if (t === 'count') return String(Math.round(v));
  if (t === 'pct') return Math.round(v) + '%';
  if (t === 'si') return v.toFixed(2);
  if (t === 'score') return v.toFixed(1);

}
function progFmtRaw(v) { return v >= 60 ? formatTime(v) : v.toFixed(1); }
function progDateLabel(s, i) {
  if (s.date) { const m = String(s.date).match(/\d{4}-(\d{2})-(\d{2})/); return m ? `${m[1]}/${m[2]}` : s.date; }
  return '#' + (i + 1);

// All groups for a swimmer, entries sorted chronologically.
function progGroups(sid) {
  const all = entriesOf(sid).filter((s) => progSig(s));
  const by = {};
  all.forEach((s) => { const k = progSig(s); (by[k] = by[k] || { kind: s.kind, sig: k, entries: [] }).entries.push(s); });
  const arr = Object.values(by);

// --- Sprint-readiness (fatigue) flag for the 50 m tool ----------------------
// v1 (Gael, 2026-07-31): within one ISO week, two 50 m tests >= FATIGUE_PCT apart
// (slower vs the week's fastest) = a fatigue sign; consecutive flagged testing-weeks
// escalate. Blunt on purpose; tune per-swimmer (≈2x CV) later. Operates on the 50 m
// TIME (maximal sprint), the reproducible readiness sentinel — not the sub-splits.
const FATIGUE_PCT = 3;
function isoWeekKey(dateStr) {
  const d = new Date(dateStr + 'T12:00:00'); if (isNaN(d)) return null;
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const yStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((t - yStart) / 86400000) + 1) / 7);
  return t.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');
}
function fiftyFatigue(sid) {
  const es = entriesOf(sid).filter((s) => s.kind === 'fifty' && s.seconds > 0 && s.date);
  if (es.length < 2) return null;
  const byWk = {};
  es.forEach((s) => { const k = isoWeekKey(s.date); if (k) (byWk[k] = byWk[k] || []).push(s); });
  const testable = Object.keys(byWk).sort().filter((k) => byWk[k].length >= 2);
  if (!testable.length) return null;
  const flagged = {};
  testable.forEach((k) => {
    const ts = byWk[k].map((s) => s.seconds);
    const fast = Math.min.apply(null, ts), slow = Math.max.apply(null, ts);
    const pct = (slow - fast) / fast * 100;
    if (pct >= FATIGUE_PCT) flagged[k] = { pct, fast, slow };
  });
  // current streak = consecutive trailing testing-weeks that are all flagged
  let streak = 0;
  for (let i = testable.length - 1; i >= 0; i--) { if (flagged[testable[i]]) streak++; else break; }
  if (streak === 0) return null; // recovered / no current flag
  const latest = testable[testable.length - 1];
  return { streak, latestPct: flagged[latest].pct };
}
function fatigueNote(sid, mode) {
  const f = fiftyFatigue(sid); if (!f) return '';
  const strong = f.streak >= 2;
  if (mode === 'chip') {
    const cls = strong ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800';
    return `<div class="mt-1.5"><span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full ${cls}">${strong ? `\u26a0 fatigue \u00b7 ${f.streak} wks` : 'fatigue sign'}</span></div>`;
  }
  const cls = strong ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-amber-50 border-amber-200 text-amber-800';
  const head = strong ? `Repeated fatigue signal \u2014 ${f.streak} testing weeks in a row` : 'Possible fatigue';
  const body = strong
    ? `Two 50 m tests in a week ran \u2265${FATIGUE_PCT}% apart across ${f.streak} consecutive testing weeks (latest ${f.latestPct.toFixed(1)}%). Persistent \u2014 review this swimmer's load, not just one set.`
    : `Two 50 m tests in a week ran ${f.latestPct.toFixed(1)}% apart (\u2265${FATIGUE_PCT}%). Could mean too tired to sprint \u2014 consider modifying the set, and watch whether it repeats.`;
  return `<div class="rounded-2xl border px-4 py-3 ${cls}"><div class="text-sm font-bold">${strong ? '\u26a0 ' : ''}${head}</div><div class="text-[12px] mt-0.5 leading-snug">${body}</div></div>`;
}

// Dependency-free line chart over [{v,x,lab}]; lower v sits lower (faster/better). Green dot = best.
function progChartSvg(pts, hb, goal) {
  // No y-axis labels, and the end date labels are anchored inward, so the sides need almost
  // no padding — the plot gets the width instead. padB still holds a label under a low point.
  const W = 320, H = 148, padL = 6, padR = 6, padT = 16, padB = 30;
  const N = pts.length;
  const vals = pts.map((p) => p.v);
  let vmin = Math.min(...vals), vmax = Math.max(...vals);
  if (goal != null) { vmin = Math.min(vmin, goal); vmax = Math.max(vmax, goal); }
  if (vmax - vmin < 1e-6) { vmax += 0.5; vmin -= 0.5; }
  const range = vmax - vmin;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const X = (i) => padL + (N === 1 ? plotW / 2 : (i / (N - 1)) * plotW);
  const Y = (v) => padT + ((vmax - v) / range) * plotH;
  const best = hb ? Math.max(...vals) : Math.min(...vals);
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${(p.v === best || i === N - 1) ? 4 : 3}" fill="${p.v === best ? '#059669' : (i === N - 1 ? '#0e7490' : '#0891b2')}"/>`).join('');
  const showVal = (p, i) => N > 8 ? false : (N <= 6 || p.v === best || i === N - 1); // >8 races: too busy, the table below has every number
  const step = (N - 1) / 4;
  const showDate = (i) => N <= 7 || i === 0 || i === N - 1 || [1, 2, 3].some((k) => Math.round(k * step) === i);
  // Keep each value label clear of the line: above local peaks, below local valleys
  // (by comparing the point's screen-Y to its neighbours'); flip near the top/bottom edge.
  // Label sits on the OUTSIDE of the curve: above a local peak, below a local valley.
  // Edge tests use the SVG box (not the plot box) — padT/padB exist precisely to hold these
  // labels, so a point sitting on the plot's top/bottom line still gets its label outside.
  const labY = (i) => {
    const yi = Y(pts[i].v);
    const nb = [i > 0 ? Y(pts[i - 1].v) : null, i < N - 1 ? Y(pts[i + 1].v) : null].filter((v) => v != null);
    const avg = nb.length ? nb.reduce((a, b) => a + b, 0) / nb.length : yi;
    let above = yi <= avg;                        // at/above its neighbours -> peak -> label above
    if (above && yi - 6 < 8) above = false;       // only flip if it would clip off the top
    if (!above && yi + 11 > H - 12) above = true; // only flip if it would hit the date row
    return above ? yi - 6 : yi + 11;
  };
  // Keep the first/last labels inside the box (centred ones would overhang the edges).
  const labAnchor = (i) => (N > 1 && i === N - 1) ? 'end' : ((N > 1 && i === 0) ? 'start' : 'middle');
  const labX = (i) => (N > 1 && i === N - 1) ? (W - 2) : X(i);
  const vlabs = pts.map((p, i) => showVal(p, i) ? `<text x="${labX(i).toFixed(1)}" y="${labY(i).toFixed(1)}" font-size="8" fill="${p.v === best ? '#059669' : '#475569'}" text-anchor="${labAnchor(i)}">${p.lab}</text>` : '').join('');
  const xAnchor = (i) => (N > 1 && i === N - 1) ? 'end' : ((N > 1 && i === 0) ? 'start' : 'middle');
  const xlabs = pts.map((p, i) => showDate(i) ? `<text x="${X(i).toFixed(1)}" y="${H - 7}" font-size="8" fill="#94a3b8" text-anchor="${xAnchor(i)}">${p.x}</text>` : '').join('');
  const gline = goal != null ? `<line x1="${padL}" y1="${Y(goal).toFixed(1)}" x2="${W - padR}" y2="${Y(goal).toFixed(1)}" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/><text x="${W - padR}" y="${(Y(goal) - 2).toFixed(1)}" font-size="8" fill="#d97706" text-anchor="end">${goal}%</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${gline}<polyline points="${line}" fill="none" stroke="#0891b2" stroke-width="2"/>${dots}${vlabs}${xlabs}</svg>`;
}

function renderProgressGroup() {
  const sid = state.savedSid, name = swimmerName(sid);
