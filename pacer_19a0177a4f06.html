// ----- Screen 3: Predicted splits -----
// Build the rows actually displayed: per-50 (per-25 for the 50), or per-100
// checkpoints for distance events when that view is selected.
function buildDisplaySegments(r) {
  const isIM = r.stroke === 'IM';
  const per100 = !isIM && r.distance >= 400 && state.splitView === '100' && r.splits.length % 2 === 0;
  if (per100) {
    const all = [];
    for (let k = 0; k * 2 < r.splits.length; k++) {
      const a = 2 * k, b = 2 * k + 1;
      all.push({ time: r.splits[a] + r.splits[b], lo: r.lo[a] + r.lo[b], hi: r.hi[a] + r.hi[b] });
    }
    const n = all.length;
    // The middle 100s are identical (flat-middle model) — collapse them into one row.
    if (n >= 3) {
      const mid = all[1];
      // Distance events are paced near-even — all rows neutral (faster/slower), no front/back-end.
      return [
        { ...all[0], label: 'First 100', count: 1, half: 'middle' },
        { time: mid.time, lo: mid.lo, hi: mid.hi, label: `Middle 100s · 2–${n - 1}`, count: n - 2, half: 'middle' },
        { ...all[n - 1], label: 'Last 100', count: 1, half: 'middle' },
      ];
    }
    return all.map((row, k) => ({ ...row, label: `${(k + 1) * 100} m`, count: 1, half: 'middle' }));
  }
  // Per-50 view for distance free: First 50, one combined Middle 50s row, Last 50.
  if (!isIM && r.distance >= 400 && state.splitView === '50' && r.splits.length >= 3) {
    const n = r.splits.length;
    let midSum = 0;
    for (let i = 1; i < n - 1; i++) midSum += r.splits[i];
    const midCount = n - 2;
    // Distance events are paced near-even — all rows neutral (faster/slower), no front/back-end.
    return [
      { time: r.splits[0], lo: r.lo[0], hi: r.hi[0], label: 'First 50', count: 1, half: 'middle' },
      { time: midSum / midCount, lo: r.lo[1], hi: r.hi[1], label: `Middle 50s · 2–${n - 1}`, count: midCount, half: 'middle' },
      { time: r.splits[n - 1], lo: r.lo[n - 1], hi: r.hi[n - 1], label: 'Last 50', count: 1, half: 'middle' },
    ];
  }
  const imL = isIM ? imLabels[r.distance] : null;
  const nSeg = r.splits.length;
  return r.splits.map((t, i) => ({
    time: t, lo: r.lo[i], hi: r.hi[i],
    label: imL ? imL[i] : `${(i + 1) * r.segLen} m`,
    // Front/back-end only on the true opening & closing splits (a pacing choice); the rest neutral.
    // IM uses stroke-strength labels instead, so leave null.
    half: isIM ? null : (i === 0 ? 'front' : (i === nSeg - 1 ? 'back' : 'middle')),
  }));
}

// A centered range bar (q25 left, median tick centre, q75 right).
function rangeBar(lo, hi, mid) {
  const w = Math.min(100, ((hi - lo) / mid) * 100);
  const pad = (100 - w) / 2;
  return `<div class="range-track"><div class="range-fill" style="left: ${pad.toFixed(1)}%; right: ${pad.toFixed(1)}%;"></div><div class="range-tick" style="left: 50%;"></div></div>`;
}

// 400 IM: grouped by stroke — each stroke's 100 (headline, dedicated IQR) with its two 50s below.
function renderIM400Splits(r) {
  const strokes = ['Fly', 'Back', 'Breast', 'Free'];
  const per50im = srPer50.IM && srPer50.IM[400] && srPer50.IM[400][r.sex]; // per-50 SR for the 8 legs
  const cap = 'text-[9px] uppercase tracking-wide text-faint';
  let cumMed = 0, cumFast = 0, cumSlow = 0; // cumulative at each 100 mark
  return strokes.map((stk, j) => {
    const a = 2 * j, b = 2 * j + 1;
    const h = r.splits[a] + r.splits[b];                              // 100 median = sum of its 50s
    const hlo = r.hundoLo ? r.hundoLo[j] : (r.lo[a] + r.lo[b]);       // dedicated 100 IQR
    const hhi = r.hundoHi ? r.hundoHi[j] : (r.hi[a] + r.hi[b]);
    const lg = stk.toLowerCase();
    // Cumulative to this 100 mark (median bracketed + fast/slow range). Skip the first 100 (fly),
    // where cumulative just repeats the split; the last (free) lands on the target.
    cumMed += h; cumFast += hlo; cumSlow += hhi;
    const cumBlock = j > 0
      ? `<div class="text-center mt-1.5 leading-tight">
           <div class="text-[10px] text-faint mono">(${formatTime(cumMed)})</div>
           <div class="text-[11px] text-slate-600 mono font-semibold">${formatTime(cumFast)} – ${formatTime(cumSlow)}</div>
         </div>`
      : '';
    const sub = [a, b].map((idx, si) => `
      <div class="px-4 py-2.5 flex items-center gap-3">
        <div class="flex-shrink-0" style="width:46px;">
          <span class="label-cap text-faint">${si === 0 ? '1st 50' : '2nd 50'}</span>
          ${per50im && per50im[idx] ? `<div class="text-[9px] text-faint">SR ${Math.round(per50im[idx].avg)} (${Math.round(per50im[idx].lo)}–${Math.round(per50im[idx].hi)})</div>` : ''}
        </div>
        <div class="flex-1">
          ${rangeBar(r.lo[idx], r.hi[idx], r.splits[idx])}
          <div class="flex justify-between text-[10px] text-faint mt-1 mono"><span>${formatTime(r.lo[idx])}</span><span>${formatTime(r.hi[idx])}</span></div>
        </div>
        <span class="hero-time text-lg text-right flex-shrink-0" style="width:62px;">${formatTime(r.splits[idx])}</span>
      </div>`).join('');
    return `
      <div class="${j < 3 ? 'border-b border-slate-100' : ''}">
        <div class="px-4 pt-3.5 pb-2.5">
          <div class="text-center mb-1.5">
            <span class="label-cap text-cyan-700">${stk} · 100</span>
            <div class="hero-time text-2xl leading-tight">${formatTime(h)}</div>
          </div>
          ${rangeBar(hlo, hhi, h)}
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">
            <span><span class="mono">${formatTime(hlo)}</span> <span class="${cap}">faster</span></span>
            <span><span class="${cap}">slower</span> <span class="mono">${formatTime(hhi)}</span></span>
          </div>
          ${cumBlock}
        </div>
        <div class="bg-slate-50/70">${sub}</div>
      </div>`;
  }).join('');
}

// Elite stroke-rate card for the Predicted splits screen (mean + min–max of finalists).
// Whole-event average; no IM data. The 50 also shows the 1st/2nd-25 rates.
function srCardHtml(r) {
  // Suppressed when per-50 SR is available (that's shown on each split row instead).
  if (srPer50[r.stroke] && srPer50[r.stroke][r.distance] && srPer50[r.stroke][r.distance][r.sex]) return '';
  const rec = srRef[r.stroke] && srRef[r.stroke][r.distance] && srRef[r.stroke][r.distance][r.sex];
  if (!rec) return '';
  const fifty = (r.distance === 50 && fiftyRatios[r.stroke]) ? fiftyRatios[r.stroke][r.sex] : null;
  const fiftyLine = fifty
    ? `<div class="text-[11px] text-muted mt-2 text-center">1st 25 <span class="mono font-semibold text-slate-700">${Math.round(fifty.sr1)}</span> · 2nd 25 <span class="mono font-semibold text-slate-700">${Math.round(fifty.sr2)}</span> cyc/min</div>`
    : '';
  return `
    <div class="bg-white rounded-2xl border border-slate-200 px-4 py-4">
      <div class="label-cap mb-2 text-muted">Elite stroke rate</div>
      <div class="text-center">
        <div class="hero-time text-3xl leading-tight">${Math.round(rec.avg)}<span class="text-sm text-muted font-normal"> cyc/min</span></div>
        <div class="text-[11px] text-muted mt-1">range <span class="mono">${Math.round(rec.min)}–${Math.round(rec.max)}</span></div>
      </div>
      ${fiftyLine}
    </div>`;
}

function renderPredictedSplits() {
  const r = state.result;
  if (!r || !r.splits || !r.splits.length) {
    const avail = availableEventsFor(state.form.stroke);
    return `
      <div class="statusbar"></div>
      <div class="px-5 pt-3 pb-3 flex items-center gap-3 bg-white">
        <button class="w-11 h-11 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 text-2xl leading-none hover:bg-slate-200 transition" data-action="back">‹</button>
        <div class="text-lg font-semibold">Pace plan</div>
      </div>
      <div class="p-8 text-center">
        <div class="text-slate-700 font-semibold text-sm mb-1">No data for this combination</div>
        <div class="text-slate-500 text-sm leading-relaxed">There's no ${state.form.distance} ${state.form.stroke} ${state.form.pool} in the dataset.</div>
        ${avail ? `<div class="text-xs text-muted mt-3 leading-relaxed">Available for <span class="font-semibold">${state.form.stroke}</span>: ${avail}</div>` : ''}
        <button class="mt-5 px-4 py-3 bg-cyan-600 text-white rounded-xl text-sm font-bold hover:bg-cyan-700 transition" data-action="back">Adjust event</button>
      </div>`;
  }

  const isIM = r.stroke === 'IM';
  const rows = buildDisplaySegments(r);
  const per50 = srPer50[r.stroke] && srPer50[r.stroke][r.distance] && srPer50[r.stroke][r.distance][r.sex]; // per-50 SR (100/200/IM)
  const isDistanceCollapsed = r.distance >= 400 && !isIM; // shown as First / Middle / Last
  let cumRun = 0, fastCum = 0, slowCum = 0;
  const splitRows = rows.map((row, i) => {
    const rangeWidth = Math.min(100, ((row.hi - row.lo) / row.time) * 100);
    const padding = (100 - rangeWidth) / 2;
    // Running cumulatives (× count makes the collapsed distance middle contribute correctly, so
    // the Last row lands on the full event time). Median → cumRun; fast/slow envelope = the sum
    // of each split's q25 (quick end) and q75 (slow end) so far.
    cumRun  += row.time * (row.count || 1);
    fastCum += row.lo   * (row.count || 1);
    slowCum += row.hi   * (row.count || 1);
    const isFirstRow = i === 0, isLastRow = i === rows.length - 1;
    // Distance: cumulative on First + Last only (middle is collapsed). Others: every row but the
    // first (where cumulative would just repeat the split).
    const showCum = isDistanceCollapsed ? (isFirstRow || isLastRow) : !isFirstRow;
    const cumBlock = showCum
      ? `<div class="text-center mt-1.5 leading-tight">
           <div class="text-[10px] text-faint mono">(${formatTime(cumRun)})</div>
           <div class="text-[11px] text-slate-600 mono font-semibold">${formatTime(fastCum)} – ${formatTime(slowCum)}</div>
         </div>`
      : '';
    // The faster time (q25) always sits on the left, slower (q75) on the right.
    // Only the *labels* change, and front/back-end is reserved for true opening/closing splits:
    //  • Opening split → faster = front-end (a front-loaded swimmer goes out fast).
    //  • Closing split → faster = back-end  (a back-loaded swimmer comes home fast) — reversed.
    //  • Everything else (200 middle 50s, all of distance) → neutral faster / slower.
    //  • IM legs       → "faster" / "slower".
    let leftCap = 'front-end', rightCap = 'back-end';
    if (isIM) {
      leftCap = 'faster'; rightCap = 'slower';
    } else if (row.half === 'middle') {
      leftCap = 'faster'; rightCap = 'slower';
    } else if (row.half === 'back') {
      leftCap = 'back-end'; rightCap = 'front-end';
    }
    const cap = 'text-[9px] uppercase tracking-wide text-faint';
    const ends = `<span><span class="mono">${formatTime(row.lo)}</span> <span class="${cap}">${leftCap}</span></span>
         <span><span class="${cap}">${rightCap}</span> <span class="mono">${formatTime(row.hi)}</span></span>`;
    return `
      <div class="px-4 py-3.5 ${i < rows.length - 1 ? 'border-b border-slate-100' : ''}">
        <div class="text-center mb-1.5">
          <span class="label-cap text-faint">${row.label}</span>
          <div class="hero-time text-2xl leading-tight">${formatTime(row.time)}</div>
          ${per50 && per50[i] ? `<div class="text-[10px] text-faint">SR ~${Math.round(per50[i].avg)} (${Math.round(per50[i].lo)}–${Math.round(per50[i].hi)}) cyc/min</div>` : ''}
        </div>
        <div class="relative">
          <div class="range-track">
            <div class="range-fill" style="left: ${padding.toFixed(1)}%; right: ${padding.toFixed(1)}%;"></div>
            <div class="range-tick" style="left: 50%;"></div>
          </div>
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">${ends}</div>
        </div>
        ${cumBlock}
      </div>
    `;
  }).join('');

  // 50 / 100 checkpoint toggle (distance events only)
  const viewToggle = (r.distance >= 400 && !isIM) ? `
    <div class="seg-group" style="max-width: 180px;">
      <div class="seg ${state.splitView === '50' ? 'active' : ''}" data-action="splitview" data-mode="50">Per 50</div>
      <div class="seg ${state.splitView === '100' ? 'active' : ''}" data-action="splitview" data-mode="100">Per 100</div>
    </div>` : '';

  // Top-end speed limiter check
  let limiterCallout = '';
  if (r.pb50 && state.swimmer && state.swimmer.pb50 && state.swimmer.pb50[r.stroke]) {
    const knownPB = state.swimmer.pb50[r.stroke];
    if (knownPB > r.pb50 + 0.3) {
      limiterCallout = `
        <div class="bg-amber-50 border border-amber-100 rounded-xl px-4 py-3.5 flex gap-3">
          <span class="text-amber-600 text-lg leading-none mt-0.5">⚠</span>
          <div class="flex-1">
            <div class="font-semibold text-amber-900 text-sm">Top-end speed is the limiter</div>
            <div class="text-xs text-amber-800 mt-1 leading-relaxed">For ${formatTime(r.targetSeconds)} you'd need a ${r.pb50.toFixed(1)}s 50. Your 50 PB is ${knownPB.toFixed(2)}s — work on top-end speed before this target is realistic.</div>
          </div>
        </div>
      `;
    }
  }

  let pb50Card = '';
  if (r.pb50) {
    const knownPB = state.swimmer?.pb50?.[r.stroke];
    const gap = knownPB ? knownPB - r.pb50 : null;
    const ok = knownPB && gap <= 0.3;
    const tone = !knownPB ? 'slate' : (ok ? 'emerald' : 'amber');
    const toneClasses = {
      amber:   { wrap: 'bg-amber-50 border-amber-200',   label: 'text-amber-700',   num: 'text-amber-900' },
      emerald: { wrap: 'bg-emerald-50 border-emerald-200', label: 'text-emerald-700', num: 'text-emerald-900' },
      slate:   { wrap: 'bg-slate-50 border-slate-200',   label: 'text-muted',       num: 'text-slate-900' },
    };
    const t = toneClasses[tone];
    const band = (r.pb50Lo != null && r.pb50Hi != null);
    const pbW = band ? Math.min(100, ((r.pb50Hi - r.pb50Lo) / r.pb50) * 100) : 0;
    const pbPad = (100 - pbW) / 2;
    pb50Card = `
      <div class="bg-white rounded-2xl border border-slate-200 px-4 py-4">
        <div class="label-cap mb-2 text-muted">50 m best time needed</div>
        <div class="text-center mb-1.5">
          <div class="hero-time text-3xl leading-tight">${r.pb50.toFixed(2)}</div>
        </div>
        ${band ? `
        <div class="relative">
          <div class="range-track">
            <div class="range-fill" style="left: ${pbPad.toFixed(1)}%; right: ${pbPad.toFixed(1)}%;"></div>
            <div class="range-tick" style="left: 50%;"></div>
          </div>
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">
            <span><span class="mono">${r.pb50Lo.toFixed(2)}</span> <span class="text-[9px] uppercase tracking-wide text-faint">front-end</span></span>
            <span><span class="text-[9px] uppercase tracking-wide text-faint">back-end</span> <span class="mono">${r.pb50Hi.toFixed(2)}</span></span>
          </div>
        </div>` : ''}
        ${knownPB ? `
          <div class="${t.wrap} border rounded-xl px-3.5 py-2.5 mt-3 flex items-center justify-between">
            <div class="text-[10px] font-bold uppercase tracking-wide ${t.label}">${state.swimmer.name.split(' ')[0]}'s 50 PB</div>
            <div class="flex items-baseline gap-2">
              <div class="hero-time text-lg ${t.num}">${knownPB.toFixed(2)}</div>
              <div class="text-[10px] ${t.label}">${gap > 0 ? `+${gap.toFixed(2)} off` : 'on pace'}</div>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }

  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-2 flex items-center gap-3 bg-white">
      <button class="w-11 h-11 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 text-2xl leading-none hover:bg-slate-200 transition" data-action="back">‹</button>
      <div class="flex-1 min-w-0">
        <div class="text-base font-semibold">${state.swimmer ? state.swimmer.name : (state.form.name || 'Pace plan')}</div>

              <button class="w-10 h-11 rounded-r-xl bg-white border border-l-0 border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="1" title="Slower by 1.0s" aria-label="Slower by 1 second">+1</button>
            </div>
            <div class="flex">
              <button class="w-10 h-11 rounded-l-xl bg-white border border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="-0.1" title="Faster by 0.1s" aria-label="Faster by 0.1 seconds">−.1</button>

          ${state.swimmer && state.swimmer.bestEvent.stroke === r.stroke && state.swimmer.bestEvent.distance === r.distance ? `
            <button class="px-2.5 py-1.5 rounded-full bg-white border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50 transition" data-action="target-preset" data-mode="pb">PB</button>
          ` : ''}

        <button class="w-full bg-cyan-600 text-white rounded-xl py-4 text-sm font-semibold hover:bg-cyan-700 transition" data-action="set-as-target">Set as ${state.swimmer.name.split(' ')[0]}'s race target</button>

// What events the dataset covers for a given stroke (for the no-data screen).
function availableEventsFor(stroke) {
  const out = [];
  const byStroke = ratios[stroke];
  if (!byStroke) return '';
  const combos = new Set();
  for (const sex of Object.keys(byStroke))
    for (const pool of Object.keys(byStroke[sex]))
      for (const d of Object.keys(byStroke[sex][pool])) combos.add(`${d}m ${pool}`);
  return Array.from(combos).sort((a, b) => parseInt(a) - parseInt(b)).join(', ');
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

    emerald: { wrap: 'bg-emerald-50 border-emerald-200', title: 'text-emerald-900', body: 'text-emerald-800', icon: 'text-emerald-600', action: 'text-emerald-900 bg-emerald-100' },

// Row structure for an event's comparison (predicted vs actual).
function raceRowDefs(stroke, distance) {
  if (stroke === 'IM') {
    const labels = distance === 400 ? ['Fly 100', 'Back 100', 'Breast 100', 'Free 100']
                 : distance === 100 ? ['Fly 25', 'Back 25', 'Breast 25', 'Free 25']
                 : ['Fly', 'Back', 'Breast', 'Free'];
    return labels.map((l, i) => ({ key: 'r' + i, label: l, kind: distance === 400 ? 'hundo' : 'seg', idx: i }));
  }
  if (distance >= 400) {
    return [
      { key: 'first', label: 'First 50', kind: 'seg', idx: 0 },
      { key: 'mid', label: 'Middle 50 (avg)', kind: 'mid' },
      { key: 'last', label: 'Last 50', kind: 'seg', idxFromEnd: 0 },
    ];
  }
  if (distance === 50) return [{ key: 'total', label: 'Time', kind: 'total' }];
  const n = distance / 50;
  return Array.from({ length: n }, (_, i) => ({ key: 'r' + i, label: `${(i + 1) * 50} m`, kind: 'seg', idx: i }));
}

// Fields the coach actually types (400+ free: first/last/total; middle is derived).
function raceEntryFields(stroke, distance) {
  if (stroke !== 'IM' && distance >= 400) {
    return [{ key: 'first', label: 'First 50' }, { key: 'last', label: 'Last 50' }, { key: 'total', label: 'Total time' }];
  }
  return raceRowDefs(stroke, distance).map(r => ({ key: r.key, label: r.label }));
}

// Pre-fill the actual-split boxes with the predicted splits for the target (coach edits to real).
function seedRaceTimes() {
  const f = state.form;
  const tgt = state.raceForm.times.target ?? f.targetSeconds ?? 120;
  const p = predict(f.stroke, f.sex, f.pool, f.distance, tgt);
  const times = { target: tgt };
  if (p) {
    if (f.stroke !== 'IM' && f.distance >= 400) {
      times.first = p.splits[0];
      times.last = p.splits[p.splits.length - 1];
      times.total = tgt;
    } else {
      raceRowDefs(f.stroke, f.distance).forEach(def => {
        if (def.kind === 'hundo') { const j = def.idx; times[def.key] = p.splits[2 * j] + p.splits[2 * j + 1]; }
        else if (def.kind === 'seg') { const i = def.idxFromEnd != null ? p.splits.length - 1 - def.idxFromEnd : def.idx; times[def.key] = p.splits[i]; }
        else if (def.kind === 'total') { times.total = tgt; }
      });
    }
  }
  state.raceForm.times = times;
}

function buildRaceComparison(race) {
  const t = race.times || {};
  const distFree = race.stroke !== 'IM' && race.distance >= 400;
  const defs = raceRowDefs(race.stroke, race.distance);
  // Actual total first — the shape bands are scaled to what they ACTUALLY swam,
  // so hitting/beating the goal doesn't get mislabelled "too fast".
  let actualTotal;
  if (distFree || race.distance === 50) actualTotal = t.total;
  else actualTotal = defs.reduce((s, def) => s + (def.kind === 'mid' ? 0 : (t[def.key] || 0)), 0);
  const p = predict(race.stroke, race.sex, race.pool, race.distance, actualTotal);
  if (!p) return null;
  const nmid = p.splits.length - 2;
  const rows = defs.map(def => {
    let pred, lo = null, hi = null;
    if (def.kind === 'total') { pred = actualTotal; }
    else if (def.kind === 'mid') { pred = p.splits[1]; lo = p.lo[1]; hi = p.hi[1]; }
    else if (def.kind === 'hundo') {
      const j = def.idx; pred = p.splits[2 * j] + p.splits[2 * j + 1];
      lo = p.hundoLo ? p.hundoLo[j] : p.lo[2 * j] + p.lo[2 * j + 1];
      hi = p.hundoHi ? p.hundoHi[j] : p.hi[2 * j] + p.hi[2 * j + 1];
    } else {
      const i = def.idxFromEnd != null ? p.splits.length - 1 - def.idxFromEnd : def.idx;
      pred = p.splits[i]; lo = p.lo[i]; hi = p.hi[i];
    }
    let actual;
    if (def.kind === 'mid') actual = (t.total - t.first - t.last) / nmid;
    else actual = t[def.key];
    const cls = (lo != null && hi != null && actual != null) ? classifySplit(actual, lo, hi) : 'in-range';
    return { label: def.label, pred, lo, hi, actual, cls, delta: actual != null ? actual - pred : 0 };
  });
  const delta = actualTotal - race.targetSeconds;
  const hit = actualTotal <= race.targetSeconds + 0.05; // hit or beat the goal
  return { p, rows, actualTotal, target: race.targetSeconds, delta, hit,
           insights: raceInsights(rows, actualTotal, race.targetSeconds, hit) };
}

// Outcome-aware verdict: if they hit/beat the goal we celebrate first and coach the
// shape as an OPPORTUNITY; if they missed, we use the cautionary "it cost you" framing.
function raceInsights(rows, actualTotal, target, hit) {
  const out = [];
  const first = rows[0], last = rows[rows.length - 1];
  const firstFast = first && first.cls === 'too-fast';
  const firstSlow = first && first.cls === 'too-slow';
  const lastSlow = last && last.cls === 'too-slow';
  const lastFast = last && last.cls === 'too-fast';
  const anyLaterSlow = rows.slice(1).some(r => r.cls === 'too-slow');
  const anyLaterFast = rows.slice(1).some(r => r.cls === 'too-fast');
  const allIn = rows.length > 1 && rows.every(r => r.cls === 'in-range');
  const overBy = actualTotal - target;

  if (hit) {
    out.push({ tone: 'emerald', icon: '🎉', title: 'Nicely done hitting your target time!',
      body: overBy < -0.05 ? `Came in ${Math.abs(overBy).toFixed(2)}s under the goal — strong swim.` : `Right on the goal — strong swim.` });
    if (allIn) {
      out.push({ tone: 'emerald', icon: '✓', title: 'Textbook distribution',
        body: `Every split sat inside the elite range for that time — pacing was spot on. Bank this pattern.` });
    } else if (firstFast && (anyLaterSlow || lastSlow)) {
      const over = Math.abs(first.pred - first.actual);
      out.push({ tone: 'cyan', icon: '↗', title: 'Aggressive front half — and it worked',
        body: `Opened ~${over.toFixed(2)}s under the elite range and gave a little back late, but still made the time. There may be more there with a slightly more controlled opening.`,
        finals: `Next time: open ~${Math.max(0.2, over).toFixed(1)}s easier and hold the back half — you could go quicker.` });
    } else if (firstSlow && (anyLaterFast || lastFast)) {
      const under = Math.abs(first.actual - first.pred);
      out.push({ tone: 'cyan', icon: '↘', title: 'Saved it for the back — go out faster',
        body: `Opened ~${under.toFixed(2)}s over the elite range, then closed fast (under the range) and still made the time. You left speed on the table at the front.`,
        finals: `Next time: go out ~${Math.max(0.2, under).toFixed(1)}s quicker — you've shown the back-half speed to back it up, so a faster swim is right there.` });
    } else {
      out.push({ tone: 'cyan', icon: '•', title: 'Got the job done',
        body: `A few splits drifted outside the elite range but it didn't cost the result — smoothing those could find a touch more next time.` });
    }
  } else {
    if (firstFast && anyLaterSlow) {
      const over = Math.abs(first.pred - first.actual);
      out.push({ tone: 'amber', icon: '⚡', title: 'Went out too hard',
        body: `Opened ~${over.toFixed(2)}s under the elite range, then faded — and finished +${overBy.toFixed(2)}s over goal. The fast start cost the back half.`,
        finals: `Tonight: open about ${Math.max(0.2, over).toFixed(1)}s easier and protect the close.` });
    } else if (firstSlow && (anyLaterFast || lastFast)) {
      const under = Math.abs(first.actual - first.pred);
      out.push({ tone: 'amber', icon: '↘', title: 'Went out too easy',
        body: `Opened ~${under.toFixed(2)}s over the elite range and closed fast — that conservative start left +${overBy.toFixed(2)}s on the table. The back-half speed says the time is there.`,
        finals: `Tonight: go out ~${Math.max(0.2, under).toFixed(1)}s quicker — you've got the close to support it.` });
    } else if (lastSlow) {
      const fade = last.actual - last.pred;
      out.push({ tone: 'rose', icon: '🔻', title: 'Faded at the end',
        body: `The closing split ran +${fade.toFixed(2)}s over the elite range; finished +${overBy.toFixed(2)}s over goal — the time leaked late.`,
        finals: `Tonight: control the middle so the final split holds in range.` });
    } else if (allIn) {
      out.push({ tone: 'slate', icon: '•', title: 'Even race, just short of the time',
        body: `Distribution matched the elite shape — the +${overBy.toFixed(2)}s gap is speed/fitness, not pacing.` });
    } else {
      out.push({ tone: 'slate', icon: '•', title: `Missed goal by +${overBy.toFixed(2)}s`,
        body: `Mixed splits without one clear story — scan the chart to see where the time went.` });
    }
  }
  return out;
}

// 3-box time entry (min : sec . hundredths) bound by key into state.raceForm.times.
function timeBoxes(key, seconds) {
  const t = Math.max(0, seconds || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), h = Math.round((t - Math.floor(t)) * 100);
  return `<div class="flex items-center gap-1" data-tkey="${key}">
      <input class="tb tb-min" inputmode="numeric" maxlength="2" value="${m}" aria-label="minutes" />
      <span class="tb-sep">:</span>
      <input class="tb tb-sec" inputmode="numeric" maxlength="2" value="${String(s).padStart(2, '0')}" aria-label="seconds" />
      <span class="tb-sep">.</span>
      <input class="tb tb-hh" inputmode="numeric" maxlength="2" value="${String(h).padStart(2, '0')}" aria-label="hundredths" />
    </div>`;
}

// ----- Screen: Race analysis -----
function renderRaceAnalysis() {
  const race = state.race;
  if (!race) return renderRoster();
  const c = buildRaceComparison(race);
  if (!c) return `<div class="statusbar"></div><div class="p-8 text-center text-slate-500 text-sm">No pacing data for this event.</div>`;
  const beat = c.delta <= 0.05;
  const deltaColor = beat ? 'text-emerald-700' : 'text-rose-600';
  const deltaBg = beat ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100';
  const sr = race.sr || {};
  const defs = raceRowDefs(race.stroke, race.distance);
  const pt = predict(race.stroke, race.sex, race.pool, race.distance, race.targetSeconds);
  const predAt = defs.map(def => {
    if (!pt) return null;
    if (def.kind === 'total') return race.targetSeconds;
    if (def.kind === 'mid') return pt.splits[1];
    if (def.kind === 'hundo') return pt.splits[2 * def.idx] + pt.splits[2 * def.idx + 1];
    const i = def.idxFromEnd != null ? pt.splits.length - 1 - def.idxFromEnd : def.idx;
    return pt.splits[i];
  });
  const GT = 'display:grid;grid-template-columns:1fr 3.3rem 3.3rem 2.9rem 2.3rem;gap:5px;align-items:center;';
  const head = `<div style="${GT}" class="px-3 pt-3 pb-1"><span class="label-cap text-muted">Split</span><span class="label-cap text-muted" style="text-align:right;">Pred</span><span class="label-cap text-muted" style="text-align:right;">Swam</span><span class="label-cap text-muted" style="text-align:right;">Δ</span><span class="label-cap text-muted" style="text-align:center;">SR</span></div>`;
  const splitRows = c.rows.map((r, i) => {
    const def = defs[i], pred = predAt[i];
    const d = (r.actual != null && pred != null) ? r.actual - pred : null;
    const dc = d == null ? 'text-slate-400' : (d > 0.05 ? 'text-rose-600' : (d < -0.05 ? 'text-emerald-700' : 'text-slate-500'));
    return `<div style="${GT}" class="px-3 py-2 border-b border-slate-100 last:border-0">
      <div class="text-sm font-semibold text-slate-700 leading-tight">${r.label}</div>
      <div class="mono text-xs text-slate-500" style="text-align:right;">${pred != null ? formatTime(pred) : '—'}</div>
      <div class="mono text-sm font-semibold text-slate-800" style="text-align:right;">${r.actual != null ? formatTime(r.actual) : '—'}</div>
      <div class="mono text-xs font-semibold ${dc}" style="text-align:right;">${d != null ? (d >= 0 ? '+' : '') + d.toFixed(2) : ''}</div>
      <div class="mono text-xs text-slate-600" style="text-align:center;">${sr[def.key] != null && sr[def.key] !== '' ? sr[def.key] : '—'}</div>
    </div>`;
  }).join('');
  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-3 flex items-center gap-3 bg-white">
      <button class="w-11 h-11 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 text-2xl leading-none hover:bg-slate-200 transition" data-action="back">‹</button>
      <div class="flex-1 min-w-0">
        <div class="text-base font-semibold truncate">${race.name || 'Race'}</div>
        <div class="text-xs text-muted truncate">${race.distance} ${race.stroke} ${race.pool}${race.competition ? ' · ' + race.competition : ''}${race.date ? ' · ' + race.date : ''}</div>
      </div>
      <button class="px-3.5 py-2 rounded-full bg-cyan-50 text-cyan-800 text-xs font-semibold hover:bg-cyan-100 transition" data-action="save-race">Save</button>
    </div>
    <div class="px-5 py-3 bg-white border-b border-slate-100">
      <div class="${deltaBg} border rounded-2xl p-4">
        <div class="grid grid-cols-3 gap-2">
          <div><div class="label-cap text-muted">Predicted</div><div class="hero-time text-xl mt-1">${formatTime(c.target)}</div></div>
          <div class="text-center border-l border-r border-slate-200/60"><div class="label-cap text-muted">Swam</div><div class="hero-time text-xl mt-1">${formatTime(c.actualTotal)}</div></div>
          <div class="text-right"><div class="label-cap ${deltaColor}">Delta</div><div class="hero-time text-xl mt-1 ${deltaColor}">${c.delta >= 0 ? '+' : ''}${c.delta.toFixed(2)}</div></div>
        </div>

    <div class="scrollable px-5 py-3 space-y-3 bg-slate-50">
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">${head}${splitRows}</div>
      ${race.notes ? `<div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="label-cap text-muted mb-1">Notes</div><div class="text-sm text-slate-700 leading-relaxed" style="white-space:pre-wrap;">${(race.notes || '').replace(/</g, '&lt;')}</div></div>` : ''}
    </div>
  `;
}

// ----- Screen 5: Squad targets -----
function renderSquadTargets() {
  // Build per-swimmer 200 fly targets from their best events; fall back to a default for swimmers
  // whose best isn't a 200, since the demo focuses on the squad-targets-for-event use case.
  const event = { stroke: 'Fly', distance: 200, pool: 'LCM' };
  const entries = swimmers.map(s => {
    // Synthetic target: scale their best to a 200 fly using a simple ratio fudge
    let target;
    if (s.bestEvent.stroke === 'Fly' && s.bestEvent.distance === 100) {
      target = s.bestEvent.time * 2.26; // approx 100→200 fly scaling
    } else if (s.bestEvent.stroke === 'Fly' && s.bestEvent.distance === 200) {
      target = s.bestEvent.time;
    } else if (s.bestEvent.distance === 200) {
      target = s.bestEvent.time * 1.07;
    } else {
      target = s.bestEvent.time * 0.55;
    }
    const r = predict(event.stroke, s.sex, event.pool, event.distance, target);
    return { swimmer: s, target, splits: r?.splits || [0,0,0,0] };
  }).sort((a, b) => a.target - b.target);

  const cards = entries.map(e => `
    <div class="bg-white rounded-2xl border border-slate-200 px-3.5 py-3.5 clickable" data-swimmer="${e.swimmer.id}">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-full bg-cyan-50 text-cyan-800 font-bold flex items-center justify-center text-xs">${e.swimmer.initials}</div>
          <span class="font-semibold text-[15px]">${e.swimmer.name}</span>
        </div>
        <div class="text-right">
          <div class="label-cap text-muted">Target</div>
          <div class="hero-time text-base mt-0.5">${formatTime(e.target)}</div>
        </div>
      </div>
      <div class="grid grid-cols-4 gap-1.5 text-center">
        ${e.splits.map((s, i) => `
          <div class="bg-slate-50 rounded-lg py-2">
            <div class="text-[9px] text-muted uppercase tracking-wide font-semibold">${i === 0 ? '1st 50' : i === e.splits.length - 1 ? 'Last' : (i + 1) + ordinal(i+1).slice(-2)}</div>
            <div class="mono text-sm font-bold mt-0.5">${s.toFixed(1)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-3 bg-white">
      <div class="flex items-center gap-3 mb-2">
        <button class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-700 text-xl leading-none" data-action="back">‹</button>
        <div class="flex-1 min-w-0">
          <div class="text-lg font-semibold">Squad targets</div>
          <div class="text-xs text-slate-500">Pace plan for every swimmer</div>
        </div>
        <button class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-500" title="Export">⎙</button>
      </div>
      <div class="flex gap-2 overflow-x-auto pt-2 -mx-5 px-5 pb-1">
        <span class="pill active">200 Fly</span>
        <span class="pill">LCM</span>
        <span class="pill">Stretch +1%</span>
      </div>
    </div>
    <div class="scrollable bg-slate-50">
      <div class="px-5 py-3"><div class="label-cap">${entries.length} swimmers · sorted by target time</div></div>
      <div class="space-y-2 px-3 pb-4">${cards}</div>
    </div>
  `;
}

// ============================================================
// EVENTS
// ============================================================

document.addEventListener('click', (e) => {
  const phone = document.getElementById('phone');
  // Click handler for phone-internal nav
  if (phone.contains(e.target)) {
    // Delete buttons are checked first so they win over the row's navigation handler.
    const delEv = e.target.closest('[data-del-event]');
    if (delEv) { deleteEvent(delEv.getAttribute('data-del-event')); return; }
    const delSw = e.target.closest('[data-del-swimmer]');
    if (delSw) { deleteSwimmer(delSw.getAttribute('data-del-swimmer')); return; }
    const swim = e.target.closest('[data-swimmer]');
    if (swim) {
      const id = swim.getAttribute('data-swimmer');
      const s = swimmers.find(x => x.id === id);
      navigate('swimmer-detail', { swimmer: s });
      return;
    }
    const svn = e.target.closest('[data-savedsid]');
    if (svn) {
      state.savedSid = svn.getAttribute('data-savedsid');
      navigate('saved-swimmer');
      return;
    }
    const pg = e.target.closest('[data-proggroup]');
    if (pg) { state.progGroup = decodeURIComponent(pg.getAttribute('data-proggroup')); state.progMetric = null; navigate('progress-group'); return; }
    const pm = e.target.closest('[data-progmetric]');
    if (pm) { state.progMetric = pm.getAttribute('data-progmetric'); render(); return; }
    const sv = e.target.closest('[data-saved]');
    if (sv) {
      const entry = state.saved.find(x => x.id === sv.getAttribute('data-saved'));
      if (entry) {
        if (entry.kind === 'race') {
          state.race = entry;
          navigate('race-analysis');
        } else if (entry.kind === 'convert') {
          state.convForm = { stroke: entry.stroke, sex: entry.sex, distance: entry.distance, from: entry.from, seconds: entry.seconds, name: entry.name, sid: entry.sid };
          navigate('converter', { reviewId: entry.id });
        } else if (entry.kind === 'fifty') {
          state.fiftyForm = { stroke: entry.stroke, sex: entry.sex, seconds: entry.seconds, name: entry.name, sid: entry.sid, best: { ...(entry.best || {}) }, date: entry.date || '' };
          navigate('fifty', { reviewId: entry.id });
        } else if (entry.kind === 'adjacent') {
          state.adjForm = { stroke: entry.stroke, sex: entry.sex, pool: entry.pool, distance: entry.distance, seconds: entry.seconds, name: entry.name, sid: entry.sid };
          navigate('adjacent', { reviewId: entry.id });
        } else if (entry.kind === 'eff') {
          state.effForm = { stroke: entry.stroke, sex: entry.sex, from: entry.from, seconds: entry.seconds, name: entry.name, sid: entry.sid, actual: { ...(entry.actual || {}) }, date: entry.date || '' };
          navigate('efficiency', { reviewId: entry.id });
        } else {
          state.swimmer = null;
          state.form = { stroke: entry.stroke, sex: entry.sex, pool: entry.pool, distance: entry.distance, targetSeconds: entry.targetSeconds, name: entry.name, sid: entry.sid };
          state.result = predict(entry.stroke, entry.sex, entry.pool, entry.distance, entry.targetSeconds);
          navigate('predicted-splits', { reviewId: entry.id });
        }
      }
      return;
    }
    const round = e.target.closest('[data-round]');
    if (round) {
      state.raceForm.round = round.getAttribute('data-round');
      render(); return;
    }
    const stroke = e.target.closest('[data-stroke]');
    if (stroke) {
      state.form.stroke = stroke.getAttribute('data-stroke');
      if (state.view === 'race-entry') seedRaceTimes();
      render(); return;
    }
    const sex = e.target.closest('[data-sex]');
    if (sex) {
      state.form.sex = sex.getAttribute('data-sex');
      render(); return;
    }
    const pool = e.target.closest('[data-pool]');
    if (pool) {
      state.form.pool = pool.getAttribute('data-pool');
      render(); return;
    }
    const dist = e.target.closest('[data-distance]');
    if (dist) {
      state.form.distance = parseInt(dist.getAttribute('data-distance'), 10);
      if (state.view === 'race-entry') seedRaceTimes();
      render(); return;
    }
    // Course-converter selectors (separate state so they don't touch the predictor form).
    const cstroke = e.target.closest('[data-cstroke]');
    if (cstroke) { state.convForm.stroke = cstroke.getAttribute('data-cstroke'); render(); return; }
    const csex = e.target.closest('[data-csex]');
    if (csex) { state.convForm.sex = csex.getAttribute('data-csex'); render(); return; }
    const cdist = e.target.closest('[data-cdist]');
    if (cdist) { state.convForm.distance = parseInt(cdist.getAttribute('data-cdist'), 10); render(); return; }
    const cfrom = e.target.closest('[data-convfrom]');
    if (cfrom) { state.convForm.from = cfrom.getAttribute('data-convfrom'); render(); return; }
    const estroke = e.target.closest('[data-estroke]');
    if (estroke) { state.effForm.stroke = estroke.getAttribute('data-estroke'); render(); return; }
    const eesex = e.target.closest('[data-esex]');
    if (eesex) { state.effForm.sex = eesex.getAttribute('data-esex'); render(); return; }
    const efrom = e.target.closest('[data-efffrom]');
    if (efrom) { state.effForm.from = efrom.getAttribute('data-efffrom'); render(); return; }
    // 50 m LCM calculator selectors
    const fstroke = e.target.closest('[data-fstroke]');
    if (fstroke) { state.fiftyForm.stroke = fstroke.getAttribute('data-fstroke'); render(); return; }
    const fsex = e.target.closest('[data-fsex]');
    if (fsex) { state.fiftyForm.sex = fsex.getAttribute('data-fsex'); render(); return; }
    // Adjacent-events selectors
    const astroke = e.target.closest('[data-astroke]');
    if (astroke) { state.adjForm.stroke = astroke.getAttribute('data-astroke'); render(); return; }
    const asex = e.target.closest('[data-asex]');
    if (asex) { state.adjForm.sex = asex.getAttribute('data-asex'); render(); return; }
    const apool = e.target.closest('[data-apool]');
    if (apool) { state.adjForm.pool = apool.getAttribute('data-apool'); render(); return; }
    const adist = e.target.closest('[data-adist]');
    if (adist) { state.adjForm.distance = parseInt(adist.getAttribute('data-adist'), 10); render(); return; }
    const action = e.target.closest('[data-action]');
    if (action) {
      handleAction(action.getAttribute('data-action'), action);
      return;
    }
  }

  // Click handler for jumper rail
  const jbtn = e.target.closest('.jumper-btn');
  if (jbtn) {
    const v = jbtn.getAttribute('data-view');
    handleJumpTo(v);
  }

  // Demo flow buttons
  const flow = e.target.closest('[data-flow]');
  if (flow) {
    runDemo(flow.getAttribute('data-flow'));
  }
});

function handleAction(action, el) {
  switch (action) {
    case 'quick-calc':
      state.swimmer = null;
      state.form = { stroke: 'Free', sex: 'M', pool: 'LCM', distance: 200, targetSeconds: 120, name: '' };
      navigate('quick-calc');
      break;
    case 'add-event': {
      // From a saved swimmer's menu: open the predictor tied to that swimmer (id + name, sex/pool from latest).
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.swimmer = null;
      state.form = {
        stroke: 'Free', distance: 200, targetSeconds: 120,
        sex: last ? last.sex : 'M', pool: (last && last.pool) || 'LCM',
        name: swimmerName(sid), sid,
      };
      navigate('quick-calc');
      break;
    }
    case 'new-race':
      state.swimmer = null;
      state.form = { stroke: 'Free', sex: 'M', pool: 'LCM', distance: 200, targetSeconds: 120, name: '' };
      state.raceForm = { times: {}, sr: {}, competition: '', date: '', notes: '' };
      seedRaceTimes();
      navigate('race-entry');
      break;
    case 'add-race': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.swimmer = null;
      state.form = {
        stroke: last ? last.stroke : 'Free', sex: last ? last.sex : 'M', pool: (last && last.pool) || 'LCM',
        distance: last ? last.distance : 200, targetSeconds: (last && last.targetSeconds) || 120,
        name: swimmerName(sid), sid,
      };
      state.raceForm = { times: {}, sr: {}, competition: '', date: '', notes: '' };
      seedRaceTimes();
      navigate('race-entry');
      break;
    }
    case 'analyze-race': {
      const f = state.form, rf = state.raceForm;
      state.race = {
        id: 'rc' + Date.now().toString(36), kind: 'race', name: (f.name || '').trim(), sid: f.sid,
        stroke: f.stroke, sex: f.sex, pool: f.pool, distance: f.distance,
        targetSeconds: rf.times.target ?? f.targetSeconds,
        times: { ...rf.times }, sr: { ...(rf.sr || {}) },
        competition: (rf.competition || '').trim(),
        date: rf.date || new Date().toISOString().slice(0, 10),
        notes: (rf.notes || '').trim(),
      };
      navigate('race-analysis');
      break;
    }
    case 'save-race': {
      const r = state.race;
      if (!r) break;
      if (!(r.name || '').trim()) { showToast('Add a swimmer name to save this race'); break; }
      if (!state.saved.find(x => x.id === r.id)) { r.sid = resolveSid(r); state.saved.push(r); persistSaved(); }
      showToast(`Saved ${r.name} · ${r.distance} ${r.stroke}`);
      break;
    }
    case 'compare-races': {
      const ids = (el && el.getAttribute('data-ids') || '').split(',').filter(Boolean);
      if (ids.length === 2) { state.compareIds = ids; navigate('race-compare'); }
      break;
    }
    case 'predict':
      // Navigate either way: a valid result shows splits, null shows the helpful no-data screen.
      state.result = predict(state.form.stroke, state.form.sex, state.form.pool, state.form.distance, state.form.targetSeconds);
      navigate('predicted-splits');
      break;
    case 'toggle-edit': state.editing = !state.editing; render(); break;
    case 'export-csv': exportAnalysisCsv(); break;
    case 'backup-json': exportBackupJson(); break;
    case 'import-json': triggerImport(); break;
    case 'converter': navigate('converter'); break;
    case 'efficiency': navigate('efficiency'); break;
    case 'fifty-splits': navigate('fifty'); break;
    case 'adjacent': navigate('adjacent'); break;
    case 'trends': navigate('trends'); break;
    case 'progress': navigate('progress'); break;
    case 'save-conv': {
      const c = state.convForm;
      if (!(c.name || '').trim()) { showToast('Add a swimmer name to save'); break; }
      if (!c.seconds) { showToast('Enter a time first'); break; }
      const upd = upsertSaved({ id: 'cv' + Date.now().toString(36), sid: resolveSid(c), kind: 'convert', name: c.name.trim(),
        stroke: c.stroke, sex: c.sex, distance: c.distance, from: c.from, seconds: c.seconds });
      showToast(`${upd ? 'Updated' : 'Saved'} ${c.name.trim()} · conversion`);
      break;
    }
    case 'save-fifty': {
      const f = state.fiftyForm;
      if (!(f.name || '').trim()) { showToast('Add a swimmer name to save'); break; }
      if (!f.seconds) { showToast('Enter a time first'); break; }
      const upd = upsertSaved({ id: 'ff' + Date.now().toString(36), sid: resolveSid(f), kind: 'fifty', name: f.name.trim(),
        stroke: f.stroke, sex: f.sex, distance: 50, seconds: f.seconds, best: { ...(f.best || {}) }, date: f.date || new Date().toISOString().slice(0, 10) });
      showToast(`${upd ? 'Updated' : 'Saved'} ${f.name.trim()} · 50 m`);
      break;
    }
    case 'save-eff': {
      const f = state.effForm;
      if (!(f.name || '').trim()) { showToast('Add a swimmer name to save'); break; }
      if (!f.seconds) { showToast('Enter a 100 time first'); break; }
      const upd = upsertSaved({ id: 'ef' + Date.now().toString(36), sid: resolveSid(f), kind: 'eff', name: f.name.trim(),
        stroke: f.stroke, sex: f.sex, distance: 100, from: f.from, seconds: f.seconds, actual: { ...(f.actual || {}) }, date: f.date || new Date().toISOString().slice(0, 10) });
      showToast(`${upd ? 'Updated' : 'Saved'} ${f.name.trim()} · efficiency`);
      break;
    }
    case 'save-adj': {
      const f = state.adjForm;
      if (!(f.name || '').trim()) { showToast('Add a swimmer name to save'); break; }
      if (!f.seconds) { showToast('Enter a time first'); break; }
      const upd = upsertSaved({ id: 'aj' + Date.now().toString(36), sid: resolveSid(f), kind: 'adjacent', name: f.name.trim(),
        stroke: f.stroke, sex: f.sex, pool: f.pool, distance: f.distance, seconds: f.seconds });
      showToast(`${upd ? 'Updated' : 'Saved'} ${f.name.trim()} · adjacent`);
      break;
    }
    case 'add-adjacent': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.adjForm = { stroke: 'Free', sex: last ? last.sex : 'M', pool: (last && last.pool) || 'LCM', distance: 100, seconds: 0, name: swimmerName(sid), sid };
      navigate('adjacent'); break;
    }
    case 'add-fifty': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.fiftyForm = { stroke: 'Free', sex: last ? last.sex : 'M', seconds: 0, name: swimmerName(sid), sid, best: {}, date: '' };
      navigate('fifty'); break;
    }
    case 'add-eff': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.effForm = { stroke: 'Free', sex: last ? last.sex : 'M', from: 'LCM', seconds: 0, name: swimmerName(sid), sid, actual: {}, date: '' };
      navigate('efficiency'); break;
    }
    case 'add-convert': {
      const sid = state.savedSid; const evs = entriesOf(sid); const last = evs[evs.length - 1];
      state.convForm = { stroke: 'Free', sex: last ? last.sex : 'M', distance: 100, from: 'LCM', seconds: 0, name: swimmerName(sid), sid };
      navigate('converter'); break;
    }
    case 'rename-swimmer': {
      const sid = state.savedSid; if (!sid) break;
      const cur = swimmerName(sid);
      const nn = (prompt('Rename swimmer', cur) || '').trim();
      if (!nn || nn === cur) break;
      state.saved.forEach(s => { if (s.sid === sid) s.name = nn; });
      persistSaved(); render();
      showToast(`Renamed to ${nn}`);
      break;
    }
    case 'back': back(); break;
    case 'squad': navigate('squad-targets'); break;
    case 'settings': showToast('Settings — not in v1 mock'); break;
    case 'add-swimmer': showToast('Add swimmer — not in v1 mock'); break;
    case 'save': {
      const nm = (state.form.name || '').trim();
      if (!nm) { showToast('Add a swimmer name to save'); break; }
      if (!state.result) { showToast('Nothing to save'); break; }
      const r = state.result;
      const upd = upsertSaved({ id: 'sv' + Date.now().toString(36), sid: resolveSid(state.form), name: nm,
        stroke: r.stroke, sex: r.sex, pool: r.pool, distance: r.distance, targetSeconds: r.targetSeconds });
      showToast(`${upd ? 'Updated' : 'Saved'} ${nm} · ${r.distance} ${r.stroke}`);
      break;
    }
    case 'set-as-target': showToast(`Saved to ${state.swimmer.name}'s next race`); break;
    case 'plan-from-pb':
      state.form = {
        stroke: state.swimmer.bestEvent.stroke,
        sex: state.swimmer.sex,
        pool: state.swimmer.bestEvent.pool,
        distance: state.swimmer.bestEvent.distance,
        targetSeconds: state.swimmer.bestEvent.time * 0.99, // 1% stretch
      };
      navigate('quick-calc');
      break;
    case 'log-race':
      if (state.swimmer && state.swimmer.id === sampleRace.swimmerId) {
        state.race = sampleRace;
        navigate('race-analysis');
      } else {
        showToast('Race entry form — not in v1 mock');
      }
      break;
    case 'open-race':
      state.race = sampleRace;
      navigate('race-analysis');
      break;
    case 'nudge-target': {
      const delta = parseFloat(el?.getAttribute('data-delta') || '0');
      const next = Math.max(10, state.result.targetSeconds + delta);
      state.form.targetSeconds = next;
      state.result = predict(state.result.stroke, state.result.sex, state.result.pool, state.result.distance, next);
      render();
      break;
    }
    case 'target-preset': {
      const mode = el?.getAttribute('data-mode');
      const base = (state.swimmer && state.swimmer.bestEvent.stroke === state.result.stroke && state.swimmer.bestEvent.distance === state.result.distance)
        ? state.swimmer.bestEvent.time
        : state.result.targetSeconds;
      let next = state.result.targetSeconds;
      if (mode === 'pb') next = base;
      else if (mode === 'minus1') next = base * 0.99;
      else if (mode === 'plus1') next = base * 1.01;
      state.form.targetSeconds = next;
      state.result = predict(state.result.stroke, state.result.sex, state.result.pool, state.result.distance, next);
      render();
      break;
    }
    case 'splitview': {
      state.splitView = el?.getAttribute('data-mode') || '100';
      render();
      break;
    }
    case 'copy-splits': {
      const r = state.result;
      if (!r) break;
      const rows = buildDisplaySegments(r);
      let cum = 0;
      const header = `${r.distance} ${r.stroke} ${r.pool} ${r.sex === 'M' ? 'Men' : 'Women'} — target ${formatTime(r.targetSeconds)}`;
      const lines = rows.map(row => { const c = row.count || 1; cum += row.time * c; return `${row.label}\t${formatTime(row.time)}${c > 1 ? ` (×${c})` : ''}\tcum ${formatTime(cum)}`; });
      const text = header + '\n' + lines.join('\n');
      const done = () => showToast('Splits copied');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(done);
      } else { done(); }
      break;
    }
  }
}

function handleJumpTo(view) {
  switch (view) {
    case 'roster': navigate('roster'); break;
    case 'quick-calc':
      state.swimmer = null;
      navigate('quick-calc');
      break;
    case 'predicted-splits':
      if (!state.result) {
        state.result = predict('Free', 'M', 'LCM', 200, 120);
      }
      navigate('predicted-splits');
      break;
    case 'race-analysis':
      state.race = sampleRace;
      navigate('race-analysis');
      break;
    case 'squad-targets':
      navigate('squad-targets');
      break;
  }
}

function runDemo(flow) {
  switch (flow) {
    case 'quick200':
      state.swimmer = null;
      state.form = { stroke: 'Free', sex: 'M', pool: 'LCM', distance: 200, targetSeconds: 120 };
      state.result = predict('Free', 'M', 'LCM', 200, 120);
      state.history = ['roster', 'quick-calc'];
      navigate('predicted-splits', { skipHistory: true });
      break;
    case 'ben':
      state.swimmer = swimmers.find(s => s.id === 'br');
      state.form = { stroke: 'Fly', sex: 'M', pool: 'LCM', distance: 100, targetSeconds: 54.8 };
      state.result = predict('Fly', 'M', 'LCM', 100, 54.8);
      state.history = ['roster', 'swimmer-detail', 'quick-calc'];
      navigate('predicted-splits', { skipHistory: true });
      break;
    case 'quinn':
      state.swimmer = swimmers.find(s => s.id === 'qp');
      state.race = sampleRace;
      state.history = ['roster', 'swimmer-detail'];
      navigate('race-analysis', { skipHistory: true });
      break;
    case 'reset':
      state.history = [];
      state.swimmer = null;
      state.result = null;
      state.race = null;
      navigate('roster');
      break;
  }
}

render();
