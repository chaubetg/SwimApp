// ===== SCY conversions (built Jul 2026) =====
// ratio = metric_time / SCY_time, so SCY -> metric multiplies.
//
// Source: 347 same-season athlete pairs, NCAA D1 championships (SCY) x the fastest LCM meet of
// that same season (Olympic Trials / US Nationals / World Champs). Never paired across seasons:
// a collegiate athlete's twelve-month improvement would otherwise be absorbed as a course
// effect. Leave-one-out median error 0.79 s (1.03%); the naive distance-only x1.0936 misses by
// 5.66 s. See Race_data/README.md.
//
// CALIBRATED ON VARSITY-AND-UP SWIMMERS. Validated against the public converters on real
// athletes with known times: they run ~1.1% fast at this level and under-predicted 11 of 13
// men's 50 Free pairs. Below national level these ratios are unvalidated and likely too slow --
// within this sample slower swimmers already convert better (men's 50 Free r = -0.60).
const scyLcmRatios = {
  Free: {
    M: { 50: { mean: 1.16576, q25: 1.1577, q75: 1.17945, n: 13 }, 100: { mean: 1.17147, q25: 1.1621, q75: 1.182, n: 15 }, 200: { mean: 1.16697, q25: 1.1601, q75: 1.175, n: 15 }, 500: { mean: 0.91557, q25: 0.9103, q75: 0.92302, n: 12 }, 1650: { mean: 1.03928, q25: 1.03098, q75: 1.05275, n: 18 } },
    F: { 50: { mean: 1.16192, q25: 1.1456, q75: 1.17568, n: 22 }, 100: { mean: 1.15622, q25: 1.1439, q75: 1.1708, n: 25 }, 200: { mean: 1.15604, q25: 1.1417, q75: 1.1639, n: 15 }, 500: { mean: 0.90974, q25: 0.90655, q75: 0.91733, n: 14 }, 1650: { mean: 1.03657, q25: 1.02983, q75: 1.0448, n: 36 } },
  },
  Back: {
    M: { 100: { mean: 1.21747, q25: 1.20717, q75: 1.22955, n: 12 }, 200: { mean: 1.18829, q25: 1.16903, q75: 1.21365, n: 16 } },
    F: { 100: { mean: 1.18648, q25: 1.17235, q75: 1.21135, n: 21 }, 200: { mean: 1.17589, q25: 1.16708, q75: 1.18798, n: 18 } },
  },
  Breast: {
    M: { 100: { mean: 1.18236, q25: 1.169, q75: 1.1955, n: 17 }, 200: { mean: 1.18598, q25: 1.16815, q75: 1.19415, n: 16 } },
    F: { 100: { mean: 1.1693, q25: 1.15853, q75: 1.17823, n: 16 }, 200: { mean: 1.16773, q25: 1.15623, q75: 1.1847, n: 12 } },
  },
  Fly: {
    M: { 100: { mean: 1.16307, q25: 1.15218, q75: 1.17657, n: 10 }, 200: { mean: 1.1822, q25: 1.1687, q75: 1.2012, n: 11 } },
    F: { 100: { mean: 1.16387, q25: 1.1502, q75: 1.17788, n: 20 }, 200: { mean: 1.15206, q25: 1.13922, q75: 1.16862, n: 20 } },
  },
  IM: {
    M: { 200: { mean: 1.1869, q25: 1.17997, q75: 1.20267, n: 12 }, 400: { mean: 1.16977, q25: 1.16172, q75: 1.18175, n: 10 } },
    F: { 200: { mean: 1.16759, q25: 1.1593, q75: 1.17593, n: 16 }, 400: { mean: 1.16116, q25: 1.1525, q75: 1.1782, n: 15 } },
  },
};
// SCY -> SCM. GLOBAL BY SEX ONLY, deliberately: per-event granularity was tested on the 95
// NCAA x World Cup pairs and did NOT beat the global ratio, so a per-event table here would be
// false precision. 95 pairs vs 347 on the LCM side -- treat SCM as the cruder of the two.
const scyScmRatios = {
  M: { mean: 1.1443, q25: 1.1265, q75: 1.1623, n: 55 },
  F: { mean: 1.1391, q25: 1.1257, q75: 1.1573, n: 40 },
};
// SCY distances that have a ratio, per stroke. 500 and 1650 map to 400 m / 1500 m.
const scyDistances = { Free: [50, 100, 200, 500, 1650], Back: [100, 200], Breast: [100, 200], Fly: [100, 200], IM: [200, 400] };
const scyToMetric = { 500: 400, 1650: 1500 };
// The reverse, for converting INTO yards. Stroke-dependent: 400 m Free is the 500 yd and
// 1500 m is the 1650, but 400 m IM is simply the 400 yd IM. Anything absent from the NCAA
// championship programme (800 m Free, 50 m Back/Breast/Fly) is deliberately missing so the
// card refuses instead of borrowing an unrelated ratio.
const metricToScy = {
  Free:   { 50: 50, 100: 100, 200: 200, 400: 500, 1500: 1650 },
  Back:   { 100: 100, 200: 200 },
  Breast: { 100: 100, 200: 200 },
  Fly:    { 100: 100, 200: 200 },
  IM:     { 200: 200, 400: 400 },
};
// SCY<->SCM is an equal-distance table, so it only speaks 50/100/200.
const scyScmDistances = [50, 100, 200];

// ----- Screen: Course converter (SCY / SCM / LCM) -----
// Result block only — recomputed live on time input without a full re-render.
// One conversion card. `mul` = true when the target time is `from x ratio`.
//
// Which IQR end is the FAST one flips with the direction, and that is the whole subtlety:
//   multiplying -> a LOW ratio yields a fast target time, so q25 is the fast end
//   dividing    -> a HIGH ratio yields a fast target time, so q75 is the fast end
// Either way the fast end means the swimmer favours the course being converted TO. This is the
// rule the SCM<->LCM converter already used; it is now shared so SCY cannot drift from it.
function convCard(fromCourse, toCourse, toLabel, secs, rec, mul) {
  const mean = mul ? secs * rec.mean : secs / rec.mean;
  const fast = mul ? secs * rec.q25 : secs / rec.q75;
  const slow = mul ? secs * rec.q75 : secs / rec.q25;
  const cap = 'text-[9px] uppercase tracking-wide text-faint';
  return `
    <div class="bg-white border border-slate-200 rounded-2xl p-5">
      <div class="label-cap text-muted mb-1">Predicted ${toLabel}</div>
      <div class="hero-time text-4xl leading-tight text-center my-2">${formatTime(mean)}</div>
      <div class="relative">
        <div class="range-track"><div class="range-fill" style="left:12%; right:12%;"></div><div class="range-tick" style="left:50%;"></div></div>
        <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">
          <span><span class="mono">${formatTime(fast)}</span> <span class="${cap}">favours ${toCourse}</span></span>
          <span><span class="${cap}">favours ${fromCourse}</span> <span class="mono">${formatTime(slow)}</span></span>
        </div>
      </div>
      <div class="text-[10px] text-faint text-center mt-2">n=${rec.n} paired athletes</div>
    </div>`;
}

function convEmpty(msg) {
  return `<div class="bg-white border border-slate-200 rounded-2xl p-6 text-center">
    <div class="text-slate-700 font-semibold text-sm mb-1">No conversion for this event</div>
    <div class="text-slate-500 text-sm leading-relaxed">${msg}</div>
  </div>`;
}

// Resolve one directed conversion into everything the card needs, or a reason it can't be done.
// Returns { rec, mul, label } or { why }.
function convPlan(from, to, stroke, sex, dist) {
  const lcmScm = (convRatios[stroke] && convRatios[stroke][sex]) ? convRatios[stroke][sex][dist] : null;
  const scyLcm = d => (scyLcmRatios[stroke] && scyLcmRatios[stroke][sex]) ? scyLcmRatios[stroke][sex][d] : null;

  if (from === 'SCY') {
    // 500 yd and 1650 yd land on 400 m / 1500 m — the distance changes too, so name the target.
    const toM = scyToMetric[dist] || dist;
    if (to === 'LCM') {
      const rec = scyLcm(dist);
      return rec ? { rec, mul: true, label: `LCM · ${toM} m ${stroke}` }
                 : { why: `${dist} yd ${stroke} isn't an NCAA championship event, so there are no paired swims to build a ratio from.` };
    }
    if (scyToMetric[dist]) return { why: `No SCM conversion for the ${dist} yd — it maps to ${toM} m, and neither the SCY↔SCM nor the LCM↔SCM table covers that distance.` };
    return { rec: scyScmRatios[sex], mul: true, label: `SCM · ${dist} m ${stroke}` };
  }

  if (to === 'SCY') {
    if (from === 'LCM') {
      const yd = (metricToScy[stroke] || {})[dist];
      const rec = yd ? scyLcm(yd) : null;
      return rec ? { rec, mul: false, label: `SCY · ${yd} yd ${stroke}` }
                 : { why: `${dist} m ${stroke} has no NCAA championship equivalent in yards, so there's nothing to convert to.` };
    }
    // SCM -> SCY. The SCY↔SCM table is equal-distance only.
    if (scyScmDistances.indexOf(dist) === -1) return { why: `SCY conversion only covers 50/100/200 — the SCY↔SCM ratios are built from equal-distance pairs.` };
    return { rec: scyScmRatios[sex], mul: false, label: `SCY · ${dist} yd ${stroke}` };
  }

  // SCM <-> LCM, the app's original pair. convRatios is LCM/SCM, so SCM multiplies and LCM divides.
  if (!lcmScm) return { why: `${dist} m ${stroke} isn't a standard SCM/LCM pair in the World Aquatics data. Try Free (50–1500), Fly/Back/Breast (50/100/200), or IM (200/400).` };
  return { rec: lcmScm, mul: from === 'SCM', label: `${to} · ${dist} m ${stroke}` };
}

function convResultHtml() {
  const c = state.convForm;
  const secs = Math.max(0, c.seconds || 0);
  const sexLbl = c.sex === 'M' ? 'Men' : 'Women';
  const others = ['SCY', 'SCM', 'LCM'].filter(x => x !== c.from);
  if (!secs) {
    return `<div class="bg-white border border-dashed border-slate-200 rounded-2xl p-6 text-center text-sm text-muted">Enter a ${c.from} time above to see the predicted ${others[0]} and ${others[1]} times.</div>`;
  }
  return others.map(to => {
    const p = convPlan(c.from, to, c.stroke, c.sex, c.distance);
    return p.why ? convEmpty(p.why) : convCard(c.from, to, `${p.label} ${sexLbl}`, secs, p.rec, p.mul);
  }).join('<div class="h-3"></div>');
}

// Derive both 100s + the three test targets & pace-lock times from state.effForm.
function effCompute() {
  const f = state.effForm, st = f.stroke, sx = f.sex;
  const dist = f.dist === '200' ? 200 : (f.dist === '100' ? 100 : 50);
  const course = f.course === 'SCM' ? 'SCM' : 'LCM';
  const t = Math.max(0, f.t || 0);
  const spc = mmSpc[st];
  const crEvent = convRatios[st] && convRatios[st][sx] && convRatios[st][sx][dist];
  const tLcm = (course === 'SCM' && crEvent) ? t * crEvent.mean : t;
  const cleanR = (mmCleanR[st] && mmCleanR[st][dist]) || 1;
  const vc = tLcm > 0 ? cleanR * dist / tLcm : 0;       // 15-45 m clean surface speed (dive removed)
  const finF = mmFin[st] || 0.97;                       // last-5 m speed / clean speed (measured)
  const base50 = vc > 0 ? (5/vc + 20/(vc*mmSeg.front) + 20/(vc*mmSeg.back) + 5/(vc*finF)) : 0; // 0-5 push + 5-25 front window + 25-45 back window + measured last-5 m finish
  const pace = dist === 200 ? '200' : '100';
  const siGoal = dist === 50 ? mmSI50[st][sx] : mmSIfresh[pace][st][sx]; // 50 input -> the real 50m-EVENT SI (4.47 not 4.96 for free M); else 1st-50 fresh SI
  const siLimit = dist === 50 ? mmSI50low[st][sx] : ((mmSIfloor[pace][st] && mmSIfloor[pace][st][sx]) || 0); // floor = deepest-fatigue window: 50 -> own back window; 100/200 -> last 25 of the final lap
  const cr50 = convRatios[st] && convRatios[st][sx] && convRatios[st][sx][50];
  const t50scm = cr50 ? base50 / cr50.mean : base50;
  const timeUp = (mmTimeUp[st] && mmTimeUp[st][dist]) || 1.02;  // slowest-time factor from the ratio's upper edge
  return { st: st, sx: sx, dist: dist, course: course, spc: spc, base50: base50, t50scm: t50scm, siGoal: siGoal, siLimit: siLimit, vc: vc, finF: finF, timeUp: timeUp };
}

function adjResultHtml() {
  const f = state.adjForm;
  const T = Math.max(0, f.seconds || 0);
  const ladder = [50, 100, 200, 400, 800, 1500];
  const idx = ladder.indexOf(f.distance);
  if (!T) return `<div class="bg-white border border-dashed border-slate-200 rounded-2xl p-6 text-center text-sm text-muted">Enter your ${f.distance} m time above to predict the neighbouring events.</div>`;
  const mk = (dist, dir, r) => {
    const mean = T * r.mean;
    return `
      <div class="bg-white border border-slate-200 rounded-2xl p-4">
        <div class="label-cap text-muted mb-1">${dist} m ${f.stroke} · ${dir}</div>
        <div class="hero-time text-3xl text-center leading-tight my-1">${formatTime(mean)}</div>
        <div class="text-center text-[10px] text-faint mt-1">n=${r.n} dual-ranked athletes</div>
      </div>`;
  };
  const cards = [];
  if (idx > 0) {
    const dp = ladder[idx - 1];
    const rec = adjRatios[`${f.sex}|${f.stroke}|${f.pool}|${dp}|${f.distance}`];
    if (rec) cards.push(mk(dp, 'shorter', rec.down));
  }
  if (idx >= 0 && idx < ladder.length - 1) {
    const dn = ladder[idx + 1];
    const rec = adjRatios[`${f.sex}|${f.stroke}|${f.pool}|${f.distance}|${dn}`];
    if (rec) cards.push(mk(dn, 'longer', rec.up));
  }
  if (!cards.length) return `<div class="bg-white border border-slate-200 rounded-2xl p-6 text-center"><div class="text-slate-700 font-semibold text-sm mb-1">No adjacent events on the ladder</div><div class="text-slate-500 text-sm leading-relaxed">There's no neighbouring ${f.stroke} ${f.pool} event with dual-ranked data for the ${f.distance} m. Try a different distance or stroke.</div></div>`;
  return cards.join('');
}

// ----- Screen 3: Predicted splits -----
// Build the rows actually displayed: per-50 (per-25 for the 50), or per-100
// checkpoints for distance events when that view is selected.
// Median within-lap first-25 share of a 100 SCM, from 1,201 clean races (World Cup 2025,
// Westmont+Toronto+Carmel pooled): p1 = 1st-25 share of the DIVE 50, p3 = 3rd-25 share of
// the PUSH 50. Lap shapes differ (dive front-loads), so each 50's 25s use its own share.
const scm100Per25 = {
  Free:   { M: { p1: 0.4741, p3: 0.5000, n: 243 }, F: { p1: 0.4764, p3: 0.5016, n: 137 } },
  Back:   { M: { p1: 0.4829, p3: 0.5009, n: 142 }, F: { p1: 0.4862, p3: 0.5002, n: 140 } },
  Breast: { M: { p1: 0.4558, p3: 0.4928, n: 151 }, F: { p1: 0.4595, p3: 0.4933, n: 138 } },
  Fly:    { M: { p1: 0.4578, p3: 0.4916, n: 137 }, F: { p1: 0.4580, p3: 0.4916, n: 113 } },
};
// Median within-lap shares for a 200 SCM, from 1,004 clean races (World Cup 2025, 3 stops):
// p1 = 1st-25 share of the DIVE 50 (opening); pLast = last-25 share of the FINAL 50 (closing).
const scm200Per25 = {
  Free:   { M: { p1: 0.4704, pLast: 0.4934, n: 194 }, F: { p1: 0.4739, pLast: 0.4921, n: 134 } },
  Back:   { M: { p1: 0.4790, pLast: 0.4938, n: 112 }, F: { p1: 0.4803, pLast: 0.4930, n: 119 } },
  Breast: { M: { p1: 0.4555, pLast: 0.5013, n: 136 }, F: { p1: 0.4570, pLast: 0.5012, n: 113 } },
  Fly:    { M: { p1: 0.4538, pLast: 0.5026, n: 119 }, F: { p1: 0.4567, pLast: 0.5017, n: 77 } },
};
function buildDisplaySegments(r) {
  const isIM = r.stroke === 'IM';
  const per100 = !isIM && r.distance >= 400 && state.splitView === '100' && r.splits.length % 2 === 0;
  if (per100) {
    const all = [];
    for (let k = 0; k * 2 < r.splits.length; k++) {
      const a = 2 * k, b = 2 * k + 1;
      all.push({ time: r.splits[a] + r.splits[b], lo: r.lo[a] + r.lo[b], hi: r.hi[a] + r.hi[b] });
    }
    const n = all.length;
    // The middle 100s are identical (flat-middle model) — collapse them into one row.
    if (n >= 3) {
      const mid = all[1];
      // Distance events are paced near-even — all rows neutral (faster/slower), no front/back-end.
      return [
        { ...all[0], label: 'First 100', count: 1, half: 'middle' },
        { time: mid.time, lo: mid.lo, hi: mid.hi, label: `Middle 100s · 2–${n - 1}`, count: n - 2, half: 'middle' },
        { ...all[n - 1], label: 'Last 100', count: 1, half: 'middle' },
      ];
    }
    return all.map((row, k) => ({ ...row, label: `${(k + 1) * 100} m`, count: 1, half: 'middle' }));
  }
  // Per-50 view for distance free: First 50, one combined Middle 50s row, Last 50.
  if (!isIM && r.distance >= 400 && state.splitView === '50' && r.splits.length >= 3) {
    const n = r.splits.length;
    let midSum = 0;
    for (let i = 1; i < n - 1; i++) midSum += r.splits[i];
    const midCount = n - 2;
    // Distance events are paced near-even — all rows neutral (faster/slower), no front/back-end.
    return [
      { time: r.splits[0], lo: r.lo[0], hi: r.hi[0], label: 'First 50', count: 1, half: 'middle' },
      { time: midSum / midCount, lo: r.lo[1], hi: r.hi[1], label: `Middle 50s · 2–${n - 1}`, count: midCount, half: 'middle' },
      { time: r.splits[n - 1], lo: r.lo[n - 1], hi: r.hi[n - 1], label: 'Last 50', count: 1, half: 'middle' },
    ];
  }
  // SCM 100: four 25 m lines. Each predicted 50 is split into its two 25s using the MEDIAN
  // within-lap shape from real 100 SCM races (scm100Per25): a dive shape for lap 1 (p1) and a
  // push shape for lap 2 (p3), so the 25/75 marks reflect the actual race, not the standalone
  // 50. The 50 and 100 rows stay exactly on the pacing table (shares sum to 1 within each 50).
  // Falls back to the dive-both-laps 50 shape only if a stroke/sex is missing from the table.
  if (!isIM && r.pool === 'SCM' && r.distance === 100 && r.splits.length === 2) {
    const sp = scm100Per25[r.stroke] && scm100Per25[r.stroke][r.sex];
    let shares = sp ? [sp.p1, sp.p3] : null;
    if (!shares) {
      const t50 = getRatios(r.stroke, r.sex, 'SCM', 50);
      if (t50 && t50.median && t50.median.length === 2) { const fa = t50.median[0] / (t50.median[0] + t50.median[1]); shares = [fa, fa]; }
    }
    if (shares) {
      const out = [];
      [0, 1].forEach(j => {
        const fa = shares[j], fb = 1 - fa;
        out.push({ time: r.splits[j] * fa, lo: r.lo[j] * fa, hi: r.hi[j] * fa, label: (j * 50 + 25) + ' m (est.)', srIdx: j, half: j === 0 ? 'front' : 'middle' });
        out.push({ time: r.splits[j] * fb, lo: r.lo[j] * fb, hi: r.hi[j] * fb, label: (j * 50 + 50) + ' m', srIdx: j, half: j === 1 ? 'back' : 'middle' });
      });
      return out;
    }
  }
  const imL = isIM ? imLabels[r.distance] : null;
  const nSeg = r.splits.length;
  return r.splits.map((t, i) => ({
    time: t, lo: r.lo[i], hi: r.hi[i],
    label: imL ? imL[i] : `${(i + 1) * r.segLen} m`,
    // Front/back-end only on the true opening & closing splits (a pacing choice); the rest neutral.
    // IM uses stroke-strength labels instead, so leave null.
    half: isIM ? null : (i === 0 ? 'front' : (i === nSeg - 1 ? 'back' : 'middle')),
  }));
}

// A centered range bar (q25 left, median tick centre, q75 right).
function rangeBar(lo, hi, mid) {
  const w = Math.min(100, ((hi - lo) / mid) * 100);
  const pad = (100 - w) / 2;
  return `<div class="range-track"><div class="range-fill" style="left: ${pad.toFixed(1)}%; right: ${pad.toFixed(1)}%;"></div><div class="range-tick" style="left: 50%;"></div></div>`;
}

// 400 IM: grouped by stroke — each stroke's 100 (headline, dedicated IQR) with its two 50s below.
function renderIM400Splits(r) {
  const strokes = ['Fly', 'Back', 'Breast', 'Free'];
  const per50im = srPer50.IM && srPer50.IM[400] && srPer50.IM[400][r.sex]; // per-50 SR for the 8 legs
  const cap = 'text-[9px] uppercase tracking-wide text-faint';
  let cumMed = 0, cumFast = 0, cumSlow = 0; // cumulative at each 100 mark
  return strokes.map((stk, j) => {
    const a = 2 * j, b = 2 * j + 1;
    const h = r.splits[a] + r.splits[b];                              // 100 median = sum of its 50s
    const hlo = r.hundoLo ? r.hundoLo[j] : (r.lo[a] + r.lo[b]);       // dedicated 100 IQR
    const hhi = r.hundoHi ? r.hundoHi[j] : (r.hi[a] + r.hi[b]);
    const lg = stk.toLowerCase();
    // Cumulative to this 100 mark (median bracketed + fast/slow range). Skip the first 100 (fly),
    // where cumulative just repeats the split; the last (free) lands on the target.
    cumMed += h; cumFast += hlo; cumSlow += hhi;
    const cumBlock = j > 0
      ? `<div class="text-center mt-1.5 leading-tight">
           <div class="text-[10px] text-faint mono">(${formatTime(cumMed)})</div>
           <div class="text-[11px] text-slate-600 mono font-semibold">${formatTime(cumFast)} – ${formatTime(cumSlow)}</div>
         </div>`
      : '';
    const sub = [a, b].map((idx, si) => `
      <div class="px-4 py-2.5 flex items-center gap-3">
        <div class="flex-shrink-0" style="width:46px;">
          <span class="label-cap text-faint">${si === 0 ? '1st 50' : '2nd 50'}</span>
          ${per50im && per50im[idx] ? `<div class="text-[9px] text-faint">SR ${Math.round(per50im[idx].avg)} (${Math.round(per50im[idx].lo)}–${Math.round(per50im[idx].hi)})</div>` : ''}
        </div>
        <div class="flex-1">
          ${rangeBar(r.lo[idx], r.hi[idx], r.splits[idx])}
          <div class="flex justify-between text-[10px] text-faint mt-1 mono"><span>${formatTime(r.lo[idx])}</span><span>${formatTime(r.hi[idx])}</span></div>
        </div>
        <span class="hero-time text-lg text-right flex-shrink-0" style="width:62px;">${formatTime(r.splits[idx])}</span>
      </div>`).join('');
    return `
      <div class="${j < 3 ? 'border-b border-slate-100' : ''}">
        <div class="px-4 pt-3.5 pb-2.5">
          <div class="text-center mb-1.5">
            <span class="label-cap text-cyan-700">${stk} · 100</span>
            <div class="hero-time text-2xl leading-tight">${formatTime(h)}</div>
          </div>
          ${rangeBar(hlo, hhi, h)}
          <div class="flex justify-between items-baseline text-[11px] text-muted mt-1.5">
            <span><span class="mono">${formatTime(hlo)}</span> <span class="${cap}">faster</span></span>
            <span><span class="${cap}">slower</span> <span class="mono">${formatTime(hhi)}</span></span>
          </div>
          ${cumBlock}
        </div>
        <div class="bg-slate-50/70">${sub}</div>
      </div>`;
  }).join('');
}

// Elite stroke-rate card for the Predicted splits screen (mean + min–max of finalists).
// Whole-event average; no IM data. The 50 also shows the 1st/2nd-25 rates.
function srCardHtml(r) {
  // Suppressed when per-50 SR is available (that's shown on each split row instead).
  if (srPer50[r.stroke] && srPer50[r.stroke][r.distance] && srPer50[r.stroke][r.distance][r.sex]) return '';
  const rec = srRef[r.stroke] && srRef[r.stroke][r.distance] && srRef[r.stroke][r.distance][r.sex];
  if (!rec) return '';
  const fifty = (r.distance === 50 && fiftyRatios[r.stroke]) ? fiftyRatios[r.stroke][r.sex] : null;
  const fiftyLine = fifty
    ? `<div class="text-[11px] text-muted mt-2 text-center">1st 25 <span class="mono font-semibold text-slate-700">${Math.round(fifty.sr1)}</span> · 2nd 25 <span class="mono font-semibold text-slate-700">${Math.round(fifty.sr2)}</span> cyc/min</div>`
    : '';
  return `
    <div class="bg-white rounded-2xl border border-slate-200 px-4 py-4">
      <div class="label-cap mb-2 text-muted">Elite stroke rate</div>
      <div class="text-center">
        <div class="hero-time text-3xl leading-tight">${Math.round(rec.avg)}<span class="text-sm text-muted font-normal"> cyc/min</span></div>
        <div class="text-[11px] text-muted mt-1">range <span class="mono">${Math.round(rec.min)}–${Math.round(rec.max)}</span></div>
      </div>
      ${fiftyLine}
    </div>`;
}

function renderPredictedSplits() {
  const r = state.result;
  if (!r || !r.splits || !r.splits.length) {
    const avail = availableEventsFor(state.form.stroke);
    return `
      <div class="statusbar"></div>
      <div class="px-5 pt-3 pb-3 flex items-center gap-3 bg-white">

        <button class="mt-5 px-4 py-3 bg-cyan-600 text-white rounded-xl text-sm font-bold hover:bg-cyan-700 transition" data-action="back">Adjust event</button>

  const isIM = r.stroke === 'IM';
  const rows = buildDisplaySegments(r);

          ${gp.rows.length ? `<table class="w-full text-[12px]">
            <tr class="text-[9px] uppercase tracking-wide text-faint"><th class="text-left font-semibold pb-0.5"></th><th class="text-right font-semibold">Best</th><th class="text-right font-semibold">Target</th><th class="text-right font-semibold">Gap</th></tr>

    cumRun  += row.time * (row.count || 1);

  return `

      <button class="w-11 h-11 rounded-full bg-cyan-50 border border-cyan-200 flex items-center justify-center text-cyan-700 text-2xl font-semibold leading-none hover:bg-cyan-100 active:scale-95 transition" data-action="back" aria-label="Back">‹</button><button class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 active:scale-95 transition flex-shrink-0" data-action="home" aria-label="Home" title="Home"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M9.5 20v-5.4h5V20"/></svg></button>
      <div class="flex-1 min-w-0">

      </div>

      </div>
    </div>

    <!-- Target time hero, with quick nudge controls -->
    <div class="px-5 py-3 bg-white border-b border-slate-100">
      <div class="bg-gradient-to-br from-cyan-50 to-white border border-cyan-100 rounded-2xl p-4">

              <button class="w-10 h-11 rounded-r-xl bg-white border border-l-0 border-cyan-200 text-cyan-800 text-sm font-bold hover:bg-cyan-100 active:scale-95 transition" data-action="nudge-target" data-delta="0.1" title="Slower by 0.1s" aria-label="Slower by 0.1 seconds">+.1</button>

      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">

}

// What events the dataset covers for a given stroke (for the no-data screen).
function availableEventsFor(stroke) {
  const out = [];
  const byStroke = ratios[stroke];
  if (!byStroke) return '';
  const combos = new Set();
  for (const sex of Object.keys(byStroke))
    for (const pool of Object.keys(byStroke[sex]))
      for (const d of Object.keys(byStroke[sex][pool])) combos.add(`${d}m ${pool}`);
  return Array.from(combos).sort((a, b) => parseInt(a) - parseInt(b)).join(', ');
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// ----- (legacy mock race analysis — unused in v2, superseded below) -----
function _legacyRaceAnalysis() {
  const race = state.race || sampleRace;
  const swimmer = swimmers.find(s => s.id === race.swimmerId);
  const prediction = predict(race.stroke, race.sex, race.pool, race.distance, race.targetSeconds);
  if (!prediction) return '<div class="p-8">No data</div>';

  const actualTotal = race.actualSplits.reduce((a, b) => a + b, 0);
  const delta = actualTotal - race.targetSeconds;
  const insights = generateInsights(prediction, race.actualSplits, swimmer);

  const splitRows = race.actualSplits.map((a, i) => {
    const cls = classifySplit(a, prediction.lo[i], prediction.hi[i]);
    const d = a - prediction.splits[i];
    const aColor = cls === 'too-fast' ? 'text-amber-700' : (cls === 'too-slow' ? 'text-rose-600' : 'text-slate-900');
    const dColor = cls === 'too-fast' ? 'text-amber-700' : (cls === 'too-slow' ? 'text-rose-600' : 'text-emerald-700');

    // Layout the range as a fixed extended window so a too-fast actual is visible left of the range,
    // and too-slow visible right. Pad the visualized window by 1.5x the IQR.
    const lo = prediction.lo[i], hi = prediction.hi[i], mean = prediction.splits[i];
    const iqr = hi - lo;
    const winLo = lo - iqr * 1.0;
    const winHi = hi + iqr * 1.0;
    const pct = (v) => Math.max(0, Math.min(100, ((v - winLo) / (winHi - winLo)) * 100));
    return `
      <div class="px-4 py-4 ${i < race.actualSplits.length - 1 ? 'border-b border-slate-100' : ''}">
        <div class="flex items-baseline justify-between gap-2 mb-3">
          <div class="text-sm font-semibold text-slate-700">${i + 1}${ordinal(i+1).slice(-2)} 50</div>
          <div class="flex items-baseline gap-3">
            <div class="hero-time text-2xl ${aColor}">${a.toFixed(2)}</div>
            <div class="text-xs ${dColor} font-semibold tnum">${d >= 0 ? '+' : ''}${d.toFixed(2)}</div>
          </div>
        </div>
        <div class="relative pb-1">
          <div class="range-track">
            <div class="range-fill" style="left: ${pct(lo).toFixed(1)}%; right: ${(100-pct(hi)).toFixed(1)}%;"></div>
            <div class="range-tick" style="left: ${pct(mean).toFixed(1)}%;"></div>
            <div class="range-actual ${cls}" style="left: ${pct(a).toFixed(1)}%;"></div>
          </div>
          <div class="flex justify-between text-[10px] text-faint mt-1.5 mono">
            <span>${lo.toFixed(2)}</span>
            <span class="text-[10px] text-faint">predicted ${mean.toFixed(2)}</span>
            <span>${hi.toFixed(2)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  const toneStyles = {
    amber:   { wrap: 'bg-amber-50 border-amber-200',   title: 'text-amber-900',   body: 'text-amber-800',   icon: 'text-amber-600',   action: 'text-amber-900 bg-amber-100' },
    rose:    { wrap: 'bg-rose-50 border-rose-200',     title: 'text-rose-900',    body: 'text-rose-800',    icon: 'text-rose-600',    action: 'text-rose-900 bg-rose-100' },
    emerald: { wrap: 'bg-emerald-50 border-emerald-200', title: 'text-emerald-900', body: 'text-emerald-800', icon: 'text-emerald-600', action: 'text-emerald-900 bg-emerald-100' },
  };
  const insightCards = insights.map(ins => {
    const t = toneStyles[ins.tone] || { wrap: 'bg-slate-100 border-slate-200', title: 'text-slate-900', body: 'text-slate-700', icon: 'text-slate-500', action: 'text-slate-700 bg-slate-100' };
    return `
      <div class="${t.wrap} border rounded-xl px-4 py-4 flex gap-3">
        <span class="${t.icon} text-xl leading-none mt-0.5 flex-shrink-0">${ins.icon}</span>
        <div class="flex-1">
          <div class="font-semibold text-sm ${t.title}">${ins.title}</div>
          <div class="text-xs mt-1 leading-relaxed ${t.body}">${ins.body}</div>
          ${ins.action ? `<div class="mt-2 inline-block px-2.5 py-1 rounded-md text-[11px] font-semibold ${t.action}">Next: ${ins.action.replace(/^Next:\s*/, '')}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const deltaColor = delta > 0 ? 'text-rose-600' : 'text-emerald-700';
  const deltaBg = delta > 0 ? 'bg-rose-50 border-rose-100' : 'bg-emerald-50 border-emerald-100';

  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-3 flex items-center gap-3 bg-white">
      <button class="w-11 h-11 rounded-full bg-cyan-50 border border-cyan-200 flex items-center justify-center text-cyan-700 text-2xl font-semibold leading-none hover:bg-cyan-100 active:scale-95 transition" data-action="back">‹</button><button class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 active:scale-95 transition flex-shrink-0" data-action="home" aria-label="Home" title="Home"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M9.5 20v-5.4h5V20"/></svg></button>
      <div class="flex-1 min-w-0">
        <div class="text-base font-semibold">${swimmer?.name || ''}</div>
        <div class="text-xs text-muted truncate">${race.distance} ${race.stroke} ${race.pool} · ${race.date}</div>
      </div>
    </div>

    <!-- Hero summary: target | actual | delta -->
    <div class="px-5 py-3 bg-white border-b border-slate-100">
      <div class="${deltaBg} border rounded-2xl p-4">
        <div class="grid grid-cols-3 gap-2">
          <div>
            <div class="label-cap text-muted">Target</div>
            <div class="hero-time text-xl mt-1">${formatTime(race.targetSeconds)}</div>
          </div>
          <div class="text-center border-l border-r border-slate-200/60">
            <div class="label-cap text-muted">Actual</div>
            <div class="hero-time text-xl mt-1">${formatTime(actualTotal)}</div>
          </div>
          <div class="text-right">
            <div class="label-cap ${deltaColor}">Delta</div>
            <div class="hero-time text-xl mt-1 ${deltaColor}">${delta >= 0 ? '+' : ''}${delta.toFixed(2)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="scrollable px-5 py-3 space-y-4 bg-slate-50">

      <!-- Legend (color is never the only signal) -->
      <div class="flex items-center justify-center gap-4 text-[11px] text-muted">
        <span><span class="status-dot too-fast"></span>Too fast</span>
        <span><span class="status-dot in-range"></span>In range</span>
        <span><span class="status-dot too-slow"></span>Too slow</span>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <div class="label-cap text-muted">Splits</div>
          <div class="label-cap text-faint">Actual · Δ vs predicted</div>
        </div>
        ${splitRows}
      </div>

      ${insights.length ? `
        <div class="space-y-3">
          <div class="label-cap text-muted px-1">Coaching insights</div>
          ${insightCards}
        </div>
      ` : '<div class="text-xs text-faint italic text-center py-2">No automatic insights for this race.</div>'}
    </div>
  `;
}

// ============================================================
// RACE ANALYSIS
// ============================================================
// Row structure for an event's comparison (predicted vs actual).
// "Competition (Round)" — e.g. USport (Final). Either part may be missing.
function meetLabel(s) {
  const c = (s.competition || '').trim(), r = (s.round || '').trim();
  return c && r ? `${c} (${r})` : (c || (r ? `(${r})` : ''));
}

function raceRowDefs(stroke, distance, pool) {
  if (stroke === 'IM') {
    const labels = distance === 400 ? ['Fly 100', 'Back 100', 'Breast 100', 'Free 100']
                 : distance === 100 ? ['Fly 25', 'Back 25', 'Breast 25', 'Free 25']
                 : ['Fly', 'Back', 'Breast', 'Free'];
    return labels.map((l, i) => ({ key: 'r' + i, label: l, kind: distance === 400 ? 'hundo' : 'seg', idx: i }));
  }
  if (distance >= 400) {
    return [
      { key: 'first', label: 'First 50', kind: 'seg', idx: 0 },
      { key: 'mid', label: 'Middle 50 (avg)', kind: 'mid' },
      { key: 'last', label: 'Last 50', kind: 'seg', idxFromEnd: 0 },
    ];
  }
  if (distance === 50) {
    // SCM 50: two 25 m splits (25 m wall) — avoids entering the 50 time twice and yields
    // useful 25 splits. LCM 50 has no 25 wall, so it stays a single total box.
    if (pool === 'SCM') return [
      { key: 'r0', label: '25 m', kind: 'seg', idx: 0 },
      { key: 'r1', label: '50 m', kind: 'seg', idx: 1 },
    ];
    return [{ key: 'total', label: 'Time', kind: 'total' }];
  }
  const n = distance / 50;
  return Array.from({ length: n }, (_, i) => ({ key: 'r' + i, label: `${(i + 1) * 50} m`, kind: 'seg', idx: i }));
}

// Fields the coach actually types (400+ free: first/last/total; middle is derived).
function raceEntryFields(stroke, distance, pool) {
  if (stroke !== 'IM' && distance >= 400) {
    return [{ key: 'first', label: 'First 50' }, { key: 'last', label: 'Last 50' }, { key: 'total', label: 'Total time' }];
  }
  return raceRowDefs(stroke, distance, pool).map(r => ({ key: r.key, label: r.label }));
}

// Auto-fill the last split from the total once every earlier split is entered, so the
// coach types the total + all-but-one split and the remainder is computed. Returns true
// if it changed a value (caller re-renders). Skips 400+ free and single-box 50 LCM, and
// never overrides the last box while the coach is editing it (changedKey === last).
function autoLastSplit(changedKey) {
  if (state.view !== 'race-entry') return false;
  const f = state.form, rf = state.raceForm;
  const total = rf.times.target || 0;
  if (!(total > 0)) return false;
  if (f.stroke !== 'IM' && f.distance >= 400) return false; // uses first/last/total, not per-lap
  const segs = raceRowDefs(f.stroke, f.distance, f.pool).filter(d => d.kind === 'seg');
  if (segs.length < 2) return false;                         // single-box 50 LCM / nothing to derive
  const lastKey = segs[segs.length - 1].key;
  if (changedKey === lastKey) return false;                  // respect a manual last split
  const earlier = segs.slice(0, -1);
  if (!earlier.every(d => (rf.times[d.key] || 0) > 0)) return false; // wait for all earlier splits
  const sum = earlier.reduce((s, d) => s + (rf.times[d.key] || 0), 0);
  const rem = Math.round((total - sum) * 100) / 100;
  if (rem <= 0) return false;
  if (Math.abs((rf.times[lastKey] || 0) - rem) < 0.005) return false; // already correct
  rf.times[lastKey] = rem;
  return lastKey;   // the caller repaints just this box instead of re-rendering the screen
}

// Pre-fill the actual-split boxes with the predicted splits for the target (coach edits to real).
function seedRaceTimes() {
  const f = state.form;
  const prev = state.raceForm.times || {};
  const tgt = state.raceForm.times.target ?? f.targetSeconds ?? 120;
  const p = predict(f.stroke, f.sex, f.pool, f.distance, tgt);
  const times = { target: tgt };
  if (p) {
    if (f.stroke !== 'IM' && f.distance >= 400) {
      times.first = p.splits[0];
      times.last = p.splits[p.splits.length - 1];
      times.total = tgt;
    } else {
      raceRowDefs(f.stroke, f.distance, f.pool).forEach(def => {
        if (def.kind === 'hundo') { const j = def.idx; times[def.key] = p.splits[2 * j] + p.splits[2 * j + 1]; }
        else if (def.kind === 'seg') { const i = def.idxFromEnd != null ? p.splits.length - 1 - def.idxFromEnd : def.idx; times[def.key] = p.splits[i]; }
        else if (def.kind === 'total') { times.total = tgt; }
      });
    }
  }
  // Only boxes the coach has NOT typed into follow the time swam. Anything entered by hand
  // survives a re-seed — correcting the total by 0.1s must not wipe three real splits.
  const touched = state.raceForm.touched || {};
  Object.keys(touched).forEach((k) => { if (touched[k] && prev[k] != null) times[k] = prev[k]; });
  // A held split and freshly predicted neighbours would not add up to the time swam, so the
  // column on screen would contradict the swim. Stretch the untouched splits over whatever
  // time is left; the last of them absorbs the rounding so the total is exact.
  if (!(f.stroke !== 'IM' && f.distance >= 400)) {
    const segKeys = raceRowDefs(f.stroke, f.distance, f.pool).filter((d) => d.kind === 'seg').map((d) => d.key);
    const free = segKeys.filter((k) => !touched[k] && times[k] > 0);
    const held = segKeys.filter((k) => touched[k]).reduce((s, k) => s + (times[k] || 0), 0);
    const freeSum = free.reduce((s, k) => s + times[k], 0);
    const rem = Math.round((tgt - held) * 100) / 100;
    if (free.length && freeSum > 0 && rem > 0) {
      const scale = rem / freeSum;
      let acc = 0;
      free.forEach((k, i) => {
        if (i < free.length - 1) { times[k] = Math.round(times[k] * scale * 100) / 100; acc += times[k]; }
        else times[k] = Math.round((rem - acc) * 100) / 100;
      });
    }
  }
  state.raceForm.times = times;
}

function buildRaceComparison(race) {
  const t = race.times || {};
  const distFree = race.stroke !== 'IM' && race.distance >= 400;
  const defs = raceRowDefs(race.stroke, race.distance, race.pool);
  const scm50 = race.distance === 50 && race.pool === 'SCM'; // two-25-split 50
  // Actual total first — the shape bands are scaled to what they ACTUALLY swam,
  // so hitting/beating the goal doesn't get mislabelled "too fast".
  let actualTotal;
  if (distFree || (race.distance === 50 && !scm50)) actualTotal = t.total;      // single-box 50 (LCM) / 400+
  else if (scm50 && t.r0 == null && t.r1 == null) actualTotal = t.total || 0;   // legacy 50 SCM saved as one total (pre-25-split)
  else actualTotal = defs.reduce((s, def) => s + (def.kind === 'mid' ? 0 : (t[def.key] || 0)), 0); // sum segs (incl. 50 SCM's two 25s)
  // Splits are optional: if none were entered, fall back to the official time typed at the
  // top so the race is still a complete record (a total with no splits is a valid swim).
  if (!(actualTotal > 0)) actualTotal = race.targetSeconds || 0;
  const p = predict(race.stroke, race.sex, race.pool, race.distance, actualTotal);
  if (!p) return null;
  const nmid = p.splits.length - 2;
  const rows = defs.map(def => {
    let pred, lo = null, hi = null;
    if (def.kind === 'total') { pred = actualTotal; }
    else if (def.kind === 'mid') { pred = p.splits[1]; lo = p.lo[1]; hi = p.hi[1]; }
    else if (def.kind === 'hundo') {
      const j = def.idx; pred = p.splits[2 * j] + p.splits[2 * j + 1];
      lo = p.hundoLo ? p.hundoLo[j] : p.lo[2 * j] + p.lo[2 * j + 1];
      hi = p.hundoHi ? p.hundoHi[j] : p.hi[2 * j] + p.hi[2 * j + 1];
    } else {
      const i = def.idxFromEnd != null ? p.splits.length - 1 - def.idxFromEnd : def.idx;
      pred = p.splits[i]; lo = p.lo[i]; hi = p.hi[i];
    }
    let actual;
    if (def.kind === 'mid') actual = (t.total - t.first - t.last) / nmid;
    else actual = t[def.key];
    const cls = (lo != null && hi != null && actual != null) ? classifySplit(actual, lo, hi) : 'in-range';
    return { label: def.label, pred, lo, hi, actual, cls, delta: actual != null ? actual - pred : 0 };
  });
  const delta = actualTotal - race.targetSeconds;
  const hit = actualTotal <= race.targetSeconds + 0.05; // hit or beat the goal
  return { p, rows, actualTotal, target: race.targetSeconds, delta, hit,
           insights: raceInsights(rows, actualTotal, race.targetSeconds, hit) };
}

// Outcome-aware verdict: if they hit/beat the goal we celebrate first and coach the
// shape as an OPPORTUNITY; if they missed, we use the cautionary "it cost you" framing.
function raceInsights(rows, actualTotal, target, hit) {
  const out = [];
  const first = rows[0], last = rows[rows.length - 1];
  const firstFast = first && first.cls === 'too-fast';
  const firstSlow = first && first.cls === 'too-slow';
  const lastSlow = last && last.cls === 'too-slow';
  const lastFast = last && last.cls === 'too-fast';
  const anyLaterSlow = rows.slice(1).some(r => r.cls === 'too-slow');
  const anyLaterFast = rows.slice(1).some(r => r.cls === 'too-fast');
  const allIn = rows.length > 1 && rows.every(r => r.cls === 'in-range');
  const overBy = actualTotal - target;

  if (hit) {
    out.push({ tone: 'emerald', icon: '🎉', title: 'Nicely done hitting your target time!',
      body: overBy < -0.05 ? `Came in ${Math.abs(overBy).toFixed(2)}s under the goal — strong swim.` : `Right on the goal — strong swim.` });
    if (allIn) {
      out.push({ tone: 'emerald', icon: '✓', title: 'Textbook distribution',
        body: `Every split sat inside the elite range for that time — pacing was spot on. Bank this pattern.` });
    } else if (firstFast && (anyLaterSlow || lastSlow)) {
      const over = Math.abs(first.pred - first.actual);
      out.push({ tone: 'cyan', icon: '↗', title: 'Aggressive front half — and it worked',
        body: `Opened ~${over.toFixed(2)}s under the elite range and gave a little back late, but still made the time. There may be more there with a slightly more controlled opening.`,
        finals: `Next time: open ~${Math.max(0.2, over).toFixed(1)}s easier and hold the back half — you could go quicker.` });
    } else if (firstSlow && (anyLaterFast || lastFast)) {
      const under = Math.abs(first.actual - first.pred);
      out.push({ tone: 'cyan', icon: '↘', title: 'Saved it for the back — go out faster',
        body: `Opened ~${under.toFixed(2)}s over the elite range, then closed fast (under the range) and still made the time. You left speed on the table at the front.`,
        finals: `Next time: go out ~${Math.max(0.2, under).toFixed(1)}s quicker — you've shown the back-half speed to back it up, so a faster swim is right there.` });
    } else {
      out.push({ tone: 'cyan', icon: '•', title: 'Got the job done',
        body: `A few splits drifted outside the elite range but it didn't cost the result — smoothing those could find a touch more next time.` });
    }
  } else {
    if (firstFast && anyLaterSlow) {
      const over = Math.abs(first.pred - first.actual);
      out.push({ tone: 'amber', icon: '⚡', title: 'Went out too hard',
        body: `Opened ~${over.toFixed(2)}s under the elite range, then faded — and finished +${overBy.toFixed(2)}s over goal. The fast start cost the back half.`,
        finals: `Tonight: open about ${Math.max(0.2, over).toFixed(1)}s easier and protect the close.` });
    } else if (firstSlow && (anyLaterFast || lastFast)) {
      const under = Math.abs(first.actual - first.pred);
      out.push({ tone: 'amber', icon: '↘', title: 'Went out too easy',
        body: `Opened ~${under.toFixed(2)}s over the elite range and closed fast — that conservative start left +${overBy.toFixed(2)}s on the table. The back-half speed says the time is there.`,
        finals: `Tonight: go out ~${Math.max(0.2, under).toFixed(1)}s quicker — you've got the close to support it.` });
    } else if (lastSlow) {
      const fade = last.actual - last.pred;
      out.push({ tone: 'rose', icon: '🔻', title: 'Faded at the end',
        body: `The closing split ran +${fade.toFixed(2)}s over the elite range; finished +${overBy.toFixed(2)}s over goal — the time leaked late.`,
        finals: `Tonight: control the middle so the final split holds in range.` });
    } else if (allIn) {
      out.push({ tone: 'slate', icon: '•', title: 'Even race, just short of the time',
        body: `Distribution matched the elite shape — the +${overBy.toFixed(2)}s gap is speed/fitness, not pacing.` });
    } else {
      out.push({ tone: 'slate', icon: '•', title: `Missed goal by +${overBy.toFixed(2)}s`,
        body: `Mixed splits without one clear story — scan the chart to see where the time went.` });
    }
  }
  return out;
}

// 3-box time entry (min : sec . hundredths) bound by key into state.raceForm.times.
// Nothing at 400 m or shorter is ever 10+ minutes, so the minutes box takes one digit
// there (two for 800/1500) — fewer stray keystrokes on deck.
function minDigits(distance) { return (distance && distance <= 400) ? 1 : 2; }

// Write a time into an EXISTING min:sec.hh group without rebuilding the page. render()
// would replace every input node, which drops focus, closes the mobile keyboard and resets
// the scroll container — far too violent for "one derived number changed".
function paintTimeBoxes(key, seconds) {
  const grp = document.querySelector(`[data-tkey="${key}"]`);
  if (!grp) return false;
  // The caret is in this row: the coach is entering it by hand and their value wins. Report
  // success so the caller doesn't fall back to a full re-render.
  if (grp.contains(document.activeElement)) return true;
  const t = Math.max(0, seconds || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), h = Math.round((t - Math.floor(t)) * 100);
  const mi = grp.querySelector('.tb-min'), se = grp.querySelector('.tb-sec'), hh = grp.querySelector('.tb-hh');
  if (!mi || !se || !hh) return false;
  mi.value = String(m);
  se.value = String(s).padStart(2, '0');
  hh.value = String(h).padStart(2, '0');
  return true;
}

// Recompute the final split from the time swam and paint it in place. Deliberately never
// calls render(): a redraw is what used to throw the coach back to the top of the form. If the
// row somehow isn't on screen the state is still correct and the next natural redraw shows it.
function deriveLastSplit(changedKey) {
  const changed = autoLastSplit(changedKey);
  if (changed) paintTimeBoxes(changed, state.raceForm.times[changed]);
}

// Repaint every split box from state. Used when the time swam changes and the untouched
// splits are re-predicted: painting keeps the caret in the time box and the screen exactly
// where it is, which a render() would not.
function repaintRaceSplits() {
  const t = state.raceForm.times || {};
  Object.keys(t).forEach((k) => { if (k !== 'target' && t[k] != null) paintTimeBoxes(k, t[k]); });
}

// A re-entered time swam wins outright: every split goes back to the model's prediction
// for that time. Clearing `touched` is what makes this a full reset rather than the partial
// re-seed that only moved the boxes nobody had typed into.
function resetRaceSplits() {
  state.raceForm.touched = {};
  seedRaceTimes();
  repaintRaceSplits();
}

// A split the coach has typed into belongs to the coach: seedRaceTimes must never re-predict
// over it. 'target' IS the time swam and 'total' mirrors it, so neither can be claimed.
function markSplitTouched(key) {
  if (key === 'target' || key === 'total') return;
  const rf = state.raceForm;
  (rf.touched = rf.touched || {})[key] = true;
}

function timeBoxes(key, seconds, distance) {
  const md = minDigits(distance);
  const t = Math.max(0, seconds || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), h = Math.round((t - Math.floor(t)) * 100);
  return `<div class="flex items-center gap-1" data-tkey="${key}">
      <input class="tb tb-min" inputmode="numeric" maxlength="${md}" value="${m}" aria-label="minutes" />
      <span class="tb-sep">:</span>
      <input class="tb tb-sec" inputmode="numeric" maxlength="2" value="${String(s).padStart(2, '0')}" aria-label="seconds" />
      <span class="tb-sep">.</span>
      <input class="tb tb-hh" inputmode="numeric" maxlength="2" value="${String(h).padStart(2, '0')}" aria-label="hundredths" />
    </div>`;
}

// ----- Screen: Other tools -----
// Everything that isn't Record Races or Training Pace. The converter and adjacent events used

// ===== Season targets =====
// A target is a saved plan carrying isTarget. Plans predate this, so treat a missing kind as
// 'plan' exactly as the rest of the app does.
function isPlan(s) { return !s.kind || s.kind === 'plan'; }
function targetFor(sid, stroke, pool, distance) {
  return state.saved.find((s) => isPlan(s) && s.isTarget && s.sid === sid
    && s.stroke === stroke && s.pool === pool && s.distance === distance) || null;
}
// Every swimmer holding a target at this pool + distance, whatever the stroke.
function targetsAt(pool, distance) {
  return state.saved.filter((s) => isPlan(s) && s.isTarget && s.sid && s.pool === pool && s.distance === distance);
}

// The gap between a target and the swimmer's best recorded race in the same event, split by
// split. Returns null when they've never raced it.
function targetGap(sid, stroke, sex, pool, distance, targetSeconds) {
  if (!sid || !(targetSeconds > 0)) return null;
  let best = null;
  state.saved.forEach((s) => {
    if (s.kind !== 'race' || s.sid !== sid) return;
    if (s.stroke !== stroke || s.pool !== pool || s.distance !== distance) return;
    const c = buildRaceComparison(s);
    const t = c ? c.actualTotal : 0;
    if (t > 0 && (!best || t < best.total)) best = { race: s, total: t };
  });
  if (!best) return null;
  const p = predict(stroke, sex, pool, distance, targetSeconds);
  const defs = raceRowDefs(stroke, distance, pool).filter((d) => d.kind === 'seg');
  const rows = [];
  // Only compare per segment when both sides describe the same segments. A 400+ race records
  // first/last/total while predict() returns eight 50 s — no honest row-by-row comparison.
  if (p && defs.length > 1 && defs.length === p.splits.length) {
    const seg = distance / defs.length;
    defs.forEach((d, i) => {
      const b = best.race.times && best.race.times[d.key];
      if (!(b > 0)) return;
      rows.push({ label: `${TP_ORD[i] || (i + 1) + 'th'} ${seg}`, best: b, target: p.splits[i], gap: p.splits[i] - b });
    });
  }
  return { bestTotal: best.total, date: best.race.date || '', gap: targetSeconds - best.total, rows };
}

// ===== Training Pace =====
// Which distances the model can predict for this pool, across every stroke. 50 m LCM has no
// entry in `ratios` — it comes from the separate fiftyRatios table via predict()'s fallback.
const TP_STROKES = ['Free', 'Back', 'Breast', 'Fly', 'IM'];
function tpDistances(pool) {
  const set = new Set();
  TP_STROKES.forEach((stroke) => {
    const byStroke = ratios[stroke] || {};
    Object.keys(byStroke).forEach((sex) => {
      const byPool = byStroke[sex] && byStroke[sex][pool];
      if (byPool) Object.keys(byPool).forEach((d) => set.add(+d));
    });
    if (pool === 'LCM' && fiftyRatios[stroke]) set.add(50);
  });
  return [...set].sort((a, b) => a - b);
}

// One entry per swimmer PER STROKE holding a recorded time at this pool + distance, alphabetical
// by first name. `basis` picks which of their swims sets the pace: 'best' (fastest) or 'recent'
// (latest date). Sex is per swimmer, read from their own race record — hence no sex picker.
// Segments come from buildDisplaySegments so a 100 SCM gets its four 25 s (25/75 modeled from
// real 100 SCM race splits), IM gets stroke legs, and 400+ gets the collapsed First/Middle/Last rows.
function trainingRows(pool, distance, basis) {
  const byKey = {};
  state.saved.forEach((s) => {
    if (s.kind !== 'race' || !s.sid) return;
    if (s.pool !== pool || s.distance !== distance) return;
    const c = buildRaceComparison(s);
    const t = c ? c.actualTotal : 0;
    if (!(t > 0)) return;
    const k = s.sid + '|' + s.stroke;
    (byKey[k] = byKey[k] || []).push({ race: s, t });
  });
  // Pacing off targets: a swimmer may hold a target for an event they haven't raced yet — the
  // common case early in a season — so seed those keys too.
  if (basis === 'target') {
    targetsAt(pool, distance).forEach((tg) => {
      const k = tg.sid + '|' + tg.stroke;
      if (!byKey[k]) byKey[k] = [];
    });
  }
  return Object.keys(byKey).map((k) => {
    const list = byKey[k];
    const sid = k.split('|')[0], stroke = k.split('|')[1];
    const pick = list.length ? (basis === 'recent'
      ? list.slice().sort((a, b) => (a.race.date || '').localeCompare(b.race.date || ''))[list.length - 1]
      : list.reduce((m, x) => (x.t < m.t ? x : m), list[0])) : null;
    const tg = basis === 'target' ? targetFor(sid, stroke, pool, distance) : null;
    // No target for this event: fall back to their best time and FLAG it, so the sheet never
    // silently mixes a target pace with a best-time pace.
    const fellBack = basis === 'target' && !tg;
    const total = tg ? tg.targetSeconds : (pick ? pick.t : 0);
    if (!(total > 0)) return null;
    const sex = (tg && tg.sex) || (pick && pick.race.sex) || 'M';
    const p = predict(stroke, sex, pool, distance, total);
    return {
      sid, stroke, sex, fellBack,
      name: swimmerName(sid) || (tg && tg.name) || (pick && pick.race.name) || '—',
      total, date: tg ? '' : (pick ? pick.race.date || '' : ''),
      segs: p ? buildDisplaySegments(p) : null,
      splits: (p && p.splits) || null,   // per-50 array, for the 400/800/1500 layouts
    };
  }).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
}

// Columns for one stroke at one event, in the order a coach calls the set: the 50 s first, then
// every 25 in order. (Target is rendered separately as the first column.)
const TP_ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
function tpCells(segs, stroke, pool, distance, splits, sex) {
  if (!segs || !segs.length) return [];
  // A 400 IM comes back as eight 50 s; it is swum and written as four 100 s, one per stroke.
  if (stroke === 'IM' && splits && splits.length === 8) {
    return ['Fly 100', 'Back 100', 'Breast 100', 'Free 100'].map((h, k) => ({
      h, v: splits[2 * k] + splits[2 * k + 1],
    }));
  }
  // Distance events: an opening block, the average middle 50 and its doubled 100, and a closing
  // block. Built from the per-50 splits, since buildDisplaySegments collapses without the 100.
  if (stroke !== 'IM' && splits && distance >= 400 && splits.length >= 8) {
    const n = splits.length;
    const ends = distance === 400 ? 1 : 2;                 // 400 opens/closes on a 50, 800+ on a 100
    const sum = (a, b) => splits.slice(a, b).reduce((s, x) => s + x, 0);
    const mid = sum(ends, n - ends) / (n - 2 * ends);      // mean of every 50 in between
    const lab = ends === 1 ? '50' : '100';
    return [
      { h: 'First ' + lab, v: sum(0, ends) },
      { h: 'Middle 50', v: mid },
      { h: 'Middle 100', v: mid * 2 },
      { h: 'Last ' + lab, v: sum(n - ends, n) },
    ];
  }
  if (pool === 'SCM' && distance === 100 && segs.length === 4 && stroke !== 'IM') {
    return [
      { h: '1st 50', v: segs[0].time + segs[1].time },
      { h: 'Mid 50', v: segs[1].time + segs[2].time },   // 25->75, excludes the dive
      { h: '2nd 50', v: segs[2].time + segs[3].time },
      { h: '1st 25', v: segs[0].time }, { h: '2nd 25', v: segs[1].time },
      { h: '3rd 25', v: segs[2].time }, { h: '4th 25', v: segs[3].time },
    ];
  }
  // 100 IM (SCM): the three rolling 50 combos coaches call, then the four 25 legs.
  if (pool === 'SCM' && distance === 100 && stroke === 'IM' && segs.length === 4) {
    return [
      { h: 'Fly-Bk', v: segs[0].time + segs[1].time },
      { h: 'Bk-Br', v: segs[1].time + segs[2].time },    // middle 50, excludes the dive
      { h: 'Br-Fr', v: segs[2].time + segs[3].time },
      { h: 'Fly', v: segs[0].time }, { h: 'Back', v: segs[1].time },
      { h: 'Breast', v: segs[2].time }, { h: 'Free', v: segs[3].time },
    ];
  }
  // SCM 200: the four 50s, then 1st 25 / 2nd 25 / last 25 modeled from real 200 SCM race medians
  // (scm200Per25) — dive-50 first-25 share and final-50 last-25 share, per stroke/sex.
  if (pool === 'SCM' && distance === 200 && stroke !== 'IM' && segs.length === 4) {
    const cells = segs.map((s, i) => ({ h: `${TP_ORD[i]} 50`, v: s.time }));
    const sp = scm200Per25[stroke] && scm200Per25[stroke][sex];
    if (sp) {
      const first50 = segs[0].time, last50 = segs[3].time;
      cells.push({ h: '1st 25', v: first50 * sp.p1 });
      cells.push({ h: '2nd 25', v: first50 * (1 - sp.p1) });
      cells.push({ h: 'Last 25', v: last50 * sp.pLast });
    }
    return cells;
  }
  // Uniform segments get "1st 50 / 2nd 50" style headings; collapsed 400+ rows and IM legs keep
  // the label buildDisplaySegments gave them.
  const uniform = segs.every((s) => !s.count || s.count === 1) && distance % segs.length === 0;
  const seg = uniform ? distance / segs.length : 0;
  return segs.map((s, i) => ({
    h: (stroke === 'IM' || !uniform) ? s.label : `${TP_ORD[i] || (i + 1) + 'th'} ${seg}`,
    v: s.time,
  }));
}

// ===== Training Pace: PDF download =====
// Loaded on demand, never at start-up: ~380 KB that most sessions never need. Resolves
// immediately once they're in memory, and the service worker caches them for offline use
// after the first successful download.
const TP_PDF_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
];
function tpPdfReady() {
  return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
}
function tpLoadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
}
function tpEnsurePdfLibs() {
  if (tpPdfReady()) return Promise.resolve();
  return TP_PDF_LIBS.reduce((p, src) => p.then(() => tpLoadScript(src)), Promise.resolve());
}

// Read the sheet that is ALREADY rendered rather than recomputing the numbers, so the PDF and
// the screen can never drift apart. Returns null when there's nothing to download.
function tpPdfModel() {
  const host = document.getElementById('tp-print');
  const table = host && host.querySelector('table');
  if (!table) return null;
  const title = (host.querySelector('[data-tp-title]') || {}).textContent || 'Training pace';
  const sub = (host.querySelector('[data-tp-sub]') || {}).textContent || '';
  const head = [[...table.querySelectorAll('thead th')].map((t) => t.textContent.trim())];
  const body = [];
  const rules = [];                       // body-row indexes that open a new stroke block
  [...table.querySelectorAll('tbody tr')].forEach((tr) => {
    const opensBlock = /border-t-2/.test(tr.getAttribute('class') || '');
    const ths = [...tr.querySelectorAll('th')];
    const tds = [...tr.querySelectorAll('td')];
    const cells = ths.length
      ? ths.map((t) => t.textContent.trim())                       // IM's own header row
      : tds.map((t, i) => {
          if (i === 0) { const d = t.querySelector('div'); return (d ? d.textContent : t.textContent).trim(); }
          return t.textContent.replace(/\s+/g, ' ').trim();
        });
    if (!cells.length) return;
    if (opensBlock) rules.push(body.length);
    body.push(cells);
  });
  return { title: title.trim(), sub: sub.trim(), head, body, rules };
}

function tpBuildPdf() {
  const m = tpPdfModel();
  if (!m) { showToast('Nothing to download'); return; }
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  const W = doc.internal.pageSize.getWidth();
  const M = 40;
  doc.setFontSize(14); doc.setTextColor(15, 23, 42);
  doc.text(m.title, M, 46);
  if (m.sub) { doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.text(m.sub, M, 61); }
  doc.autoTable({
    head: m.head, body: m.body, startY: 74, margin: { left: M, right: M },
    styles: { fontSize: 9, cellPadding: 4, textColor: [51, 65, 85], lineColor: [226, 232, 240], lineWidth: 0.5 },
    headStyles: { fillColor: [241, 245, 249], textColor: [30, 41, 59], fontStyle: 'bold' },
    columnStyles: { 0: { halign: 'left', fontStyle: 'bold' } },
    didParseCell: (d) => { if (d.column.index > 0) d.cell.styles.halign = 'right'; },
    // Redraw the block rule between strokes, from the same markers the screen uses.
    didDrawCell: (d) => {
      if (d.section === 'body' && d.column.index === 0 && m.rules.indexOf(d.row.index) > -1) {
        doc.setDrawColor(100, 116, 139); doc.setLineWidth(1.2);
        doc.line(M, d.cell.y, W - M, d.cell.y);
      }
    },
  });
  const name = ('Split Compass - ' + m.title).replace(/[^\w\s-]/g, '').replace(/\s+/g, ' ').trim();
  doc.save(name + '.pdf');
}

// ----- Screen: Training Pace -----
function renderTrainingPace() {
  const f = state.tpForm;
  const pools = ['LCM', 'SCM', 'SCY'];
  const dists = tpDistances(f.pool);
  if (dists.length && dists.indexOf(f.distance) < 0) f.distance = dists[0];

  const chip = (on) => `px-3 py-2 rounded-xl text-xs font-semibold border transition ${on
    ? 'bg-cyan-600 text-white border-cyan-600'
    : 'bg-white text-slate-700 border-slate-200 hover:border-cyan-300'}`;
  const group = (label, items, key) => `
    <div class="mb-3">
      <div class="label-cap mb-1.5">${label}</div>
      <div class="flex flex-wrap gap-1.5">
        ${items.length
          ? items.map(([v, lab]) => `<button class="${chip(String(f[key]) === String(v))}" data-tp="${key}" data-tpv="${v}">${lab}</button>`).join('')
          : '<span class="text-xs text-muted">No events for this pool</span>'}
      </div>
    </div>`;

  const rows = state.tpShow ? trainingRows(f.pool, f.distance, f.basis) : null;
  // Stroke tabs: only the strokes with an event at this pool+distance.
  const availStrokes = rows ? TP_STROKES.filter((st) => predict(st, 'M', f.pool, f.distance, 100) || predict(st, 'F', f.pool, f.distance, 100)) : [];
  if (availStrokes.length && availStrokes.indexOf(f.stroke) < 0) f.stroke = availStrokes[0];
  const oneStroke = availStrokes.length <= 1;
  const tpQ = (f.q || '').trim();
  const sxf = f.sexFilter || 'all';
  const shownRows = rows ? rows.filter((r) => (oneStroke || r.stroke === f.stroke) && (sxf === 'all' || r.sex === sxf) && nameMatches(r.name, tpQ)) : null;
  const basisLab = f.basis === 'recent' ? 'most recent' : (f.basis === 'target' ? 'season target' : 'best');
  const TP_ABBR = { Free: 'FR', Back: 'BK', Breast: 'BR', Fly: 'FLY', IM: 'IM' };
  const TP_BLOCK = 'border-t-2 border-slate-400';   // the rule between stroke blocks
  let body = '';
  let anyEstimate = false;
  const fellBackCount = shownRows ? shownRows.filter((r) => r.fellBack).length : 0;

  if (rows && !rows.length) {
    body = `<div class="px-4 py-8 text-center text-sm text-muted">No recorded times for ${f.distance} m ${f.pool} yet.<br><span class="text-xs">Record a race at this distance and the swimmer appears here.</span></div>`;
  } else if (rows && shownRows && !shownRows.length) {
    body = `<div class="px-4 py-8 text-center text-sm text-muted">${tpQ ? 'No swimmer matches \u201c' + tpQ + '\u201d.' : 'No ' + f.stroke + ' times for ' + f.distance + ' m ' + f.pool + ' yet.'}</div>`;
  } else if (rows) {
    const byStroke = {};
    shownRows.forEach((r) => { (byStroke[r.stroke] = byStroke[r.stroke] || []).push(r); });
    // The four form strokes share a column shape at every event, so they share one header.
    // IM's splits are its stroke legs (a 400 IM is 4 legs, not First/Middle/Last), so if its
    // shape differs it gets its own header row inside the same table.
    const FORM = ['Free', 'Back', 'Breast', 'Fly'];
    const present = FORM.filter((s) => byStroke[s]);
    const shapeOf = (st) => {
      const r = byStroke[st].find((x) => x.segs && x.segs.length);
      return r ? tpCells(r.segs, st, f.pool, f.distance, r.splits, r.sex).map((c) => c.h) : [];
    };
    const mainHeads = present.length ? shapeOf(present[0]) : (byStroke.IM ? shapeOf('IM') : []);
    const imHeads = byStroke.IM ? shapeOf('IM') : [];
    const nCol = Math.max(mainHeads.length, imHeads.length);
    anyEstimate = f.pool === 'SCM' && f.distance === 100 && present.length > 0;
    const pad = (arr) => arr.concat(Array(Math.max(0, nCol - arr.length)).fill(null));

    const headRow = (heads, cls) => `<tr class="text-[10px] uppercase tracking-wide text-faint ${cls}">
        <th class="text-left font-semibold py-1.5 pl-3">Swimmer</th>
        <th class="text-right font-semibold px-2">Target</th>
        ${pad(heads).map((h) => `<th class="text-right font-semibold px-2 whitespace-nowrap">${h == null ? '' : h}</th>`).join('')}
      </tr>`;

    const rowHtml = (r, heads, opensBlock) => {
      const cells = pad(tpCells(r.segs, r.stroke, f.pool, f.distance, r.splits, r.sex));
      return `<tr class="tp-row ${opensBlock ? TP_BLOCK : 'border-t border-slate-100'}" data-name="${r.name}">
        <td class="py-2 pl-3">
          <div class="font-semibold text-[13px] whitespace-nowrap">${r.name}</div>
          ${r.date ? `<div class="text-[10px] text-faint leading-none mt-0.5">${r.date}</div>` : ''}
        </td>
        <td class="text-right px-2 whitespace-nowrap"><span class="mono text-[13px] font-bold text-cyan-800">${formatTime(r.total)}</span> <span class="text-[10px] font-semibold text-slate-500">(${TP_ABBR[r.stroke] || r.stroke})</span></td>
        ${cells.map((c, i) => `<td class="text-right px-2 mono text-[13px] ${c && /((1st|2nd|3rd|4th|First|Last|Middle|Mid) ?(50|100)|Fly-Bk|Bk-Br|Br-Fr)$/.test(heads[i] || '') ? 'text-slate-900 font-semibold' : 'text-slate-600'}">${c ? formatTime(c.v) : ''}</td>`).join('')}
      </tr>`;
    };

    let trs = '';
    present.forEach((st, bi) => {
      byStroke[st].forEach((r, ri) => { trs += rowHtml(r, mainHeads, ri === 0 && bi > 0); });
    });
    if (byStroke.IM) {
      const sameShape = JSON.stringify(imHeads) === JSON.stringify(mainHeads);
      if (!sameShape && present.length) trs += headRow(imHeads, TP_BLOCK);
      byStroke.IM.forEach((r, ri) => { trs += rowHtml(r, imHeads, ri === 0 && present.length > 0 && sameShape); });
    }
    body = `<div class="overflow-x-auto"><table class="w-full tp-table"><thead>${headRow(mainHeads, 'border-b-2 border-slate-400')}</thead><tbody>${trs}</tbody></table></div>`;
  }

  const strokeChips = (rows && rows.length && !oneStroke)
    ? availStrokes.map((st) => `<button class="${chip(f.stroke === st)}" data-tp-stroke="${st}">${st}</button>`).join(' ') : '';
  const sexesPresent = rows ? [...new Set(rows.map((r) => r.sex))] : [];
  const sexChips = (rows && rows.length && sexesPresent.length > 1)
    ? [['all', 'All'], ['M', 'Men'], ['F', 'Women']].map(([v, l]) => `<button class="${chip(sxf === v)}" data-tp-sex="${v}">${l}</button>`).join(' ') : '';
  const tpSearch = (rows && rows.length)
    ? `<input type="text" data-tp-search value="${f.q || ''}" placeholder="Search swimmer" class="w-full mt-2 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-cyan-300 placeholder:text-muted" />` : '';
  const sheet = rows && rows.length ? `
    <div id="tp-print" class="bg-white">
      <div class="px-3 pt-3 pb-1">
        <div data-tp-title class="text-[15px] font-bold text-slate-900">${f.distance} m ${f.pool} — training pace</div>
      </div>
      ${body}
    </div>` : body;

  return `
    <div class="statusbar"></div>
    <div class="px-5 pt-3 pb-3 flex items-center gap-3 bg-white no-print">

// Expected last-15 SR: the swimmer's own early-race SR × the elite late-race ratio.
// Ratio = SR over the last 20 m of the race (excluding the final 5 m, i.e. the last-25
// video segment) ÷ early-race SR, per swimmer, averaged over the Paris 2024 + Fukuoka
// 2023 finals (50m_sprint_data.csv, sr_per25_by_swimmer.csv). Early-race baseline
// matches what the coach types: 50 → 1st-25 SR · 100 → first-50 SR · 200 → mean SR of
// the first three 50s. Sprints decay (~-2…-4%); 200s finish faster (Breast M +28%).
const mmSrDrop = {
  '50':  { Free: { M: 0.964, F: 0.961 }, Back: { M: 0.963, F: 0.971 }, Fly: { M: 0.981, F: 0.971 }, Breast: { M: 0.997, F: 0.994 } },
  '100': { Free: { M: 0.978, F: 0.966 }, Back: { M: 0.978, F: 0.952 }, Fly: { M: 0.983, F: 0.978 }, Breast: { M: 1.070, F: 1.046 } },
  '200': { Free: { M: 1.051, F: 1.029 }, Back: { M: 1.073, F: 0.993 }, Fly: { M: 1.016, F: 1.005 }, Breast: { M: 1.285, F: 1.148 } },
};
function expectedLast15(race) {
  const d = mmSrDrop[String(race.distance)];
  const t = d && d[race.stroke];
  const fac = t && t[race.sex];
  if (!fac) return null; // IM and 400+ have no reference
  const sr = race.sr || {};
  const num = (x) => { const v = parseFloat(x); return isFinite(v) && v > 0 ? v : null; };
  let base;
  if (race.distance === 50) base = num(sr.first25);
  else if (race.distance === 100) base = num(sr.r0);
  else {
    const xs = [num(sr.r0), num(sr.r1), num(sr.r2)].filter(v => v != null);
    base = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
  }
  return base ? base * fac : null;
}

// ----- Screen: Race analysis -----
function renderRaceAnalysis() {
  const race = state.race;
  if (!race) return renderRoster();
  const c = buildRaceComparison(race);
  if (!c) return `<div class="statusbar"></div><div class="p-8 text-center text-slate-500 text-sm">No pacing data for this event.</div>`;
  const beat = c.delta <= 0.05;
  const deltaColor = beat ? 'text-emerald-700' : 'text-rose-600';
  const deltaBg = beat ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100';
  const sr = race.sr || {};
  // Data-entry check: the total typed at the top vs what the splits add up to.
  // (LCM 50 and 400+ take the total directly, so they can't disagree; SCM 50 and the
  // 100/200 sum their splits, so this catches a typo.)
  const _mm = (race.targetSeconds > 0 && c.actualTotal > 0) ? c.actualTotal - race.targetSeconds : 0;
  const mismatch = Math.abs(_mm) > 0.10 ? _mm : null;
  const expL = PUBLIC_BUILD ? null : expectedLast15(race); // V1 keeps stroke rate simple: no expected last-15
  const defs = raceRowDefs(race.stroke, race.distance, race.pool);
  const pt = predict(race.stroke, race.sex, race.pool, race.distance, race.targetSeconds);
  const predAt = defs.map(def => {
    if (!pt) return null;
    if (def.kind === 'total') return race.targetSeconds;
    if (def.kind === 'mid') return pt.splits[1];
    if (def.kind === 'hundo') return pt.splits[2 * def.idx] + pt.splits[2 * def.idx + 1];
    const i = def.idxFromEnd != null ? pt.splits.length - 1 - def.idxFromEnd : def.idx;
    return pt.splits[i];
  });
  const GT = 'display:grid;grid-template-columns:minmax(0,1fr) 4rem 4rem 2.9rem 2.1rem;gap:4px;align-items:center;';
  const head = `<div style="${GT}" class="px-3 pt-3 pb-1"><span class="label-cap text-muted">Split</span><span class="label-cap text-muted" style="text-align:right;">Ideal</span><span class="label-cap text-muted" style="text-align:right;">Swam</span><span class="label-cap text-muted" style="text-align:right;">Δ</span><span class="label-cap text-muted" style="text-align:center;">SR</span></div>`;
  // Running cumulatives shown in () beside each split — skipped on the first row (it would
  // repeat the split), on the averaged middle row, and on single-row (50 m) events.
  let cumP = 0, cumA = 0;
  const splitRows = c.rows.map((r, i) => {
    const def = defs[i], pred = predAt[i];
    const d = (r.actual != null && pred != null) ? r.actual - pred : null;
    const dc = d == null ? 'text-slate-400' : (d > 0.05 ? 'text-rose-600' : (d < -0.05 ? 'text-emerald-700' : 'text-slate-500'));
    if (pred != null && def.kind !== 'total' && def.kind !== 'mid') cumP += pred;
    if (r.actual != null && def.kind !== 'total' && def.kind !== 'mid') cumA += r.actual;
    // No cumulative on the first split (repeats it) or the last (that's the finish time).
    const showCum = i > 0 && i < c.rows.length - 1 && def.kind !== 'total' && def.kind !== 'mid';
    const cumTag = (v) => showCum ? `<div class="mono text-[10px] text-faint leading-none mt-0.5">(${formatTime(v)})</div>` : '';
    return `<div style="${GT}" class="px-3 py-2 border-b border-slate-100 last:border-0">
      <div class="text-sm font-semibold text-slate-700 leading-tight">${r.label}</div>
      <div class="mono text-xs text-slate-500 leading-tight" style="text-align:right;">${pred != null ? formatTime(pred) : '—'}${pred != null ? cumTag(cumP) : ''}</div>
      <div class="mono text-sm font-semibold text-slate-800 leading-tight" style="text-align:right;">${r.actual != null ? formatTime(r.actual) : '—'}${r.actual != null ? cumTag(cumA) : ''}</div>
      <div class="mono text-xs font-semibold ${dc}" style="text-align:right;">${d != null ? (d >= 0 ? '+' : '') + d.toFixed(2) : ''}</div>
      <div class="mono text-xs text-slate-600" style="text-align:center;">${sr[def.key] != null && sr[def.key] !== '' ? sr[def.key] : '—'}</div>
    </div>`;
  }).join('');

  // --- comparisons on demand: their best, or their previous race of the same event ---
  // Candidates = same swimmer + distance + stroke + pool, excluding this swim.
  const cmpPool = state.saved.filter(s => s.kind === 'race' && race.sid && s.sid === race.sid && s.id !== race.id
    && s.distance === race.distance && s.stroke === race.stroke && s.pool === race.pool)
    .map(s => ({ s: s, c: buildRaceComparison(s) }))
    .filter(x => x.c && x.c.actualTotal > 0);
  const cmpBest = cmpPool.reduce((m, x) => (!m || x.c.actualTotal < m.c.actualTotal) ? x : m, null);
  const cmpLast = cmpPool.slice().sort((a, b) =>
    String(b.s.date || '').localeCompare(String(a.s.date || '')) || String(b.s.id).localeCompare(String(a.s.id)))[0] || null;
  // Saved target (Set-target-time plan) for this exact event — prefer the starred one.
  const cmpTargetList = state.saved.filter(s => (!s.kind || s.kind === 'plan') && race.sid && s.sid === race.sid
    && s.distance === race.distance && s.stroke === race.stroke && s.pool === race.pool && s.targetSeconds > 0);
  const cmpTarget = cmpTargetList.find(s => s.isTarget) || cmpTargetList[cmpTargetList.length - 1] || null;
  // Predicted per-split times for a total (mirrors predAt) — the target's column is predicted.
  const predForTotal = (seconds) => {
    const pt2 = predict(race.stroke, race.sex, race.pool, race.distance, seconds);
    if (!pt2) return null;
    return defs.map(def => {
      if (def.kind === 'total') return seconds;
      if (def.kind === 'mid') return pt2.splits[1];
      if (def.kind === 'hundo') return pt2.splits[2 * def.idx] + pt2.splits[2 * def.idx + 1];
      const i = def.idxFromEnd != null ? pt2.splits.length - 1 - def.idxFromEnd : def.idx;
      return pt2.splits[i];
    });
  };
  const cmpBtn = (mode, label, avail) => avail
    ? `<button class="flex-1 rounded-xl px-3 py-2.5 text-xs font-semibold transition ${state.cmpMode === mode ? 'bg-cyan-600 text-white shadow' : 'bg-white border border-slate-200 text-slate-700 hover:border-cyan-300 hover:bg-cyan-50/40'}" data-action="cmp-mode" data-mode="${mode}">${label}</button>`
    : '';
  // All three slots are always accounted for. A mode with no data becomes a prompt
  // explaining what would unlock it, never a silently absent button.
  const evName = `${race.distance} ${race.stroke} ${race.pool}`;
  const cmpButtons = `<div class="space-y-2">
      ${(cmpBest || cmpLast || cmpTarget) ? `<div class="flex gap-2 flex-wrap">${cmpBtn('best', 'Compare to best time', cmpBest)}${cmpBtn('last', 'Compare to last race', cmpLast)}${cmpBtn('target', 'Compare to target time', cmpTarget)}</div>` : ''}
      ${!cmpTarget ? `<button class="w-full rounded-xl px-3 py-2.5 text-xs font-semibold bg-white border border-dashed border-cyan-300 text-cyan-800 hover:bg-cyan-50/40 active:scale-[0.99] transition" data-action="cmp-set-target">Set a target time for ${evName} to compare</button>` : ''}
      ${(!cmpBest && !cmpLast) ? `<div class="text-[11px] text-muted leading-snug px-1">Record another ${evName} and you can compare this one to your best and most recent.</div>` : ''}
    </div>`;

  let bestCard = '';
  let ref = null;
  if (state.cmpMode === 'best' && cmpBest) ref = { otherT: cmpBest.c.actualTotal, otherRows: cmpBest.c.rows.map(r => ({ label: r.label, actual: r.actual })), entry: cmpBest.s, col: 'Best', head: 'vs their best' };
  else if (state.cmpMode === 'last' && cmpLast) ref = { otherT: cmpLast.c.actualTotal, otherRows: cmpLast.c.rows.map(r => ({ label: r.label, actual: r.actual })), entry: cmpLast.s, col: 'Last', head: 'vs last race' };
  else if (state.cmpMode === 'target' && cmpTarget) { const tp = predForTotal(cmpTarget.targetSeconds); ref = { otherT: cmpTarget.targetSeconds, otherRows: tp ? defs.map((def, i) => ({ label: def.label, actual: tp[i] })) : c.rows.map(r => ({ label: r.label, actual: null })), entry: cmpTarget, col: 'Target', head: 'vs target', predicted: true }; }
  if (ref) {
    const other = ref.entry, otherT = ref.otherT;
    const gap = c.actualTotal - otherT;
    const gc = gap > 0.005 ? 'text-rose-600' : 'text-emerald-700';
    const beats = state.cmpMode === 'best' && c.actualTotal < otherT;
    // Running cumulatives under each split (target mode only), same format as the
    // ideal-splits table above: skipped on the first/last row and on total/mid rows.
    const showCums = !!ref.predicted;
    let cumR = 0, cumC = 0;
    const rows = ref.otherRows.map((br, i) => {
      const cur = c.rows[i];
      if (!cur) return '';
      const def = defs[i];
      const notAgg = !!def && def.kind !== 'total' && def.kind !== 'mid';
      const dd = (cur.actual != null && br.actual != null) ? cur.actual - br.actual : null;
      const ddc = dd == null ? 'text-slate-400' : (dd > 0.05 ? 'text-rose-600' : (dd < -0.05 ? 'text-emerald-700' : 'text-slate-500'));
      if (br.actual != null && notAgg) cumR += br.actual;
      if (cur.actual != null && notAgg) cumC += cur.actual;
      const showCum = showCums && i > 0 && i < ref.otherRows.length - 1 && notAgg;
      const cumTag = (v) => showCum ? `<div class="mono text-[10px] text-faint leading-none mt-0.5">(${formatTime(v)})</div>` : '';
      return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 4rem 4rem 3rem;gap:4px;align-items:center;" class="px-3 py-2 border-b border-slate-100 last:border-0">
